/* ---- src/audio/audio.config.js ---- */
/* src/audio/audio.config.js — round 19: prosedurel muzik katmani sabitleri. */
/* DIKKAT: `Object.assign(CONFIG, { MUSIC: {...} })` yazilirsa core paketinin
   ayni turda ekledigi MUSIC.intensity/bpm anahtarlari EZILIR ve oyun ilk sim
   adiminda coker (olculdu: TypeError, `intensity.play` undefined). Paylasilan
   anahtar EZILMEZ, GENISLETILIR. */
/* Round 22: fircasiz motor ugultusu (Sound.hover). CONFIG.SOUND core'undur;
   EZMEDEN genisletiyoruz — `Object.assign(CONFIG.SOUND, {...})` maxConcurrent
   ve masterGain'i korur. Ic `hover` nesnesi de varsa uzerine yazilmaz. */
/* Round 23: mix zinciri (limiter + efekt veri yolu + mekan gonderisi) ve
   muzik katman tonlari. Ayni kural: ic nesneler `Object.assign(defaults,
   mevcut)` ile birlestirilir, mevcut degerler kazanir. */
Object.assign(CONFIG.SOUND, {
    hover: Object.assign({
        baseFreq: 85,          // Hz — level=1.0'daki temel frekans
        levelMin: 0.6,         // level kirpma araligi (hiza gore perde/genlik)
        levelMax: 1.0,
        gain: 0.08,            // surekli vizilti seviyesi (atis sesinin onune gecmez)
        amHz: 28,              // rotor donme hissi: genlik modulasyonu frekansi
        amDepth: 0.02,         // modulasyon derinligi (level ile olceklenir)

/* ------------------------------------------------------------------ Clock
   Sabit adim sim (120 Hz akumulator) + interpolasyonlu cizim.
   Determinizm sart: ayni girdi, iki farkli kare hizinda birebir ayni pozisyon.
   tick(rawDtMs) harici cagrilirsa rAF yerine dogrudan ilerletir.            */

/* ---- src/core/Clock.js ---- */
class Clock {
  constructor(hz) { this.step = 1 / hz; this.acc = 0; }
  /* Bir rawDt kadar sim ilerletir. Geri donen deger: cizim icin alpha (0..1).
     Autotest'te her cagri tam sayi adim isledigi icin alpha her zaman 0 olur. */
  advance(rawDtMs) {
    let dt = Math.min(rawDtMs / 1000, CONFIG.MAX_DT);
    this.acc += dt;
    let n = 0;
    while (this.acc >= this.step - 1e-9) { this.acc -= this.step; n++; }
    return { steps: n, alpha: this.acc / this.step };
  }
}

/* ------------------------------------------------------------------- Input
   Klavye (oklar/WASD, Space/Z ates, P duraklat, Esc menu) + dokunmatik
   (birebir parmak takibi). e.repeat yok sayilir. Autotest kancasi ayni
   giris noktalarini (setKey / touchMove) cagirmali.                        */

/* ---- src/core/Pool.js ---- */
class Pool {
  constructor(size, factory) {
    this.items = [];
    for (let i = 0; i < size; i++) { const o = factory(); o.active = false; this.items.push(o); }
    this.exhausted = 0;
  }
  acquire() {
    for (const o of this.items) if (!o.active) { o.active = true; return o; }
    this.exhausted++; return null;
  }
  forEach(fn) { for (const o of this.items) if (o.active) fn(o); }
  count() { let n = 0; for (const o of this.items) if (o.active) n++; return n; }
  reset() { for (const o of this.items) o.active = false; this.exhausted = 0; }
}

/* ------------------------------------------------------------- FX (round 6)
   Vurus geri bildirimi + patlama. Yalnizca CIZIM katmani — sim'e dokunmaz,
   determinizm bozulmaz. Sıcak dongude nesne tahsisi yok (havuz + yeniden
   kullanilan alanlar). Boyut basina canvas onbellegi YASAK: olceklemeyi
   drawImage'in hedef boyutuna birakiriz.                               */

/* Zengin patlama (round 10): uc sprite katmani + sok dalgasi + kivilcim.
   1) boom_flash — lighter, 110 ms, olcek 0.4→2.0, alfa 1→0
   2) boom_fire  — lighter, 260 ms, olcek 0.55→2.1, rastgele dondurulmus,
      alfa sonumu (1-t)^2.8 (dogrusal sonum beyaz cekirdegi griye cevirirdi)
   3) boom_smoke — normal karisim, 210 ms gecikmeli, 560 ms, alfa <= 0.16,
      hafif yukari suruklenir
   Sprite yoksa prosedurel fallback calisir (Assets.draw).                */

/* ---- src/core/Assets.js ---- */
class Assets {
  constructor(manifest) {
    this.manifest = manifest;
    this.img = {};        // name -> HTMLImageElement (yuklendiyse)
    this.fallback = {};   // name -> offscreen canvas (prosedurel)
    this._whiteCache = {}; // name -> beyaz tint'lenmis offscreen canvas
    this.n_png = 0; this.n_proc = 0;
    this._loadAll();
  }
  _loadAll() {
    for (const s of this.manifest.sprites) {
      const im = new Image();
      im.onload = () => { this.img[s.name] = im; this.n_png++; this._report(); };
      im.onerror = () => { this.fallback[s.name] = this._makeFallback(s); this.n_proc++; this._report(); };
      im.src = 'assets/' + s.file;
    }
  }
  _report() {
    console.log(`ready (${this.n_png} PNG, ${this.n_proc} procedural)`);
  }
  get(name) { return this.img[name] || null; }
  has(name) { return !!this.img[name]; }
  draw(ctx, name, x, y, w, h) {
    const im = this.img[name];
    if (im) { ctx.drawImage(im, x, y, w, h); return; }
    const fb = this.fallback[name];
    if (fb) ctx.drawImage(fb, x, y, w, h);
  }
  /* Beyaz tint'lenmis kopya (vurus parlamasi icin). source-atop + fillRect
     KULLANILMAZ — tuval geneline calisir ve ekrana dikdortgen birakir.
     Sprite'in kendi boyutunda offscreen canvas'a cizilir, alpha korunur. */
  whiteTint(name) {
    let w = this._whiteCache[name];
    if (w) return w;
    const src = this.img[name] || this.fallback[name];
    if (!src) return null;
    const sw = src.width || 64, sh = src.height || 64;
    const c = document.createElement('canvas');
    c.width = sw; c.height = sh;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0, sw, sh);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, sw, sh);
    this._whiteCache[name] = w = c;
    return w;
  }
  /* ---------------------------------------------------------- prosedurel */
  _makeFallback(s) {
    const c = document.createElement('canvas');
    c.width = s.width; c.height = s.height;
    const g = c.getContext('2d');
    const K = s.kind;
    /* Round 12: roket — ince dikey fitil + parlak uc (fx degil, ayri yol) */
    if (s.name === 'rocket') { this._fbRocket(g, s); return c; }
    if (K === 'tile') this._fbCity(g, s);
    else if (K === 'building') this._fbBuilding(g, s);
    else if (K === 'landmark') this._fbLandmark(g, s);
    else if (K === 'unit' || K === 'boss') this._fbDrone(g, s);
    else if (K === 'fx') this._fbFx(g, s);
    else if (K === 'ui') this._fbUi(g, s);
    return c;
  }
  /* Roket prosedurel yedeği: ince turuncu fitil, beyaz uc. */
  _fbRocket(g, s) {
    const w = s.width, h = s.height;
    g.clearRect(0, 0, w, h);
    // fitil govdesi
    g.fillStyle = '#c8502a';
    g.fillRect(w * 0.35, h * 0.25, w * 0.3, h * 0.65);
    // uc (parlak)
    g.fillStyle = '#ffd24a';
    g.beginPath();
    g.moveTo(w / 2, 0); g.lineTo(w * 0.7, h * 0.28); g.lineTo(w * 0.3, h * 0.28);
    g.closePath(); g.fill();
    // kuyruk alevi
    g.fillStyle = 'rgba(255,180,60,0.8)';
    g.beginPath();
    g.moveTo(w * 0.4, h * 0.9); g.lineTo(w / 2, h); g.lineTo(w * 0.6, h * 0.9);
    g.closePath(); g.fill();
  }
  _fbCity(g, s) {
    const w = s.width, h = s.height;
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#1a2340'); grd.addColorStop(1, '#0c1120');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    // bina siluetleri (deterministik tohum)
    let seed = 7;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    g.fillStyle = '#141b30';
    for (let i = 0; i < 26; i++) {
      const bw = 20 + rnd() * 40, bh = 60 + rnd() * 200;
      const bx = rnd() * w, by = rnd() * (h - bh);
      g.fillRect(bx, by, bw, bh);
      // pencereler
      g.fillStyle = 'rgba(255,210,120,0.25)';
      for (let wy = by + 6; wy < by + bh - 6; wy += 12)
        for (let wx = bx + 4; wx < bx + bw - 4; wx += 10)
          if (rnd() > 0.5) g.fillRect(wx, wy, 3, 4);
      g.fillStyle = '#141b30';
    }
  }
  _fbBuilding(g, s) {
    const w = s.width, h = s.height;
    const grd = g.createLinearGradient(0, 0, w, 0);
    grd.addColorStop(0, '#2a3550'); grd.addColorStop(1, '#1a2238');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,200,110,0.3)';
    for (let y = 8; y < h - 8; y += 14)
      for (let x = 6; x < w - 6; x += 12)
        if ((x * 7 + y * 13) % 5 > 1) g.fillRect(x, y, 4, 5);
  }
  _fbLandmark(g, s) {
    const w = s.width, h = s.height;
    g.fillStyle = '#3a4560';
    g.beginPath();
    g.moveTo(w/2, 0); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,220,140,0.4)';
    for (let y = h*0.3; y < h; y += 16) g.fillRect(w*0.2, y, w*0.6, 3);
  }
  _fbDrone(g, s) {
    const w = s.width, h = s.height;
    g.clearRect(0, 0, w, h);
    const cx = w/2, cy = h/2;
    // gorv
    g.fillStyle = '#5a6a8a';
    g.beginPath(); g.ellipse(cx, cy, w*0.22, h*0.16, 0, 0, Math.PI*2); g.fill();
    // rotor kollar
    g.strokeStyle = '#7a8aaa'; g.lineWidth = Math.max(3, w*0.05);
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx+dx*w*0.32, cy+dy*h*0.32); g.stroke();
    }
    // rotor diskleri
    g.fillStyle = 'rgba(180,200,230,0.5)';
    for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      g.beginPath(); g.arc(cx+dx*w*0.32, cy+dy*h*0.32, w*0.14, 0, Math.PI*2); g.fill();
    }
    // kamera/gun
    g.fillStyle = '#ff5555'; g.beginPath(); g.arc(cx, cy+h*0.1, w*0.06, 0, Math.PI*2); g.fill();
  }
  _fbFx(g, s) {
    const w = s.width, h = s.height;
    g.clearRect(0, 0, w, h);
    const grd = g.createRadialGradient(w/2, h/2, 2, w/2, h/2, w/2);
    grd.addColorStop(0, 'rgba(255,240,180,0.95)');
    grd.addColorStop(0.4, 'rgba(255,170,60,0.7)');
    grd.addColorStop(1, 'rgba(255,120,20,0)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
  }
  _fbUi(g, s) {
    const w = s.width, h = s.height;
    g.clearRect(0, 0, w, h);
    g.strokeStyle = '#6fe3ff'; g.lineWidth = 3;
    g.beginPath(); g.arc(w/2, h/2, w*0.35, 0, Math.PI*2); g.stroke();
    g.beginPath();
    g.moveTo(w/2, 4); g.lineTo(w/2, h*0.25);
    g.moveTo(w/2, h-4); g.lineTo(w/2, h*0.75);
    g.moveTo(4, h/2); g.lineTo(w*0.25, h/2);
    g.moveTo(w-4, h/2); g.lineTo(w*0.75, h/2);
    g.stroke();
  }
}

/* -------------------------------------------------------------------- Sound
   Prosedurel WebAudio. Dosya yok. AudioContext askiyken hic hata firlatmaz.
   Ilk kullanici dokunusu/tusunda acilir (mobilde sart). M ile sessize alma.
   Ses uretimi simulasyonu ETKILEMEZ — determinizm testleri aynen gecmeli.    */

/* ---- src/core/Renderer.js ---- */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.scale = 1;                       // arka bellek olcegi (1..2)
    this.frameTimes = [];                 // son 40 kare sure (ms)
    this.lastChange = 0;                  // son ornek degisikligi (perf.now)
    this.drawCalls = 0; this.saveCalls = 0;
    this.resize();
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = this.canvas.clientWidth || CONFIG.W;
    const cssH = this.canvas.clientHeight || CONFIG.H;
    // arka bellek = min(css*dpr, ic cozunurluk * olcek)
    const target = Math.min(cssW * dpr, CONFIG.W * this.scale);
    const ratio = CONFIG.H / CONFIG.W;
    this.bw = Math.round(target);
    this.bh = Math.round(target * ratio);
    if (this.canvas.width !== this.bw) this.canvas.width = this.bw;
    if (this.canvas.height !== this.bh) this.canvas.height = this.bh;
    this.ctx.imageSmoothingEnabled = true;   // piksel-art DEGIL
    this.ctx.imageSmoothingQuality = 'high';
  }
  recordFrame(ms) {
    this.frameTimes.push(ms);
    if (this.frameTimes.length > CONFIG.RES.windowFrames) this.frameTimes.shift();
    const now = performance.now();
    if (now - this.lastChange < CONFIG.RES.changeInterval * 1000) return;
    if (this.frameTimes.length < CONFIG.RES.windowFrames) return;
    const med = this._median(this.frameTimes);
    if (med > CONFIG.RES.dropBelow && this.scale > CONFIG.RES.minScale) {
      this.scale = Math.max(CONFIG.RES.minScale, this.scale - 0.25);
      this.lastChange = now; this.resize();
    } else if (med < CONFIG.RES.raiseAbove && this.scale < CONFIG.RES.maxScale) {
      this.scale = Math.min(CONFIG.RES.maxScale, this.scale + 0.25);
      this.lastChange = now; this.resize();
    }
  }
  _median(a) {
    const s = a.slice().sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
  }
  begin() {
    this.drawCalls = 0; this.saveCalls = 0;
    const c = this.ctx;
    c.setTransform(this.bw / CONFIG.W, 0, 0, this.bh / CONFIG.H, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.fillStyle = '#05070d'; c.fillRect(0, 0, CONFIG.W, CONFIG.H);
  }
  save() { this.ctx.save(); this.saveCalls++; }
  restore() { this.ctx.restore(); }
  debugOverlay(state) {
    if (!CONFIG.DEBUG) return;
    const c = this.ctx;
    c.save();
    c.font = '12px monospace'; c.fillStyle = '#7CFC00';
    const fps = state.fps ? (1000 / state.fps).toFixed(0) : '-';
    c.fillText(`FPS ${fps}  frame ${state.frameMs.toFixed(2)}ms`, 8, 16);
    c.fillText(`scale ${this.scale.toFixed(2)}  draw ${this.drawCalls}  save ${this.saveCalls}`, 8, 30);
    c.fillText(`bullets ${state.bulletsActive}/${CONFIG.FIRE.pool}  heap ok`, 8, 44);
    if (state.enemies) c.fillText(`enemies ${state.enemies.length}  score ${state.score}`, 8, 58);
    // hitbox
    if (state.player) {
      const p = state.player;
      c.strokeStyle = '#ff0'; c.lineWidth = 1;
      c.strokeRect(p.x - CONFIG.PLAYER.half, p.y - CONFIG.PLAYER.half,
                   CONFIG.PLAYER.size, CONFIG.PLAYER.size);
    }
    c.restore();
  }
}

/* --------------------------------------------------------------------- Pool
   Sıcak dongude `new` yok. Tushenme yoksa reuse.                          */

/* ---- src/input/Input.js ---- */
class Input {
  constructor(game) {
    this.game = game;
    this.keys = new Set();
    this.touchX = null; this.touchY = null;
    this.touchDX = null; this.touchDY = null;
    this.baseX = 0; this.baseY = 0;
    /* _activePointer hic baslatilmamisti (undefined). Asagidaki korumalar
       `=== null` ile yaziliydi ve undefined'i yakalamiyordu: parmak basili
       olmadan gelen tek bir pointermove bile _originX'i undefined okuyup
       touchDX'i NaN yapiyor, oyuncu konumu NaN'a dusuyor ve cizim
       createRadialGradient'te patliyordu. */
    this._activePointer = null;
    this._originX = 0; this._originY = 0;
    /* Dash: tek seferlik bayrak + yön. consumeDash() okuyup sıfırlar. */
    this._dashQueued = false;
    this._dashDirX = 0; this._dashDirY = -1; // varsayılan: yukarı
    this._lastTouchTime = 0;
    this._lastSlideX = 0; this._lastSlideY = 0;
    /* Sub-dron firlatma: tek seferlik bayrak + ikinci parmak takibi */
    this._subLaunchQueued = false;
    this._secondPointerId = null;
    this._bind();
  }
  _bind() {
    const down = (e) => {
      if (e.repeat) return;
      const k = this._map(e.code);
      if (k) { this.keys.add(k); e.preventDefault(); }
      // Ilk tus basisinda sesi ac (mobilde sart)
      this.game.sound.unlock();
      if (k === 'pause') this.game.togglePause();
      if (k === 'menu')  this.game.toMenu();
      if (k === 'mute')  this.game.sound.toggleMute();
      /* Round 12: Q ile elle silah degistirme */
      if (k === 'switch') this.game.switchWeapon();
      /* Dash: Shift veya K — yön mevcut hareket yönü, yoksa yukarı */
      if (k === 'dash') this._queueDashFromAxis();
      /* Sub-dron firlatma: E veya F */
      if (k === 'sublaunch') this._subLaunchQueued = true;
    };
    const up = (e) => { const k = this._map(e.code); if (k) this.keys.delete(k); };
    addEventListener('keydown', down);
    addEventListener('keyup', up);
    const cv = this.game.canvas;
    /* Dokunmatikte oyun OYNANAMIYORDU: menude yalnizca "SPACE" yaziyordu, ekrana
       dokunmak hicbir sey yapmiyordu ve ates icin tus yoktu. Uc sey eklendi:
       dokunus oyunu baslatir/yeniden baslatir, parmak ekranda oldugu surece ates
       acilir, hareket birebir bagil takiple olur.                                */
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      this.game.sound.unlock();
      const st = this.game.state;
      /* Round 12: dron secim ekraninda dokunmatik bolgeler —
         sol ucte bir: sola, orta: baslat, sag ucte bir: saga.
         Durum 'shipselect' KALMALI, oyun baslamamali (orta disinda). */
      if (st === 'shipselect') {
        const p = this._canvasPos(e);
        const third = CONFIG.W / 3;
        if (p.x < third) this.game.shipSelectLeft();
        else if (p.x > CONFIG.W - third) this.game.shipSelectRight();
        else this.game.confirmShipSelect();   // orta: baslat
        return;
      }
      if (st === 'menu' || st === 'gameover' || st === 'victory') { this.game.toShipSelect(); return; }
      if (st === 'pause') { this.game.togglePause(); return; }
      /* İki parmakla dokunus: sub-dron firlatma. Birincil parmak zaten ekrandaysa
         ve ikinci parmak da basiliyorsa, dash degil sub-launch tetikle. */
      if (this._activePointer != null && this._secondPointerId == null) {
        this._secondPointerId = e.pointerId;
        this._subLaunchQueued = true;
        return;
      }
      /* Çift dokunuş dash: 300 ms içinde ikinci dokunuş */
      const now = performance.now();
      if (now - this._lastTouchTime < 300) {
        this._queueDashFromSlide();
        this._lastTouchTime = 0; // üçüncü dokunuş tetiklemesin
      } else {
        this._lastTouchTime = now;
      }
      this._beginTouch(e);
    }, { passive: false });
    cv.addEventListener('pointermove', (e) => {
      if (this._activePointer == null) return;
      e.preventDefault();
      this._moveTouch(e);
    }, { passive: false });
    const endTouch = (e) => {
      /* Ikinci parmak kalktiysa sadece onu temizle; birincil devam etsin */
      if (this._secondPointerId != null && e.pointerId === this._secondPointerId) {
        this._secondPointerId = null;
        return;
      }
      this.releaseTouch();
    };
    addEventListener('pointerup', endTouch);
    addEventListener('pointercancel', endTouch);
  }
  _map(code) {
    switch (code) {
      case 'ArrowLeft': case 'KeyA': return 'left';
      case 'ArrowRight': case 'KeyD': return 'right';
      case 'ArrowUp': case 'KeyW': return 'up';
      case 'ArrowDown': case 'KeyS': return 'down';
      case 'Space': case 'KeyZ': return 'fire';
      case 'ShiftLeft': case 'ShiftRight': case 'KeyK': return 'dash';
      case 'KeyP': return 'pause';
      case 'KeyM': return 'mute';
      case 'KeyQ': return 'switch';   // Round 12: elle silah degistirme
      case 'KeyE': case 'KeyF': return 'sublaunch';
      case 'Escape': return 'menu';
    }
    return null;
  }
  _canvasPos(e) {
    const r = this.game.canvas.getBoundingClientRect();
    const scale = CONFIG.W / (r.width || CONFIG.W);
    return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * scale };
  }
  _beginTouch(e) {
    this._activePointer = e.pointerId;
    const p = this._canvasPos(e);
    this._originX = p.x; this._originY = p.y;
    this.touchDX = 0; this.touchDY = 0;
    const pl = this.game.player;
    this.baseX = pl ? pl.x : CONFIG.W / 2;   // dokunus anindaki dron konumu
    this.baseY = pl ? pl.y : CONFIG.H - 140;
    this.keys.add('fire');                   // parmak ekranda: otomatik ates
  }
  _moveTouch(e) {
    const p = this._canvasPos(e);
    this.touchDX = p.x - this._originX;
    this.touchDY = p.y - this._originY;
    /* Son kayma yönünü dash için sakla */
    this._lastSlideX = this.touchDX;
    this._lastSlideY = this.touchDY;
  }
  /* Autotest / programatik giris — klavye ile ayni noktaya yazar. */
  setKey(name, on) { if (on) this.keys.add(name); else this.keys.delete(name); }
  /* Autotest kancasi GERCEK yolu kullanir: kanca ile sahaya cikan kod ayrisirsa
     harness farki goremez (game/ projesinde tam bu yasandi). */
  touchStart(x, y) {
    this._activePointer = -1;
    this._originX = x; this._originY = y;
    this.touchDX = 0; this.touchDY = 0;
    const pl = this.game.player;
    this.baseX = pl ? pl.x : CONFIG.W / 2;
    this.baseY = pl ? pl.y : CONFIG.H - 140;
    this.keys.add('fire');
  }
  touchMove(x, y) {
    if (this._activePointer == null) this.touchStart(x, y);
    this.touchDX = x - this._originX; this.touchDY = y - this._originY;
    this._lastSlideX = this.touchDX;
    this._lastSlideY = this.touchDY;
  }
  releaseTouch() {
    this.touchX = null; this.touchY = null;
    this.touchDX = null; this.touchDY = null;
    this._activePointer = null;
    this._secondPointerId = null;
    this._lastSlideX = 0; this._lastSlideY = 0;
    this.keys.delete('fire');
  }
  axis() {
    let ax = 0, ay = 0;
    if (this.keys.has('left'))  ax -= 1;
    if (this.keys.has('right')) ax += 1;
    if (this.keys.has('up'))    ay -= 1;
    if (this.keys.has('down'))  ay += 1;
    if (ax && ay) { const inv = 1 / Math.SQRT2; ax *= inv; ay *= inv; } // carpaz normalize
    return { ax, ay };
  }
  firing() { return this.keys.has('fire'); }
  /* Dash: tek seferlik bayrak + yön. Player her sim adımında okur;
     tüketilirse false döner. Yön normalize edilmiş birim vektördür. */
  consumeDash() {
    if (!this._dashQueued) return null;
    this._dashQueued = false;
    return { x: this._dashDirX, y: this._dashDirY };
  }
  _queueDashFromAxis() {
    const a = this.axis();
    const len = Math.hypot(a.ax, a.ay);
    if (len > 0) {
      this._dashDirX = a.ax / len;
      this._dashDirY = a.ay / len;
    } else {
      this._dashDirX = 0; this._dashDirY = -1; // yukarı
    }
    this._dashQueued = true;
  }
  _queueDashFromSlide() {
    const len = Math.hypot(this._lastSlideX, this._lastSlideY);
    if (len > 4) { // anlamlı kayma yoksa varsayılan yön
      this._dashDirX = this._lastSlideX / len;
      this._dashDirY = this._lastSlideY / len;
    } else {
      this._dashDirX = 0; this._dashDirY = -1;
    }
    this._dashQueued = true;
  }
  /* Sub-dron firlatma: tek seferlik bayrak. Player her sim adiminda okur;
     tuketilirse false doner. */
  consumeSubLaunch() {
    if (!this._subLaunchQueued) return false;
    this._subLaunchQueued = false;
    return true;
  }
}

/* ---- src/audio/sfx.data.js ---- */
/* src/audio/sfx.data.js — URETILEN DOSYA, ELLE DUZENLEME.

/* ------------------------------------------------------------------ Music

   no-op ve hicbir kosulda exception atmaz (audio_no_throw kapisina girer).

   - Her katmanin KENDI tonu var (bass alcak gecirgen, arp yuksek gecirgen,

     bantta ust uste biniyordu; toplam "bulanik" duyuluyordu.

     cukur var (CONFIG.MUSIC.hoverDuck*). Bass notalari 55/65/82/98 Hz; hover
     temeli 51-85 Hz. 82 Hz ile 85 Hz ust uste gelince saniyede ~3 kez vuran
     bir dalgalanma (beating) olusuyordu. Cukuru kapatmak icin hoverDuckDb=0.
   - Perkusif tik artik gurultu tabanli (Sound'un tamponu); tek basina sinus
     tik, muzigin geri kalaniyla ayni tinida kaliyordu.
   DETERMINIZM: Math.random() YOK. Gurultu tamponuna giris noktasi kendi
   sayacindan (_tickN) turetilir; sim bu sayaci ne okur ne yazar.            */
class Music {
  constructor() {
    this._sound = null;        // Sound referansi (ctx/master/muted)
    this._playing = false;
    this._intensity = 0;       // hedef yogunluk 0..1
    this._timer = null;        // setInterval id (nota kuyrugu)
    this._nextTime = 0;        // bir sonraki planlanacak an (ctx saati)
    this._step = 0;            // sekil icinde sayac
    this._tickN = 0;           // perkusyon varyasyon sayaci (deterministik)
    this._layers = [           // katman gain node'lari (sira: bass,pulse,arp,lead)
      null, null, null, null
    ];
    this._chains = [null, null, null, null];  // katman tonu (filtre) zincirleri
  }
  /* Sound tarafindan baglanir; sim'e dokunmaz. */
  attach(sound) { this._sound = sound; }
  _cfg() { return CONFIG.MUSIC || {}; }
  _ready() {
    const s = this._sound;
    return !!(s && s.ctx && s.ctx.state === 'running' && !s.muted);
  }
  /* state() → { playing, intensity, layers: <acik katman sayisi> }. */
  state() {
    return {
      playing: this._playing,
      intensity: this._intensity,
      layers: this._activeLayers(),
    };
  }
  _activeLayers() {
    if (!this._playing) return 0;
    const i = this._intensity;
    let n = 0;
    if (i >= 0.25) n++;          // bass
    if (i >= 0.55) n += 2;       // pulse + arp
    if (i >= 1.0) n++;           // lead
    return n;
  }
  start() {
    if (this._playing) return;
    this._playing = true;
    try {
      const M = this._cfg();
      const ramp = (M.rampMs || 400) / 1000;
      const base = (M.gain != null ? M.gain : 0.3) * (M.layerGainMul || 1);
      for (let i = 0; i < 4; i++) {
        const g = this._layerGain(i);
        const target = (this._intensity >= this._threshold(i)) ? base : 0;
        this._ramp(g, target, ramp);
      }
      this._startTimer();
    } catch (e) {}
  }
  stop() {
    if (!this._playing) return;
    this._playing = false;
    try {
      const M = this._cfg();
      const ramp = (M.rampMs || 400) / 1000;
      for (let i = 0; i < 4; i++) this._ramp(this._layerGain(i), 0, ramp);
      this._stopTimer();
    } catch (e) {}
  }
  setIntensity(v) {
    this._intensity = Math.max(0, Math.min(1, v || 0));
    try {
      if (!this._playing) return;
      const M = this._cfg();
      const ramp = (M.rampMs || 400) / 1000;
      const base = (M.gain != null ? M.gain : 0.3) * (M.layerGainMul || 1);
      for (let i = 0; i < 4; i++) {
        const target = (this._intensity >= this._threshold(i)) ? base : 0;
        this._ramp(this._layerGain(i), target, ramp);
      }
    } catch (e) {}
  }
  _threshold(i) {
    const th = (this._cfg().thresholds) || [0.25, 0.55, 0.55, 1.0];
    return th[i] != null ? th[i] : [0.25, 0.55, 0.55, 1.0][i];
  }
  /* Bir katmanin gain node'u; yoksa olusturup ton zinciriyle master'a bagla.
     Notalar HEP gain node'una baglanir (katman sesi buradan rampalanir);
     filtreler gain'den SONRA gelir, yani rampa davranisi degismez. */
  _layerGain(i) {
    let g = this._layers[i];
    if (g) return g;
    const s = this._sound;
    if (!s || !s.ctx || !s.master) return null;
    try {
      const M = this._cfg();
      g = s.ctx.createGain();
      g.gain.value = 0;
      let tail = g;
      const chain = [];
      const tone = (M.layerTone || [])[i];
      if (tone && tone.type) {
        const f = s.ctx.createBiquadFilter();
        f.type = tone.type;
        f.frequency.value = tone.hz || 1000;
        if (tone.q != null) f.Q.value = tone.q;
        tail.connect(f); tail = f; chain.push(f);
      }
      // Bass katmani: hover ugultusunun temel frekansinda kucuk cukur.
      if (i === 0 && M.hoverDuckDb) {
        const p = s.ctx.createBiquadFilter();
        p.type = 'peaking';
        p.frequency.value = M.hoverDuckHz || 85;
        p.Q.value = M.hoverDuckQ || 1.0;
        p.gain.value = M.hoverDuckDb;      // negatif = cukur
        tail.connect(p); tail = p; chain.push(p);
      }
      tail.connect(s.master);
      this._layers[i] = g;
      this._chains[i] = chain;
      return g;
    } catch (e) { return null; }
  }
  /* Yumusak gecis: ani acma/kapama yok. */
  _ramp(g, target, ramp) {
    if (!g) return;
    const t = this._sound.ctx.currentTime;
    try {
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), t);
      g.gain.linearRampToValueAtTime(Math.max(0.0001, target), t + Math.max(0.01, ramp));
    } catch (e) {}
  }
  _startTimer() {
    if (this._timer != null) return;
    const M = this._cfg();
    const look = (M.lookaheadMs || 200) / 1000;
    const stepDur = (M.stepMs || 125) / 1000;
    this._nextTime = this._sound.ctx.currentTime + 0.06;
    this._step = 0;
    this._timer = setInterval(() => this._tick(look, stepDur), (M.tickMs || 80));
  }
  _stopTimer() {
    if (this._timer != null) { clearInterval(this._timer); this._timer = null; }
  }
  /* IlERI PLANLAMA: su anki ctx saatinden look kadar onceki notalari yerlestir. */
  _tick(look, stepDur) {
    try {
      const s = this._sound;
      if (!this._playing || !s || !s.ctx || s.ctx.state !== 'running' || s.muted) return;
      while (this._nextTime < s.ctx.currentTime + look) {
        this._scheduleStep(this._step, this._nextTime);
        this._nextTime += stepDur;
        this._step = (this._step + 1) % 16;
      }
    } catch (e) {}
  }
  _scheduleStep(step, t) {
    const M = this._cfg();
    const i = this._intensity;
    const root = M.rootHz || 110;
    const scale = M.scale || [0, 3, 7, 10];
    const f = (semi) => root * Math.pow(2, semi / 12);
    // bass: her adimda nabiz (kare/ucgen).
    if (i >= this._threshold(0)) {
      const deg = scale[step % scale.length];
      this._bass(f(deg - 12), t, M);
    }
    // pulse: perkusif tik — ciftlerde (her 2 adim).
    if (i >= this._threshold(1) && (step % 2) === 0) {
      this._pulse(t, M, step);
    }
    // arp: arpej — her adimda yukselen perde.
    if (i >= this._threshold(2)) {
      const deg = scale[(step * 3) % scale.length];
      this._arp(f(deg + 12), t, M);
    }
    // lead: uzun, suzulen ton — her 4 adimda bir.
    if (i >= this._threshold(3) && (step % 4) === 0) {
      const deg = scale[(step >> 2) % scale.length];
      this._lead(f(deg + 24), t, M);
    }
  }
  /* Kisa osilatör: hedef gain node'a, t aninda, env ile.
     opt.voices>1 ise hafif detune'lu ikizler eklenir (kalinlik); toplam genlik
     ses sayisina bolunur, yani katman seviyesi degismez.
     Kuyrukta 0.0001'de kesmek yerine sifira dogrusal iniyoruz — bitis tiki yok. */
  _osc(type, freq, t, dur, vol, layerIdx, opt) {
    const s = this._sound;
    if (!s || !s.ctx) return;
    const g = this._layerGain(layerIdx);
    if (!g) return;
    const o = opt || {};
    const n = Math.max(1, o.voices || 1);
    const spread = o.spread || 0;
    try {
      for (let k = 0; k < n; k++) {
        const det = n > 1 ? (k - (n - 1) / 2) * spread : 0;
        const osc = s.ctx.createOscillator();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (det) { try { osc.detune.setValueAtTime(det, t); } catch (e) {} }
        const env = s.ctx.createGain();
        const a = o.atk || 0.008;
        env.gain.setValueAtTime(0.0001, t);
        env.gain.linearRampToValueAtTime(vol / n, t + a);
        env.gain.exponentialRampToValueAtTime(0.0002, t + dur);
        env.gain.linearRampToValueAtTime(0, t + dur + 0.006);
        osc.connect(env); env.connect(g);
        osc.start(t); osc.stop(t + dur + 0.02);
      }
    } catch (e) {}
  }
  _bass(freq, t, M) {
    this._osc(M.bassWave || 'triangle', freq, t, (M.bassDur || 0.22), (M.bassVol || 0.5), 0,
              { atk: M.bassAtk || 0.012 });
  }
  _arp(freq, t, M) {
    this._osc(M.arpWave || 'square', freq, t, (M.arpDur || 0.16), (M.arpVol || 0.22), 2,
              { atk: 0.006 });
  }
  _lead(freq, t, M) {
    this._osc(M.leadWave || 'sine', freq, t, (M.leadDur || 0.55), (M.leadVol || 0.28), 3,
              { atk: M.leadAtk || 0.05, voices: M.leadVoices || 1, spread: M.leadSpread || 0 });
  }
  /* Perkusif tik: kisa sinus govdesi + yuksek gecirgen gurultu ucu.
     Gurultu, Sound'un onceden uretilmis deterministik tamponundan gelir;
     giris noktasi _tickN sayacindan turetilir (Math.random YOK, sim'e dokunmaz). */
  _pulse(t, M, step) {
    const s = this._sound;
    if (!s || !s.ctx) return;
    const g = this._layerGain(1);
    if (!g) return;
    try {
      const osc = s.ctx.createOscillator();
      osc.type = M.pulseWave || 'sine';
      osc.frequency.setValueAtTime(M.pulseHz || 180, t);
      if (M.pulseDropHz) osc.frequency.exponentialRampToValueAtTime(M.pulseDropHz, t + (M.pulseDur || 0.05));
      const env = s.ctx.createGain();
      const dur = M.pulseDur || 0.05;
      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(M.pulseVol || 0.4, t + 0.004);
      env.gain.exponentialRampToValueAtTime(0.0002, t + dur);
      env.gain.linearRampToValueAtTime(0, t + dur + 0.005);
      osc.connect(env); env.connect(g);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) {}
    // Gurultu ucu — muzigin tek gurultu kaynagi; tiniyi osilator corbasindan ayirir.
    const nv = M.pulseNoiseVol;
    if (!nv || !s._noiseBuf) return;
    try {
      this._tickN = (this._tickN + 1) & 0xffff;
      const off = ((this._tickN * 2654435761) >>> 16 & 0xffff) / 0x10000;
      const ndur = M.pulseNoiseDur || 0.03;
      const src = s.ctx.createBufferSource();
      src.buffer = s._noiseBuf;
      src.loop = true;
      const hp = s.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = M.pulseNoiseHz || 3200;
      const env2 = s.ctx.createGain();
      env2.gain.setValueAtTime(0.0001, t);
      env2.gain.linearRampToValueAtTime(nv, t + 0.002);
      env2.gain.exponentialRampToValueAtTime(0.0002, t + ndur);
      env2.gain.linearRampToValueAtTime(0, t + ndur + 0.004);
      src.connect(hp); hp.connect(env2); env2.connect(g);
      src.start(t, off * s._noiseBuf.duration * 0.9);
      src.stop(t + ndur + 0.02);
    } catch (e) {}
  }
}

/* Fircasiz motor sesi icin yedek sabitler. Asil degerler audio.config.js
   icinde CONFIG.SOUND.hover altindadir; bu nesne yalnizca CONFIG eksikse
   devreye giren guvenli varsayilandir (hicbir cagri hata firlatmasin). */
const HOVER_DEFAULTS = {
  harmonics: [
    { mult: 1,   vol: 0.50 },   // temel
    { mult: 2,   vol: 0.30 },   // 2. harmonik
    { mult: 3,   vol: 0.18 },   // 3. harmonik
    { mult: 4.9, vol: 0.07 },   // yukselton (fritter)
  ],
  baseFreq: 85,     // Hz — level=1.0'daki temel frekans
  levelMin: 0.6, levelMax: 1.0,
  gain: 0.08,       // surekli vizilti seviyesi (efektlerin onune gecmez)
  amHz: 28, amDepth: 0.02,
  attack: 0.15, glide: 0.05, gainGlide: 0.08, release: 0.10, stopMs: 400,
};

/* Mix yedek sabitleri (round 23). Asil degerler CONFIG.SOUND.mix altinda;
   burasi CONFIG eksik/kismi ise devreye giren guvenli taban. */
const MIX_DEFAULTS = {
  noiseSec: 2,               // gurultu tamponu uzunlugu (s) — ofset cesitliligi
  limitThreshold: -3, limitKnee: 6, limitRatio: 8,
  limitAttack: 0.003, limitRelease: 0.18,
  fxThreshold: -12, fxKnee: 10, fxRatio: 3.5,
  fxAttack: 0.002, fxRelease: 0.14,
  spaceDelay: 0.085, spaceFeedback: 0.30, spaceTone: 2400, spaceGain: 0.45,
  priorityReserve: 4,        // oncelikli seslerin ek yuva payi
};

/* Ornek bankasi yedek sabitleri (round 25). Asil degerler
   CONFIG.SOUND.sfx altinda; burasi CONFIG eksik/kismi ise devreye giren
   guvenli taban. Tablo burada da tam duruyor cunku audio.config.js dususe
   gecerse (sira hatasi, ezilen anahtar) ornekler SESSIZCE prosedurele
   dusmesin — bu paket bunu iki kez yasadi. */
const SFX_DEFAULTS = {
  enabled: true, gain: 1.0, chunk: 3,
  detuneCents: 70, gainJitter: 0.14, fadeIn: 0.0015, fadeOut: 0.012,
  hoverName: 'hover', hoverGain: 0.20, hoverRateBase: 0.70, hoverRateSpan: 0.34,
  voices: {
    shot:      { names: ['shot_0', 'shot_1', 'shot_2', 'shot_3'], gain: 0.42, prio: true, send: 0.05, pan: 0.24, spread: 70 },
    eshot:     { names: ['eshot_0', 'eshot_1'], gain: 0.34, send: 0.04, pan: 0.50, spread: 90 },
    bshot:     { names: ['bshot_0'], gain: 0.55, prio: true, send: 0.12, spread: 60 },
    hit:       { names: ['hit_0', 'hit_1', 'hit_2'], gain: 0.32, send: 0.05, pan: 0.40, spread: 110 },
    groundHit: { names: ['hit_0', 'hit_1', 'hit_2'], gain: 0.38, send: 0.07, pan: 0.30, det: -400, spread: 90 },
    gdeath:    { names: ['gdeath'], gain: 0.60, prio: true, send: 0.28, pan: 0.24, spread: 70 },
    flak:      { names: ['flak'], gain: 0.44, send: 0.14, pan: 0.60, spread: 120 },
    boom:      { names: ['boom_0', 'boom_1'], gain: 0.56, prio: true, send: 0.22, pan: 0.30, spread: 100 },
    warn:      { names: ['warn'], gain: 0.50, prio: true, send: 0.25, spread: 0 },
    stage:     { names: ['stage'], gain: 0.50, prio: true, send: 0.20, spread: 0 },
    victory:   { names: ['victory'], gain: 0.50, prio: true, send: 0.30, spread: 0 },
  },
};

class Sound {
  constructor() {
    this.ctx = null;           // AudioContext (ilk etkilesimde olusturulur)
    this.master = null;        // master gain node
    this.muted = false;
    this._active = 0;          // aktif ses sayaci (toplam kazanc siniri)
    this._noiseBuf = null;     // once uretilen gürültü tamponu
    this._hover = null;        // surekli hover sesi (tek instance: {oscs,oscGains,env,lfo,lfoGain})
    this._hoverStop = null;    // sonumleme sonrasi yikim zamanlayicisi (setTimeout id)
    /* Round 23 mix zinciri. hover ve muzik master'a DOGRUDAN baglanir;
       yalniz efektler _fxBus'tan gecer (asagida gerekce var). */
    this._fxBus = null;        // efekt veri yolu (yumusak sikistirici)
    this._limiter = null;      // master cikisi: tepe emniyeti
    this._spaceIn = null;      // mekan (kisa geri besleme gecikmesi) gonderisi
    this._spaceNodes = null;
    /* Mantiksal hover bayragi — sesin GERCEKTEN duyulmasindan BAGIMSIZ.
       Autotest'te ctx askidadir ve hicbir dugum kurulmaz, ama hover DEVREDE
       ise bu bayrak yine true olur; olcum bunu okur (Game.state().sound.hover). */
    this.hoverOn = false;
    this.hoverLevel = 1;       // son istenen seviye (0.6-1.0)
    /* DETERMINIZM: ses tarafinda Math.random() YOK. Gurultu tamponu ve atis
       basina varyasyon bu iki sayactan turetilir. Sim ne _seed'i ne _varN'i
       okur/yazar; Sound sim durumuna hicbir sey yazmaz. Sim LCG'lerine de
       DOKUNMAZ — dokunsaydi altin iz catallanirdi. */
    this._seed = 0x1a2b3c4d | 0;
    this._varN = 0;
    /* ------------------------------------------- ornek bankasi (round 25)
       Gomulu base64 Ogg -> AudioBuffer. `unlock()`te asenkron cozulur; o ana
       kadar (ve bir ornek cozulemezse) PROSEDUREL ses devrededir. */
    this._bank = {};           // ad -> AudioBuffer
    this._bankOn = false;      // cozme baslatildi mi (tek sefer)
    this._bankFail = 0;        // cozulemeyen ornek sayisi
    /* Varyant sirasi. `_varN` gibi: yalniz Sound okur/yazar, sim ne okur ne
       yazar, Math.random YOK. Hash DEGIL saf sira — hash ile art arda ayni
       varyanta dusmek mumkundu, sira ile dort atista dort ornek garanti. */
    this._rotN = 0;
    this._lastSrc = '';        // 'sample' | 'proc' — olcum kancasi
    this._lastVar = '';        // calinan ornegin adi
    this._hoverOld = null;     // prosedurel -> ornek gecisinde sonen eski hover
    this._hoverOldT = null;
    this.music = new Music();  // katmanli prosedurel muzik (round 19)
    this._musicWasPlaying = false;
    this.music.attach(this);
  }
  /* ---------------------------------------------- deterministik varyasyon */
  _rndBits() { this._seed = (Math.imul(this._seed, 1664525) + 1013904223) | 0; return this._seed; }
  _rnd01() { return ((this._rndBits() >>> 8) & 0xffffff) / 0x1000000; }
  /* Atis basina 0..1 arasi kucuk varyasyon. Sayac tabanli (saat degil), yani
     tekrarlanabilir; sim tarafindan ne okunur ne yazilir. */
  _var() {
    this._varN = (this._varN + 1) & 0x3fffffff;
    let n = this._varN | 0;
    n = Math.imul(n ^ (n >>> 15), 0x2545f491) | 0;
    n = (n ^ (n >>> 13)) | 0;
    return ((n >>> 8) & 0xffff) / 0x10000;
  }
  _mix(k) {
    const m = (typeof CONFIG !== 'undefined' && CONFIG.SOUND && CONFIG.SOUND.mix) || null;
    if (m && m[k] != null) return m[k];
    return MIX_DEFAULTS[k];
  }
  _mkComp(th, knee, ratio, atk, rel) {
    try {
      const c = this.ctx.createDynamicsCompressor();
      c.threshold.value = th; c.knee.value = knee; c.ratio.value = ratio;
      c.attack.value = atk; c.release.value = rel;
      return c;
    } catch (e) { return null; }
  }
  /* ------------------------------------------------ ornek bankasi (round 25)
     Olcum kancalari (tools/gate_sfx.py sozlesmesi). */
  bankSize() { let n = 0; for (const k in this._bank) if (this._bank[k]) n++; return n; }
  bankFailed() { return this._bankFail; }
  lastSource() { return this._lastSrc; }
  lastVariant() { return this._lastVar; }
  _sfx() {
    const s = (typeof CONFIG !== 'undefined' && CONFIG.SOUND && CONFIG.SOUND.sfx) || null;
    return s || SFX_DEFAULTS;
  }
  _voice(k) {
    const S = this._sfx();
    return (S.voices && S.voices[k]) || SFX_DEFAULTS.voices[k] || null;
  }
  /* base64 -> Uint8Array. atob tarayicida her zaman var; yine de cagiran
     try icinde tutuluyor (bir ornek patlarsa banka tumuyle dusmesin). */
  _b64(s) {
    const bin = atob(s);
    const n = bin.length;
    const u8 = new Uint8Array(n);
    for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  /* Bankayi coz. Idempotent; ctx yoksa hicbir sey yapmaz.
     PARCALI: 18 ornegin base64 cozumu tek karede yapilirsa ilk dokunusta
     gorunur bir takilma olur. `chunk` kadarini isler, kalanini bir sonraki
     goreve birakir. decodeAudioData zaten asenkron ve ctx ASKIDAYKEN DE
     calisir — autotest'te de banka dolar. */
  _bankStart() {
    if (this._bankOn || !this.ctx) return;
    const S = this._sfx();
    if (S.enabled === false) return;
    if (typeof SFX_DATA === 'undefined' || !SFX_DATA) return;
    this._bankOn = true;
    let names;
    try { names = Object.keys(SFX_DATA); } catch (e) { return; }
    const step = Math.max(1, S.chunk || 3);
    const run = (i) => {
      for (let k = 0; k < step && i + k < names.length; k++) {
        this._decode(names[i + k], SFX_DATA[names[i + k]]);
      }
      if (i + step < names.length) setTimeout(() => run(i + step), 0);
    };
    run(0);
  }
  /* Tek ornek. `done` bayragi SART: Chrome hem geri cagriyi cagirir hem de
     sozu cozer — ikisini de saymak banka boyutunu ikiye katlardi. */
  _decode(name, b64) {
    let done = false;
    const ok = (buf) => {
      if (done) return;
      done = true;
      if (buf) { this._bank[name] = buf; this._bankReady(name); }
      else this._bankFail++;
    };
    const bad = () => { if (done) return; done = true; this._bankFail++; };
    try {
      const u8 = this._b64(b64);
      const p = this.ctx.decodeAudioData(u8.buffer, ok, bad);
      if (p && p.then) p.then(ok, bad);
    } catch (e) { bad(); }
  }
  /* Bir ornek hazir oldu. Hover devredeyse ve hala PROSEDUREL calisiyorsa
     hemen gecise zorla — yoksa motor ugultusu, oyuncu hizini degistirene
     kadar (hover() yeniden cagrilana kadar) sentetik kalirdi. */
  _bankReady(name) {
    const S = this._sfx();
    if (name !== (S.hoverName || 'hover')) return;
    if (this.hoverOn) { try { this.hover(this.hoverLevel); } catch (e) {} }
  }
  /* Sirayla varyant sec. Yalniz COZULMUS ornekler arasindan secer; banka
     yarim doluyken de dogru calisir. Hicbiri hazir degilse null. */
  _pick(list) {
    if (!list || !list.length) return null;
    let n = 0;
    for (let i = 0; i < list.length; i++) if (this._bank[list[i]]) n++;
    if (!n) return null;
    this._rotN = (this._rotN + 1) & 0x3fffffff;
    let k = this._rotN % n;
    for (let i = 0; i < list.length; i++) {
      if (!this._bank[list[i]]) continue;
      if (k === 0) return list[i];
      k--;
    }
    return null;
  }
  /* Ornek calar. Zincir prosedurel seslerle AYNI: kaynak -> zarf -> yuva
     -> [pan] -> _fxBus -> master -> limiter (yuvayi `_gate` kurar).
     opt: {det, delay, prio, pan, send}. det = cent cinsinden perde kaydirma;
     AudioBufferSourceNode.detune her tarayicida yok, playbackRate her yerde
     var — perdeyle birlikte sure de kayar, atis varyasyonunda istenen sey. */
  _sample(name, vol, target, opt) {
    const o = opt || {};
    const buf = this._bank[name];
    if (!buf) return false;
    const g = target || this._gate(o);
    if (!g) return false;
    this._hold(g);
    try {
      const S = this._sfx();
      const t = this.ctx.currentTime + (o.delay || 0);
      const rate = o.det ? Math.pow(2, o.det / 1200) : 1;
      const dur = Math.max(0.02, buf.duration / rate);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      if (rate !== 1) src.playbackRate.value = rate;
      /* Kayit zaten kendi atagiyla basliyor; burada yalniz olasi DC sicramasi
         icin mikro rampa var (prosedurel tarafla ayni gerekce: sifirdan tepe
         degere ANINDA sicramak genis bantli bir tik uretir). Arasi DUZ —
         ustel sonum uygulansa kaydin dogal kuyrugu ezilirdi. */
      const a = Math.min(S.fadeIn == null ? 0.0015 : S.fadeIn, dur * 0.25);
      const r = Math.min(S.fadeOut == null ? 0.012 : S.fadeOut, dur * 0.25);
      const v = Math.max(0.0002, vol);
      const env = this.ctx.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(v, t + a);
      env.gain.setValueAtTime(v, t + dur - r);
      env.gain.linearRampToValueAtTime(0, t + dur);
      src.connect(env); env.connect(g);
      src.start(t);
      src.stop(t + dur + 0.005);
      src.onended = () => this._release(g);
      return true;
    } catch (err) { this._release(g); return false; }
  }
  /* Olay icin ornek dene. `true` = ornek YOLU secildi (yuva butcesi doluysa
     ses duyulmaz ama prosedurel yedek de yuva bulamazdi — cift calma yok).
     `false` = banka hazir degil; cagiran prosedurel sese duser.
     v, w: `_var()`den gelen iki deterministik 0..1 sapma. */
  _sfxPlay(key, v, w) {
    const S = this._sfx();
    if (S.enabled === false) return false;
    const V = this._voice(key);
    if (!V) return false;
    const name = this._pick(V.names);
    if (!name) return false;
    this._lastSrc = 'sample';
    this._lastVar = name;
    const spread = V.spread == null ? (S.detuneCents || 0) : V.spread;
    const jit = S.gainJitter == null ? 0 : S.gainJitter;
    const scale = S.gain == null ? 1 : S.gain;
    this._sample(name, (V.gain || 0.4) * scale * (1 + (w - 0.5) * 2 * jit), null, {
      det: (V.det || 0) + (v - 0.5) * 2 * spread,
      prio: !!V.prio,
      send: V.send || 0,
      pan: (v - 0.5) * (V.pan || 0),
    });
    return true;
  }
  _proc() { this._lastSrc = 'proc'; this._lastVar = ''; }
  /* Ilk kullanici etkilesinde cagrilir. Askida kalabilir — hata YOK. */
  unlock() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      this._bankStart();   // idempotent: ilk turda basladiysa hicbir sey yapmaz
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = CONFIG.SOUND.masterGain;
      /* Cikis emniyeti: tepe sinirlayici. Normal seviyede DEVREYE GIRMEZ;
         yalniz ayni anda cok ses caldiginda kirpilma (clip) yerine yumusak
         bastirma yapar. Onceden hicbir tavan yoktu: 8 ses ust uste bindiginde
         toplam genlik 1.0'i asiyor ve dijital kirpilma duyuluyordu. */
      this._limiter = this._mkComp(this._mix('limitThreshold'), this._mix('limitKnee'),
                                   this._mix('limitRatio'), this._mix('limitAttack'),
                                   this._mix('limitRelease'));
      if (this._limiter) { this.master.connect(this._limiter); this._limiter.connect(this.ctx.destination); }
      else this.master.connect(this.ctx.destination);
      /* Efekt veri yolu: yalniz SES EFEKTLERI buradan gecer. Hover ugultusu ve
         muzik master'a dogrudan baglidir — boylece her atista surekli motor
         sesi "pompalanmaz" ve muzik nefes almaz. */
      this._fxBus = this._mkComp(this._mix('fxThreshold'), this._mix('fxKnee'),
                                 this._mix('fxRatio'), this._mix('fxAttack'),
                                 this._mix('fxRelease'));
      if (this._fxBus) this._fxBus.connect(this.master);
      this._buildSpace();
      this._buildNoise();
      /* AYRI degil ama SON: banka cozulemese bile (kodek yok, bellek) yukaridaki
         zincir kurulmus olur ve prosedurel ses calmaya devam eder. */
      this._bankStart();
    } catch (e) { this.ctx = null; }
    // Muzik caliyorduysa (orn. mute sonrasi unlock) yeniden baslat.
    if (this.music && !this.muted && this._musicWasPlaying) this.music.start();
    // Hover devredeyse ses artik acilabilir — dugumleri kur.
    if (this.hoverOn) this.hover(this.hoverLevel);
  }
  /* Kisa geri beslemeli gecikme: "gece sehri" derinligi. Konvolusyon yerine
     gecikme — mobilde ucuz, dosya gerektirmez, kapatmak icin spaceGain=0. */
  _buildSpace() {
    try {
      const c = this.ctx;
      const inG = c.createGain(); inG.gain.value = 1;
      const dly = c.createDelay(0.5); dly.delayTime.value = this._mix('spaceDelay');
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = this._mix('spaceTone');
      const fb = c.createGain(); fb.gain.value = this._mix('spaceFeedback');
      const out = c.createGain(); out.gain.value = this._mix('spaceGain');
      inG.connect(dly); dly.connect(lp); lp.connect(fb); fb.connect(dly);
      lp.connect(out); out.connect(this.master);
      this._spaceIn = inG;
      this._spaceNodes = { dly, lp, fb, out };
    } catch (e) { this._spaceIn = null; this._spaceNodes = null; }
  }
  /* Gurultu tamponu — DETERMINISTIK (Math.random YOK). 2 sn: her sesin
     tampona farkli yerden girmesi icin yeterli cesitlilik.
     AYRI try: tampon uretilemezse (bellek/uygulama farki) SES TUMDEN olmesin —
     tonal sesler calmaya devam eder, yalniz gurultu katmani duser. */
  _buildNoise() {
    try {
      const secs = Math.max(0.5, this._mix('noiseSec'));
      const len = Math.floor(this.ctx.sampleRate * secs);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = this._rnd01() * 2 - 1;
      this._noiseBuf = buf;
    } catch (e) { this._noiseBuf = null; }
  }
  toggleMute() {
    this.muted = !this.muted;
    // muted bayragina saygi: sessize alinca muzik de susar (playing false).
    if (this.music) {
      if (this.muted) {
        this._musicWasPlaying = this.music.state().playing;
        this.music.stop();
      } else if (this._musicWasPlaying) {
        this.music.start();
      }
    }
    // Hover mantiksal olarak devrede kalir; yalnizca sesi susar/geri doner.
    if (this.muted) this._hoverFade();
    else if (this.hoverOn) this.hover(this.hoverLevel);
  }
  _ready() { return this.ctx && this.ctx.state === 'running' && !this.muted; }
  /* Toplam kazanc siniri: aktif ses sayacina gore yeni ses reddedilir.
     opt: { prio, pan, send }.
     - prio: oncelikli sesler (oyuncunun kendi silahi, olum, boss) ek yuva
       payindan yararlanir. Onceden 8 yuva dolunca OYUNCUNUN ATIS SESI de
       sessizce dusuyordu; yogun catismada silah "bozulmus" gibi duyuluyordu.
     - Bir ses BIRDEN COK parcadan olussa bile TEK yuva tutar (parca sayaci
       g._n). Onceden enemyDeath uc ayri yuva yiyordu — tek bir olum, sekiz
       sesin ucunu birden harciyordu. */
  _gate(opt) {
    if (!this._ready()) return null;
    const o = opt || {};
    const base = (CONFIG.SOUND && CONFIG.SOUND.maxConcurrent) || 8;
    const cap = base + (o.prio ? this._mix('priorityReserve') : 0);
    if (this._active >= cap) return null;
    this._active++;
    const g = this.ctx.createGain();
    g._n = 0; g._pan = null; g._send = null;
    let tail = g;
    if (o.pan) {
      try {
        if (this.ctx.createStereoPanner) {
          const p = this.ctx.createStereoPanner();
          p.pan.value = Math.max(-1, Math.min(1, o.pan));
          tail.connect(p); tail = p; g._pan = p;
        }
      } catch (e) {}
    }
    tail.connect(this._fxBus || this.master);
    if (o.send > 0 && this._spaceIn) {
      try {
        const s = this.ctx.createGain();
        s.gain.value = o.send;
        tail.connect(s); s.connect(this._spaceIn); g._send = s;
      } catch (e) {}
    }
    return g;
  }
  _hold(g) { if (g) g._n = (g._n || 0) + 1; }
  _release(g) {
    if (!g) return;
    g._n = (g._n || 1) - 1;
    if (g._n > 0) return;
    const kill = (n) => { if (n) { try { n.disconnect(); } catch (e) {} } };
    kill(g._send); kill(g._pan); kill(g);
    g._send = null; g._pan = null;
    this._active--;
    if (this._active < 0) this._active = 0;
  }
  /* Ortak zarf. ONEMLI: eskiden `setValueAtTime(vol, t)` ile 0'dan tepe degere
     ANINDA siciliyordu — bu bir dalga formu sicramasidir, genis bantli bir
     "tik" duyulur ve her sesin onune ayni tik yapisir. Burada atak cok kisa
     (varsayilan 2 ms, atis transientlerinde 0.6 ms) ama SIFIR DEGIL: vurus
     keskin kalir, tik gider. Kuyrukta da 0.0001'de kesmek yerine sifira
     dogrusal iniyoruz — bitis tiki de yok. */
  _env(t, dur, vol, atk) {
    const a = Math.max(0.0005, atk == null ? 0.002 : atk);
    const v = Math.max(0.0002, vol);
    const d = Math.max(a + 0.006, dur);
    const env = this.ctx.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(v, t + a);
    env.gain.exponentialRampToValueAtTime(0.0002, t + d);
    env.gain.linearRampToValueAtTime(0, t + d + 0.005);
    return { env, end: t + d + 0.008 };
  }
  /* Kisa tonal ses. opt: {delay, atk, sweepTo, lp, lpQ, detune, prio, pan, send} */
  _tone(freq, dur, type, vol, target, opt) {
    const o = opt || {};
    const g = target || this._gate(o);
    if (!g) return;
    this._hold(g);
    try {
      const t = this.ctx.currentTime + (o.delay || 0);
      const osc = this.ctx.createOscillator();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(Math.max(1, freq), t);
      if (o.sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.sweepTo), t + Math.max(0.01, dur));
      if (o.detune) { try { osc.detune.setValueAtTime(o.detune, t); } catch (e) {} }
      const e = this._env(t, dur, vol, o.atk);
      let node = osc;
      if (o.lp) {
        const f = this.ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.lpQ || 0.7;
        node.connect(f); node = f;
      }
      node.connect(e.env); e.env.connect(g);
      osc.start(t); osc.stop(e.end);
      osc.onended = () => this._release(g);
    } catch (err) { this._release(g); }
  }
  /* Gürültü patlamasi. opt: {delay, atk, type, sweepTo, offset, prio, pan, send}
     type: 'bandpass' (varsayilan) | 'lowpass' | 'highpass'
     sweepTo: filtre frekansi sure boyunca buraya kayar — patlamanin acilip
     donuklasmasi bu kaymadan gelir (sabit bantli gurultu "sss" gibi durur).
     offset: 0..1, tampona giris noktasi — ayni gurultu deseni tekrar etmesin. */
  _noise(dur, freq, q, vol, target, opt) {
    const o = opt || {};
    const g = target || this._gate(o);
    if (!g) return;
    this._hold(g);
    if (!this._noiseBuf) { this._release(g); return; }
    try {
      const t = this.ctx.currentTime + (o.delay || 0);
      const src = this.ctx.createBufferSource();
      src.buffer = this._noiseBuf;
      src.loop = true;
      const filt = this.ctx.createBiquadFilter();
      filt.type = o.type || 'bandpass';
      filt.frequency.setValueAtTime(Math.max(20, freq), t);
      if (o.sweepTo) filt.frequency.exponentialRampToValueAtTime(Math.max(20, o.sweepTo), t + Math.max(0.01, dur));
      filt.Q.value = q || 1;
      const e = this._env(t, dur, vol, o.atk);
      src.connect(filt); filt.connect(e.env); e.env.connect(g);
      const off = Math.max(0, Math.min(0.98, o.offset || 0)) * this._noiseBuf.duration;
      src.start(t, off); src.stop(e.end);
      src.onended = () => this._release(g);
    } catch (err) { this._release(g); }
  }
  /* Frekans kaydirma (pitch sweep): from -> to, sure icinde. */
  _sweep(f0, f1, dur, type, vol, target, opt) {
    const o = opt || {};
    this._tone(f0, dur, type || 'sawtooth', vol, target,
               { delay: o.delay, atk: o.atk, sweepTo: f1, lp: o.lp, prio: o.prio, pan: o.pan, send: o.send });
  }
  /* --------------------------------------------------- hover (fircasiz motor)
     Surekli dusuk seviyeli vizilti; level (0.6-1.0) perdeyi ve genligi kaydirir.
     SES BUTCESI: hover `_gate()` KULLANMAZ, dogrudan master'a baglanir. Sebep:
     (1) surekli calan tek bir vizilti, 8 esz amanli ses kotasindan kalici bir yer
     yeseydi atis/patlama sesleri bir slot eksigiyle calisirdi; (2) ters yonde,
     gate'e sokulsaydi yogun catismada `_active >= maxConcurrent` oldugu an hover
     SESSIZCE DUSERDI ve motor sesi rastgele kesilirdi. Ikisi de istenmiyor;
     seviyesi zaten dusuk (CONFIG.SOUND.hover.gain) ve tek instance.
     Round 23: hover ayrica efekt veri yolundan (_fxBus) da GECMEZ — gecseydi
     her atis/patlama motor ugultusunu bastirir, motor "kekeliyor" gibi olurdu. */
  _hoverCfg() { return (CONFIG.SOUND && CONFIG.SOUND.hover) || HOVER_DEFAULTS; }
  /* Olcum kancasi: hover DEVREDE mi? Sesin duyulup duyulmadigindan bagimsiz
     (autotest'te ctx askida, mute'ta sessiz — bayrak yine dogruyu soyler). */
  hoverActive() { return this.hoverOn; }
  /* Hover ornegi hazir mi? (round 25) Hazirsa gercek motor KAYDI donguye
     alinir; degilse asagidaki prosedurel osilator yigini devrede kalir. */
  _hoverBuf() {
    const S = this._sfx();
    if (S.enabled === false) return null;
    return this._bank[S.hoverName || 'hover'] || null;
  }
  _hoverRate(lv) {
    const S = this._sfx();
    const b = S.hoverRateBase == null ? SFX_DEFAULTS.hoverRateBase : S.hoverRateBase;
    const sp = S.hoverRateSpan == null ? SFX_DEFAULTS.hoverRateSpan : S.hoverRateSpan;
    return Math.max(0.25, b + sp * lv);
  }
  _hoverGain(lv) {
    const S = this._sfx();
    return (S.hoverGain == null ? SFX_DEFAULTS.hoverGain : S.hoverGain) * lv;
  }
  hover(level) {
    const H = this._hoverCfg();
    const lv = Math.max(H.levelMin, Math.min(H.levelMax, level || 1));
    // Mantiksal durum her kosulda guncellenir (ses kurulmasa bile).
    this.hoverOn = true;
    this.hoverLevel = lv;
    // Askida / susturulmus: dugum kurma, varsa yumusakca sustur. Hata YOK.
    if (!this._ready()) { this._hoverFade(); return; }
    try {
      const t = this.ctx.currentTime;
      // Sonumlenmekte olan bir hover varsa yikimi iptal et, ayni dugumleri geri ac.
      if (this._hoverStop) { clearTimeout(this._hoverStop); this._hoverStop = null; }
      const buf = this._hoverBuf();
      const h = this._hover;
      // Mevcut hover varsa parametreleri guncelle (YENIDEN OLUSTURMA — yigilmaz).
      if (h) {
        if (h.kind === 'sample') { this._hoverTuneSample(h, lv, t, H); return; }
        if (!buf) { this._hoverTuneProc(h, lv, t, H); return; }
        /* Banka unlock'tan SONRA doluyor: hover o ana kadar prosedurel
           basladiysa burada kayda gecilir. Eskisi sonerken yenisi aciliyor
           (capraz gecis) — sert yikim bir tik duyururdu. */
        this._hoverRetire(h, H, t);
      }
      if (buf) this._hoverBuildSample(buf, lv, t, H);
      else this._hoverBuildProc(lv, t, H);
    } catch (e) { this._hoverTeardown(); }
  }
  /* --- ornek hover: tek dongulu kaynak.
     `hover` ornegi bas/son sureksizligi 0.021 ile olculerek secildi (diger
     motor kayitlarinda 0.185-0.233) — dikissiz donen tek kayit bu.
     _fxBus BYPASS: yukaridaki gerekce (her atista motor pompalanmasin). */
  _hoverBuildSample(buf, lv, t, H) {
    const env = this.ctx.createGain();
    env.gain.value = 0;
    env.connect(this.master);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.loopStart = 0;
    src.loopEnd = buf.duration;
    src.playbackRate.value = this._hoverRate(lv);
    src.connect(env);
    src.start(t);
    this._hover = { kind: 'sample', src, env };
    env.gain.setTargetAtTime(this._hoverGain(lv), t, H.attack);   // fade-in
  }
  _hoverTuneSample(h, lv, t, H) {
    try { h.src.playbackRate.setTargetAtTime(this._hoverRate(lv), t, H.glide); } catch (e) {}
    try { h.env.gain.setTargetAtTime(this._hoverGain(lv), t, H.gainGlide); } catch (e) {}
  }
  /* --- prosedurel hover (yedek): harmonik osilatörler + am modülasyonu. */
  _hoverBuildProc(lv, t, H) {
    const baseFreq = H.baseFreq * lv;
    const harm = H.harmonics || HOVER_DEFAULTS.harmonics;
    const env = this.ctx.createGain();
    env.gain.value = 0;
    env.connect(this.master);
    const oscs = [], oscGains = [];
    for (let i = 0; i < harm.length; i++) {
      const hh = harm[i];
      const osc = this.ctx.createOscillator();
      osc.type = i === 0 ? 'sawtooth' : 'sine';
      osc.frequency.value = baseFreq * hh.mult;
      const og = this.ctx.createGain();
      og.gain.value = hh.vol;
      osc.connect(og); og.connect(env);
      osc.start(t);
      oscs.push(osc); oscGains.push(og);
    }
    // Hafif am modülasyonu (~28 Hz) — rotor dönme hissi.
    const lfo = this.ctx.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = H.amHz;
    const lfoGain = this.ctx.createGain();
    lfoGain.gain.value = H.amDepth * lv;
    lfo.connect(lfoGain); lfoGain.connect(env.gain);
    lfo.start(t);
    this._hover = { kind: 'proc', oscs, oscGains, env, lfo, lfoGain };
    env.gain.setTargetAtTime(H.gain * lv, t, H.attack);   // fade-in
  }
  _hoverTuneProc(h, lv, t, H) {
    const baseFreq = H.baseFreq * lv;
    const harm = H.harmonics || HOVER_DEFAULTS.harmonics;
    const n = Math.min(h.oscs.length, harm.length);
    for (let i = 0; i < n; i++) {
      try { h.oscs[i].frequency.setTargetAtTime(baseFreq * harm[i].mult, t, H.glide); } catch (e) {}
    }
    try { h.env.gain.setTargetAtTime(H.gain * lv, t, H.gainGlide); } catch (e) {}
    try { h.lfoGain.gain.setTargetAtTime(H.amDepth * lv, t, H.gainGlide); } catch (e) {}
  }
  /* Eski hover'i sondur ve yuvayi hemen bosalt — cagiran hemen ardindan
     yenisini kurar. Ayri zamanlayici: `_hoverStop` "SU ANKI hover sonuyor"
     demektir, ikisi karisirsa stopHover sirasinda yeni hover kaliyordu. */
  _hoverRetire(h, H, t) {
    this._hover = null;
    this._hoverOldKill();          // bekleyen daha eski bir tane varsa hemen git
    this._hoverOld = h;
    try { h.env.gain.setTargetAtTime(0, t, H.release); } catch (e) {}
    this._hoverOldT = setTimeout(() => { this._hoverOldT = null; this._hoverOldKill(); }, H.stopMs);
  }
  _hoverOldKill() {
    if (this._hoverOldT) { clearTimeout(this._hoverOldT); this._hoverOldT = null; }
    const h = this._hoverOld;
    if (!h) return;
    this._hoverOld = null;
    this._hoverKill(h);
  }
  /* Idempotent: arka arkaya cagrilabilir, ikinci cagri hicbir sey yapmaz. */
  stopHover() {
    this.hoverOn = false;
    this._hoverFade();
  }
  /* Sonumlendir, sonra dugumleri yik. Zaten sonuyorsa dokunma (cift zamanlayici yok). */
  _hoverFade() {
    const h = this._hover;
    if (!h) { this._hoverTeardown(); return; }
    if (this._hoverStop) return;
    const H = this._hoverCfg();
    try {
      if (this.ctx) h.env.gain.setTargetAtTime(0, this.ctx.currentTime, H.release);
    } catch(e) {}
    this._hoverStop = setTimeout(() => {
      this._hoverStop = null;
      this._hoverTeardown();
    }, H.stopMs);
  }
  /* Tum hover dugumlerini durdur + kopar. Cagrilmasi her zaman guvenli.
     Iki bicimi de bilir: ornek ({src,env}) ve prosedurel ({oscs,...}). */
  _hoverTeardown() {
    if (this._hoverStop) { clearTimeout(this._hoverStop); this._hoverStop = null; }
    this._hoverOldKill();
    const h = this._hover;
    if (!h) return;
    this._hover = null;
    this._hoverKill(h);
  }
  _hoverKill(h) {
    const kill = (n) => { if (!n) return; try { if (n.stop) n.stop(); } catch(e) {} try { n.disconnect(); } catch(e) {} };
    try { if (h.oscs) h.oscs.forEach(kill); } catch(e) {}
    try { if (h.oscGains) h.oscGains.forEach(kill); } catch(e) {}
    kill(h.src); kill(h.lfo); kill(h.lfoGain); kill(h.env);
  }
  /* --------------------------------------------------- oyun olaylari
     Her olay TEK ses yuvasi tutar; katmanlar ayni `g` uzerine binir.
     Zamanlanmis parcalar setTimeout DEGIL, ses saati (opt.delay) kullanir —
     kare gecikmesinden bagimsiz, orneklem hassasiyetinde. */
  /* Birincil silah: saniyede birkac kez calar; en cok duyulan ses budur.
     (1) 14 ms parlak transient  = vurus / "snap" (onceden hic yoktu),
     (2) hizla asagi kayan govde = elektrikli silah karakteri,
     (3) kisa alt vurus          = agirlik.
     Her atista perde/gurultu-ofseti/panorama deterministik olarak biraz
     kayar; ayni dalga formunun saniyede bes kez tekrari yorucuydu. */
