/* ------------------------------------------------------------------ Renderer
   Uyarlabir cozunurluk + cizim. Boyut basina canvas onbellegi YASAK.       */

/* ---- src/fx/Explosion.js ---- */
class Explosion {
  constructor() { this.active = false; }
  spawn(x, y, seed) {
    this.x = x; this.y = y;
    this.t = 0;
    // LCG ile deterministik donme acisi (Math.random YOK)
    let s = (seed * 2654435761 + 1013904223) >>> 0;
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    this.rot = (s / 4294967296) * Math.PI * 2;
    this.active = true;
  }
  update(dt) {
    this.t += dt;
    const F = CONFIG.FX;
    const total = Math.max(F.flashMs, F.fireMs, F.smokeDelay * 1000 + F.smokeMs) / 1000 + 0.05;
    if (this.t > total) this.active = false;
  }
  draw(c, assets) {
    const F = CONFIG.FX;
    const t = this.t;
    const flashT = t / (F.flashMs / 1000);           // 0..1
    const fireT = t / (F.fireMs / 1000);             // 0..1
    const smokeT = (t - F.smokeDelay) / (F.smokeMs / 1000);  // 0..1 (gecikmeli)
    c.save();
    c.translate(this.x, this.y);
    // --- 1) boom_flash (lighter, 110ms, olcek 0.4→2.0, alfa 1→0)
    if (flashT < 1) {
      const sc = 0.4 + flashT * 1.6;
      const a = 1 - flashT;
      const sz = CONFIG.FX.explosion.baseSize * sc;
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = a;
      assets.draw(c, 'boom_flash', -sz / 2, -sz / 2, sz, sz);
      c.globalAlpha = 1;
    }
    // --- 2) boom_fire (lighter, 260ms, olcek 0.55→2.1, rastgele donus, (1-t)^2.8)
    if (fireT < 1) {
      const sc = 0.55 + fireT * 1.55;
      const decay = Math.pow(1 - fireT, 2.8);   // DOGRUSAL DEGIL
      const sz = CONFIG.FX.explosion.baseSize * sc;
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = decay;
      c.rotate(this.rot);
      assets.draw(c, 'boom_fire', -sz / 2, -sz / 2, sz, sz);
      c.rotate(-this.rot);
      c.globalAlpha = 1;
    }
    // --- 3) boom_smoke (normal karisim, gecikmeli, alfa <= 0.16, yukari suruklenme)
    if (smokeT > 0 && smokeT < 1) {
      const sc = 0.6 + smokeT * 1.2;
      const a = F.smokeMaxAlpha * (1 - smokeT);
      const driftY = smokeT * CONFIG.FX.explosion.smokeDrift;   // hafif yukari suruklenme
      const sz = CONFIG.FX.explosion.baseSize * sc;
      const E = CONFIG.FX.explosion;
      c.globalCompositeOperation = 'source-over';
      // Yumusak kenar (vision P2): once genis/soluk hale, uzerine cekirdek.
      // Hale payi cekirdekten dikiliyor (core = a*(1-pay)) — boylece merkezde
      // toplam alfa smokeMaxAlpha'yi ASMAZ, yalnizca kenar gecisi kademelenir.
      const hsz = sz * E.smokeHaloScale;
      c.globalAlpha = a * E.smokeHaloAlpha;
      assets.draw(c, 'boom_smoke', -hsz / 2, driftY - hsz / 2, hsz, hsz);
      c.globalAlpha = a * (1 - E.smokeHaloAlpha);
      assets.draw(c, 'boom_smoke', -sz / 2, driftY - sz / 2, sz, sz);
      c.globalAlpha = 1;
    }
    c.restore();
  }
}

/* Sok dalgasi: ince halka, yaricap <= 34 px, omru <= 190 ms, karesel sonum.
   Uzun omurlu/genis halka ekranda "alakasiz daire" olarak okunur.       */

/* ---- src/fx/Shockwave.js ---- */
class Shockwave {
  constructor() { this.active = false; }
  spawn(x, y) { this.x = x; this.y = y; this.t = 0; this.active = true; }
  update(dt) { this.t += dt; if (this.t >= CONFIG.FX.shockMs / 1000) this.active = false; }
  draw(c) {
    const F = CONFIG.FX;
    const t = this.t / (F.shockMs / 1000);   // 0..1
    const r = 6 + t * (F.shockMaxR - 6);     // 6 -> 34 px
    const a = (1 - t) * (1 - t);             // karesel sonum
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.strokeStyle = `rgba(255,230,180,${(0.7 * a).toFixed(3)})`;
    c.lineWidth = 2;
    c.beginPath(); c.arc(this.x, this.y, r, 0, Math.PI * 2); c.stroke();
    c.restore();
  }
}

/* Kivilcim: havuzdan, renk ve alfa kovasina gore GRUPLU cizim.
   Parcalik basina drawImage YAPMAZ — grup basina tek beginPath + tek fill.
   Renk kovasi: turuncu / saribeyaz. Alfa kovasi: 3 kova (yuksek/orta/dusuk). */

/* ---- src/fx/Spark.js ---- */
class Spark {
  constructor() { this.active = false; }
  spawn(x, y, seed) {
    let s = (seed * 40503 + 12345) >>> 0;
    const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    const ang = rnd() * Math.PI * 2;
    const sp = CONFIG.FX.sparkSpeedMin + rnd() * (CONFIG.FX.sparkSpeedMax - CONFIG.FX.sparkSpeedMin);
    this.x = x; this.y = y;
    this.vx = Math.cos(ang) * sp;
    this.vy = Math.sin(ang) * sp;
    this.life = CONFIG.FX.sparkLifeMin + rnd() * (CONFIG.FX.sparkLifeMax - CONFIG.FX.sparkLifeMin);
    this.maxLife = this.life;
    // renk kovasi: 0 = turuncu, 1 = saribeyaz
    this.colorBin = rnd() < 0.6 ? 0 : 1;
    this.size = CONFIG.FX.spark.sizeMin + rnd() * (CONFIG.FX.spark.sizeMax - CONFIG.FX.spark.sizeMin);
    this.active = true;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += CONFIG.FX.spark.gravity * dt;   // hafif yercekbim
    this.life -= dt;
    if (this.life <= 0) this.active = false;
  }
}

/* Kivilcim havuzu + gruplu cizim. Ayni anda cizilen parcalik <= sparkPool. */

/* ---- src/fx/SparkSystem.js ---- */
class SparkSystem {
  constructor(size) {
    this.pool = new Pool(size, () => new Spark());
    this._seed = 7;
  }
  burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const s = this.pool.acquire();
      if (!s) break;
      this._seed++;
      s.spawn(x, y, this._seed);
    }
  }
  update(dt) { this.pool.forEach((s) => s.update(dt)); }
  count() { return this.pool.count(); }
  /* Gruplu cizim: renk kovasi (2) x alfa kovasi (3) = en fazla 6 grup.
     Grup basina TEK beginPath + TEK fill. Parcalik basina drawImage YOK. */
  draw(c) {
    const bins = [[], [], [], [], [], []];   // [colorBin*3 + alphaBin]
    this.pool.forEach((s) => {
      const lt = s.life / s.maxLife;         // 1 -> 0
      const abin = lt > 0.66 ? 2 : lt > 0.33 ? 1 : 0;
      bins[s.colorBin * 3 + abin].push(s);
    });
    const colors = [
      ['rgba(255,140,40,', 'rgba(255,170,60,', 'rgba(255,200,80,'],   // turuncu
      ['rgba(255,230,180,', 'rgba(255,240,200,', 'rgba(255,255,230,'], // saribeyaz
    ];
    const alphas = [0.3, 0.6, 0.95];
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (let ci = 0; ci < 2; ci++) {
      for (let ai = 0; ai < 3; ai++) {
        const arr = bins[ci * 3 + ai];
        if (!arr.length) continue;
        c.fillStyle = colors[ci][ai] + alphas[ai] + ')';
        c.beginPath();
        for (const s of arr) {
          c.moveTo(s.x + s.size, s.y);
          c.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        }
        c.fill();
      }
    }
    c.restore();
  }
  reset() { this.pool.reset(); }
}

/* Patlama + sok dalgasi havuzlari (cizim katmani). */

/* ---- src/fx/Smoke.js ---- */
class Smoke {
  constructor() { this.active = false; }
  spawn(x, y, life, rnd) {
    const S = CONFIG.FX.smoke;
    this.x = x; this.y = y;
    this.life = life;
    this.maxLife = life;
    // Boyut varyasyonu LCG'den (Math.random YASAK — determinizm). rnd == null
    // ise varyasyon 0: cagiran taraf seed akisi vermeden de guvenle kullanir.
    const v = rnd == null ? 0 : (rnd() - 0.5) * 2;      // -1..1
    this.size = S.size * (1 + v * S.sizeVar);
    this.grow = S.grow * (1 + v * 0.5);                 // buyume egrisi de degisir
    this.vy = S.vy;         // hafif yukari suruklenme
    this.active = true;
  }
  update(dt) {
    this.y += this.vy * dt;
    this.size += this.size * this.grow * dt;  // "yapistirilmis" sabit daireleri kirar
    this.life -= dt;
    if (this.life <= 0) this.active = false;
  }
}

/* Hurda duman izi parcacigi: gruplu cizimde alfa kovasina gore tek fill.
 * Kenarlar SmokeSystem'deki konsantrik edgePasses ile kademelendirilir. */

/* ---- src/fx/SmokeSystem.js ---- */
class SmokeSystem {
  constructor(size) {
    this.pool = new Pool(size, () => new Smoke());
    this._bins = [[], [], []];   // sicak dongude new yok — bir kez ayrildi
  }
  acquire() { return this.pool.acquire(); }
  update(dt) { this.pool.forEach((s) => s.update(dt)); }
  count() { return this.pool.count(); }
  /* Gruplu cizim: alfa kovasi (3) — kova basina TEK beginPath + TEK fill.
   * Yumusak kenar (vision P2): her kova icinde icteki-disa konsantrik
   * edgePasses cizilir. Ayni pass'in daireleri TEK path'te birlesir (union),
   * yani ust uste binen parcaciklar istiflenmez; pass alfalari agirlikla
   * olceklendirildigi icin merkezdeki toplam alfa eski tepe alfa ile ayni
   * kalir. Kenarda ise alfa 1.0 -> 0.45 -> 0.17 -> 0 kademeli dusus yapar. */
  draw(c) {
    const S = CONFIG.FX.smoke;
    const bins = this._bins;
    bins[0].length = 0; bins[1].length = 0; bins[2].length = 0;
    this.pool.forEach((s) => {
      const lt = s.life / s.maxLife;         // 1 -> 0
      bins[lt > 0.66 ? 2 : lt > 0.33 ? 1 : 0].push(s);
    });
    const alphas = [0.05, 0.09, 0.14];       // duman: dusuk alfa (<= 0.16 kurali)
    const passes = S.edgePasses;
    c.save();
    for (let ai = 0; ai < 3; ai++) {
      const arr = bins[ai];
      if (!arr.length) continue;
      for (let pi = 0; pi < passes.length; pi++) {
        const P = passes[pi];
        const a = (alphas[ai] * P.w).toFixed(4);
        c.fillStyle = `rgba(${S.rgb},${a})`;
        c.beginPath();
        for (let k = 0; k < arr.length; k++) {
          const s = arr[k];
          const r = s.size * P.r;
          c.moveTo(s.x + r, s.y);
          c.arc(s.x, s.y, r, 0, Math.PI * 2);
        }
        c.fill();
      }
    }
    c.restore();
  }
  reset() { this.pool.reset(); }
}

/* Hurda duman izi havuzu — parcalik basina drawImage YOK, gruplu fill. */

/* ---- src/fx/FallingWreck.js ---- */
class FallingWreck {
  constructor() { this.active = false; }
  spawn(x, y, sprite, seed) {
    // LCG ile deterministik donme + savrulma (Math.random YOK)
    let s = (seed * 2654435761 + 1013904223) >>> 0;
    const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    const W = CONFIG.FX.wreck;
    this.x = x; this.y = y;
    this.sprite = sprite;
    this.t = 0;
    this.ang = 0;
    this.av = (rnd() - 0.5) * 2 * W.spinMax;        // ±3 rad/s
    this.vx = (rnd() - 0.5) * 2 * W.driftMax;        // hafif yatay savrulma (px/s)
    this.vy = W.startVy;                             // baslangicta hafif asagi itki
    this.size = 48;                                  // cizim boyutu (manifest taban ~64)
    this._smokeAcc = 0;                              // duman izi biriktirici (s)
    this._rnd = rnd;                                 // duman boyut varyasyonu icin LCG akisi
    this.active = true;
  }
  update(dt, fx) {
    const W = CONFIG.FX.wreck;
    this.t += dt;
    if (this.t >= W.lifeMs / 1000) {
      // omur dolunca kucuk patlama ile yok ol (once aktiflik false — havuzdan
      // yeni nesne alinirken bu slot serbesttir)
      this.active = false;
      fx.explode(this.x, this.y);
      return;
    }
    this.vy += W.gravity * dt;                       // yercekimi ~380 px/s^2
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.ang += this.av * dt;                        // kirilan pervane: donerek suzulur
    // arkasinda incelen duman izi (parcacik havuzu — gruplu cizim)
    this._smokeAcc += dt;
    // smokeEvery > 0 sarti: sabit 0/undefined olursa `while` ya hic donmez
    // (ozellik sessizce olur — Round 15'te tam bu oldu) ya da sonsuz doner.
    while (W.smokeEvery > 0 && this._smokeAcc >= W.smokeEvery) {
      this._smokeAcc -= W.smokeEvery;
      const p = fx.smoke.acquire();
      if (!p) break;
      p.spawn(this.x + Math.sin(this.ang) * 10, this.y - 14, W.smokeLife, this._rnd);
    }
  }
  draw(c, assets) {
    const W = CONFIG.FX.wreck;
    const t = this.t / (W.lifeMs / 1000);            // 0..1
    const a = Math.min(1, (1 - t) * 2);              // son yarida sol
    c.save();
    c.globalAlpha = a;
    c.translate(this.x, this.y);
    c.rotate(this.ang);
    assets.draw(c, this.sprite, -this.size / 2, -this.size / 2, this.size, this.size);
    c.restore();
  }
}

/* Dusen hurda: vurulan dron aninda patlayip yok olmaz — pervanesi kirilip
   donerek asagi suzulen, arkasinda duman izi birakan ceset. Omuru dolunca
   kucuk patlama ile yok olur. Aci/hiz LCG'den (determinizm).               */

/* ---- src/fx/Scorch.js ---- */
/* Scorch — kara hedefi ölünce zeminde kalan is izi (Round 17). YALNIZ CIZIM.
   Bir numarali kural — zemine civili olma (GroundUnit ile birebir ayni model):
     Alanlar `x` (ekran x) + `y0`/`spawnDist` (dogus anindaki ekran y ve
     city.dist). Ekran y'si HER KAREDE zemin kaymasindan türetilir:
       screenY = y0 + (city.dist - spawnDist)
     Kendi vy'si YOKTUR; y0/spawnDist sim icinde asla degismez. Boylece bir
     sim adiminda ΔscreenY tam olarak Δcity.dist kadardir — zeminle birebir
     ayni hizda kayar, "ucan iz" olmaz. */
class Scorch {
  constructor() { this.active = false; }
  spawn(x, y0, spawnDist) {
    this.x = x;                 // ekran x (sim sabiti)
    this.y0 = y0;               // dogus anindaki ekran y
    this.spawnDist = spawnDist; // dogus anindaki city.dist
    this.t = 0;
    this.active = true;
  }
  /* Ekran y konumu — zemin kaymasindan türetilir (cizim uzayi). */
  screenY(city) { return this.y0 + (city.dist - this.spawnDist); }
  update(dt) {
    this.t += dt;
    if (this.t >= CONFIG.FX.scorch.lifeMs / 1000) this.active = false;
  }
  draw(c, city) {
    const S = CONFIG.FX.scorch;
    const t = this.t / (S.lifeMs / 1000);   // 0..1
    const sy = this.screenY(city);
    if (sy < -40 || sy > CONFIG.H + 40) return;   // ekranda degilse cizme
    // alfa: 0.55'ten 0'a, yumusak sonum (ilk yarida belirgin, sonra sön)
    const a = S.maxAlpha * Math.pow(1 - t, 1.6);
    const r = S.r * (1 + t * 0.25);            // hafif genisleme (is yayilir)
    c.save();
    c.globalCompositeOperation = 'source-over';   // normal karisim (lighter DEGIL)
    c.translate(this.x, sy);
    c.scale(1, S.squash);                       // yatik elips (perspektif)
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, `rgba(18,14,12,${a.toFixed(3)})`);
    g.addColorStop(0.6, `rgba(18,14,12,${(a * 0.5).toFixed(3)})`);
    g.addColorStop(1, 'rgba(18,14,12,0)');        // yumusak kenar
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, r, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

/* Kara hedefi patlamasindan geriye kalan iz: koyu, yumusak kenarli radyal
   elips. Zemine civili — GroundUnit'in y0/spawnDist modeliyle ayni mekanizma. */

/* ---- src/fx/ScorePop.js ---- */
/* ScorePop — öldürülen düşmanın yerinde yükselip sönen puan yazısı (Round 18).
   YALNIZ CIZIM: sim'e dokunmaz, determinizm bozulmaz. Sıcak döngüde nesne
   tahsisi yok (havuz + yeniden kullanılan alanlar). Boyut başına canvas
   önbelleği YASAK — her karede tek fillText + tek strokeText.

   tier 0..4: renk soğuktan sıcağa ısınır (beyaz → açık sarı → turuncu →
   kırmızımsı). Kombo çarpanı yükseldikçe oyuncu ekranda görür. */
class ScorePop {
  constructor() { this.active = false; }
  spawn(x, y, text, tier) {
    this.x = x;
    this.y = y;
    this.text = text;
    const t = Math.max(0, Math.min(4, tier | 0));   // 0..4'e kilitle
    this.r = SCORE_POP_TIER[t][0];
    this.g = SCORE_POP_TIER[t][1];
    this.b = SCORE_POP_TIER[t][2];
    this.t = 0;
    this.active = true;
  }
  update(dt) {
    this.t += dt;
    if (this.t >= CONFIG.FX.scorePop.lifeMs / 1000) this.active = false;
  }
  draw(c) {
    const S = CONFIG.FX.scorePop;
    const dur = S.lifeMs / 1000;
    const t = this.t / dur;                          // 0..1
    const a = t < S.fadeStart ? 1 : 1 - (t - S.fadeStart) / (1 - S.fadeStart);
    const y = this.y - S.rise * t;                   // yukarı süzülme
    c.save();
    c.globalAlpha = a;
    c.font = `bold ${S.fontSize}px monospace`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    const col = `${this.r},${this.g},${this.b}`;
    c.strokeStyle = `rgba(0,0,0,${(a * 0.6).toFixed(3)})`;   // gölge/stroke (tek)
    c.lineWidth = 3;
    c.strokeText(this.text, this.x, y);
    c.fillStyle = `rgba(${col},${a.toFixed(3)})`;            // dolgu (tek)
    c.fillText(this.text, this.x, y);
    c.restore();
  }
}

/* tier 0..4 → RGB (soğuk → sıcak). Modül seviyesinde sabit dizi: sıcak
   döngüde yeni nesne yok, indeksle okunur. */
const SCORE_POP_TIER = [
  [255, 255, 255],   // 0 beyaz
  [255, 232, 140],   // 1 açık sarı
  [255, 170, 60],    // 2 turuncu
  [255, 110, 50],    // 3 kızıl-turuncu
  [255, 60, 50],     // 4 kırmızımsı
];

/* ---- src/fx/FxSystem.js ---- */
class FxSystem {
  constructor() {
    this.explosions = new Pool(16, () => new Explosion());
    this.shockwaves = new Pool(16, () => new Shockwave());
    this.sparks = new SparkSystem(CONFIG.FX.sparkPool);
    /* Round 15: dusen hurda + duman izi */
    this.wrecks = new Pool(CONFIG.FX.wreck.pool, () => new FallingWreck());
    this.smoke = new SmokeSystem(CONFIG.FX.wreck.smokePool);
    /* Round 17: zemin izi (scorch) — kara hedefi ölünce yerde kalan is izi.
       Zemine civili: y0/spawnDist ile city.dist'ten türetilir (GroundUnit modeli). */
    this.scorches = new Pool(CONFIG.FX.scorch.pool, () => new Scorch());
    /* Round 18: skor baloncuğu — öldürülen düşmanın yerinde yükselip sönen
       puan yazısı. Yalniz cizim; game paketi state() kancasiyla okur. */
    this.scorePops = new Pool(CONFIG.FX.scorePop.pool, () => new ScorePop());
    /* Glitch / statik — yalniz cizim (sim'e dokunmaz).
       _glitchT/_glitchDur/_glitchAmp: anlik hasar glitch'i (sonekli).
       _ambientGlitch: surekli zayif seviye (jammer menzili), 0..1. */
    this._glitchT = 0;
    this._glitchDur = 0;
    this._glitchAmp = 1;
    this._ambientGlitch = 0;
    /* Round 17: flak parlama — kisa lighter flash (yalniz cizim). */
    this._flakFlash = null;
    this._seed = 1;
  }
  explode(x, y) {
    this._seed++;
    const e = this.explosions.acquire();
    if (e) e.spawn(x, y, this._seed);
    const w = this.shockwaves.acquire();
    if (w) w.spawn(x, y);
    this.sparks.burst(x, y, CONFIG.FX.sparksPerExplosion);
  }
  hit(x, y) {
    // kucuk vurus: yalniz kivilcim (patlama degil)
    this._seed++;
    this.sparks.burst(x, y, 5);
  }
  /* Vurulan dron: aninda patlamak yerine pervanesi kirilip donerek asagi
     suzulen hurda. sprite: Enemy.sprite (drone_*). seedStream: LCG tohumu. */
  spawnWreck(x, y, sprite, seedStream) {
    this._seed++;
    const w = this.wrecks.acquire();
    if (w) w.spawn(x, y, sprite, (seedStream | 0) + this._seed);
  }
  /* Round 17: kara hedefi ölünce zeminde kalan is izi. Zemine civili —
     y0/spawnDist ile city.dist'ten türetilir (GroundUnit modeli). Cizim katmani. */
  spawnScorch(x, y0, spawnDist) {
    const s = this.scorches.acquire();
    if (s) s.spawn(x, y0, spawnDist);
  }
  /* Round 18: öldürülen düşmanın yerinde yükselip sönen puan yazısı.
     tier 0..4 rengi soğuktan sıcağa ısıtır (kombo çarpanı). Yalniz cizim. */
  scorePop(x, y, text, tier) {
    const p = this.scorePops.acquire();
    if (p) p.spawn(x, y, text, tier);
  }
  /* Round 17: ucaksavar mermisinin havada patlamasi — kisa parlama + 6-8
     kivilcim. Mevcut Spark/SparkSystem havuzlarini kullanir; yeni parcacik
     sinifi YOK. Parcaliklar gruplu cizilir (renk/alfa kovasi). */
  flak(x, y) {
    this._seed++;
    this.sparks.burst(x, y, CONFIG.FX.flak.sparks);   // 7 kivilcim (havuzdan)
    this._flakFlash = { x, y, t: 0, dur: CONFIG.FX.flak.flashMs / 1000 };
  }
  /* Glitch / statik: yatay kayma seritleri + statik gurultu. YALNIZ CIZIM.
     ms: sure; amp: genlik (1 = tam, <1 = hafif/jammer). */
  glitch(ms, amp) {
    const t = ms / 1000;
    if (t > this._glitchT || !this._glitchDur) {
      this._glitchDur = t;
      this._glitchAmp = amp != null ? amp : 1;
    }
    this._glitchT = Math.max(this._glitchT, t);
  }
  /* Surekli zayif glitch (jammer menzili): level 0..1. Yalniz cizim — sim'e
     dokunmaz, update() sayacini kullanmaz; her karede aktif kalir. */
  setAmbientGlitch(level) {
    this._ambientGlitch = Math.max(0, Math.min(1, level || 0));
  }
  get glitchActive() { return this._glitchT > 0 || this._ambientGlitch > 0; }
  /* ---------------------------------------------------------------- olcum
     Round 22: bu iki ozellik (dusen hurda + glitch) yazilmisti ama hicbir
     kapi onlari goremiyordu; enkaz NaN koordinata ucsa bile ekranda ayirt
     edilemiyordu. Asagidakiler game paketinin state() kancasiyla disari
     verecegi duz okuyuculardir. YALNIZ OKUR — sim'e de cizime de dokunmaz. */
  wreckCount() { return this.wrecks.count(); }
  /* Tum aktif enkazin x/y/ang degerleri sonlu mu. NaN NOBETI: kasten
     savunmaci degil — config anahtari yine kaybolursa bu false donmeli. */
  wreckFinite() {
    let ok = true;
    this.wrecks.forEach((w) => {
      if (!(isFinite(w.x) && isFinite(w.y) && isFinite(w.ang))) ok = false;
    });
    return ok;
  }
  /* Ornek enkaz (ilk aktif): y'nin kare kare ARTTIGI olculur — yani gercekten
     dusuyor mu. Aktif enkaz yoksa null. */
  wreckSample() {
    for (const w of this.wrecks.items) {
      if (w.active) return { x: w.x, y: w.y, ang: w.ang };
    }
    return null;
  }
  /* Ambient (jammer) glitch yogunlugu 0..1. */
  ambientGlitchLevel() { return this._ambientGlitch; }
  /* Anlik hasar glitch'inin kalan suresi, saniye (sonmusse 0). */
  damageGlitchT() { return this._glitchT > 0 ? this._glitchT : 0; }
  update(dt) {
    this.explosions.forEach((e) => e.update(dt));
    this.shockwaves.forEach((w) => w.update(dt));
    this.sparks.update(dt);
    this.wrecks.forEach((w) => w.update(dt, this));
    this.smoke.update(dt);
    this.scorches.forEach((s) => s.update(dt));
    this.scorePops.forEach((p) => p.update(dt));
    if (this._flakFlash && (this._flakFlash.t += dt) >= this._flakFlash.dur) this._flakFlash = null;
    /* Sayac 0'in ALTINA dusmemeli: eskiden sinirsiz negatife gidiyordu ve
       _glitchDur eski degerinde kaliyordu; sonraki (daha zayif) glitch dogru
       genligi alsa da damageT olcumu anlamsiz negatif bir sayi veriyordu.
       Sonunce dur'u da sifirla — glitch()'in `!this._glitchDur` dali boylece
       yeni genligi kesin olarak devralir. */
    if (this._glitchT > 0) {
      this._glitchT -= dt;
      if (this._glitchT <= 0) { this._glitchT = 0; this._glitchDur = 0; }
    }
  }
  draw(c, assets, city) {
    /* Round 17: zemin izi — sehir zemininin UZERINDE, kara hedeflerinin ALTINDA.
       Zeminle birebir ayni hizda kayar (city.dist'ten türetilir). */
    this.scorches.forEach((s) => s.draw(c, city));
    this.explosions.forEach((e) => e.draw(c, assets));
    this.shockwaves.forEach((w) => w.draw(c));
    this.sparks.draw(c);
    this.smoke.draw(c);
    this.wrecks.forEach((w) => w.draw(c, assets));
    this.scorePops.forEach((p) => p.draw(c));
    this._drawFlakFlash(c);
    if (this.glitchActive) this._drawGlitch(c);
  }
  /* Round 17: flak parlama — kisa lighter flash (yalniz cizim, sim'e dokunmaz). */
  _drawFlakFlash(c) {
    const f = this._flakFlash;
    if (!f) return;
    const t = f.t / f.dur;                 // 0..1
    const a = Math.pow(1 - t, 2);          // karesel sonum
    const r = CONFIG.FX.flak.flashR * (0.5 + t * 0.8);
    c.save();
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, `rgba(255,240,200,${a.toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(f.x, f.y, r, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  /* Glitch cizimi: ekranin KENDISINI kesip yatay kaydiran seritler +
     deterministik statik gurultu satirlari. performance.now() YALNIZ cizimde.
     Anlik hasar glitch'i (sonekli) ile ambient seviye toplanir ama toplam
     CONFIG.FX.glitchMaxCap'te tavani asamaz — ikisi ayni anda gorse bile
     ekran donmez. Ambient tek basina seyrek ve zayif kalir. */
  _drawGlitch(c) {
    const W = CONFIG.W, H = CONFIG.H;
    const cap = CONFIG.FX.glitchMaxCap;
    let amp = 0;
    if (this._glitchT > 0 && this._glitchDur > 0) {
      const t = this._glitchT / this._glitchDur;   // 1 -> 0
      amp += this._glitchAmp * t;                  // anlik, sonen genlik
    }
    if (this._ambientGlitch > 0) amp += this._ambientGlitch;
    if (amp > cap) amp = cap;
    if (amp <= 0) return;
    const now = performance.now();
    c.save();
    // --- yatay kayma seritleri: kaynak tuvalden kes, yonunde kaydir
    // ambient tek basina oldugunda seritler seyrek (2/4) ve dar olur.
    const strips = this._glitchT > 0 ? 4 : 2;
    for (let i = 0; i < strips; i++) {
      const sy = ((Math.sin(now * 0.021 + i * 1.7) * 0.5 + 0.5) * H) | 0;
      const sh = 8 + ((Math.sin(now * 0.033 + i * 2.9) * 0.5 + 0.5) * 18) | 0;
      const off = Math.sin(now * 0.05 + i * 4.1) * 14 * amp;
      if (off === 0 || sy + sh > H) continue;
      c.drawImage(c.canvas, 0, sy, W, sh, off, sy, W, sh);
    }
    // --- statik gurultu: az sayida ince beyaz/koyu satir (deterministik)
    let s = (now * 0.017) | 0;
    const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    c.globalCompositeOperation = 'lighter';
    const lines = this._glitchT > 0 ? 6 : 3;
    for (let i = 0; i < lines; i++) {
      const gy = (rnd() * H) | 0;
      const gh = 1 + (rnd() * 2) | 0;
      c.fillStyle = `rgba(200,220,255,${(0.10 * amp).toFixed(3)})`;
      c.fillRect(0, gy, W, gh);
    }
    c.restore();
  }
  reset() {
    this.explosions.reset();
    this.shockwaves.reset();
    this.sparks.reset();
    this.wrecks.reset();
    this.smoke.reset();
    this.scorches.reset();
    this.scorePops.reset();
    this._flakFlash = null;
    this._glitchT = 0;
    this._glitchDur = 0;
    this._glitchAmp = 1;
    this._ambientGlitch = 0;
  }
}

/* -------------------------------------------------------------- CityScroller
   Sehir uc katman: zemin karosu (dikey kayar), binalar (daha hizli + seyrek),
   bir kez gecen simge yapi. Oyuncunun yatay konumu (-1..1) katmanlari TERS
   yonde kaydirir (parallaks). Kayma soneumlu — ani ziplama yok.

   Bina yerlesimi DETERMINISTIK: LCG ile, kaydirma mesafesine bagli.
   Math.random() YOK. Iki kare hizinda ayni binalar ayni yerde olmalidir.      */

/* ---- src/world/CityScroller.js ---- */
class CityScroller {
  constructor(assets) {
    this.assets = assets;
    this.city = 'istanbul';
    this.prevCity = null;           // crossfade: onceki sehir (null = yok)
    this.fadeT = 1;                 // 0..1 (1 = tam yeni sehir)
    this.buildings = [];            // bu sehir icin building_* adlari
    this.prevBuildings = [];        // onceki sehir binalari (crossfade)
    this.landmark = '';
    this._catalog();
    this.dist = 0;                  // toplam kaydirma mesafesi (px)
    this.smoothX = 0;               // soneumlu oyuncu x (-1..1)
    this.builtUpTo = -1;            // son uretilen slot (slot = floor(dist/SPACING))
    this.lastLandmarkSlot = -9999;
    this.buildingsList = [];        // ekrandaki bina instanslari
    this.prevBuildingsList = [];    // onceki sehir binalari (crossfade)
    this.landmarkShown = false;     // bu bölümde simge yapı geçti mi
    this.landmarkY = 0;             // simge yapının taban y konumu (dist uzayında)
  }
  _catalog() {
    const b = [], l = {};
    for (const s of this.assets.manifest.sprites) {
      if (s.kind === 'building') b.push(s.name);
      else if (s.kind === 'landmark') l[s.name] = true;
    }
    // Bolum listesi CONFIG.STAGES'ten turetilir; yeni bolum eklendiginde
    // katalog otomatik genisler (round 16: 'port' liman — binasi ve simge
    // yapisi yok, bu iki alan bos kalir).
    const cities = CONFIG.STAGES.map((s) => s.city);
    for (const city of cities) {
      const names = b.filter((n) => n.includes('_' + city + '_'));
      const lm = Object.keys(l).find((n) => n.includes(city));
      this['city_' + city] = { buildings: names, landmark: lm || '' };
    }
  }
  setCity(name, instant) {
    if (instant) {
      this.prevCity = null;
      this.fadeT = 1;
      this.prevBuildings = [];
      this.prevBuildingsList = [];
    } else if (this.city !== name) {
      // crossfade: onceki sehir kaybolurken yeni sehir belirir
      this.prevCity = this.city;
      this.prevBuildings = this.buildings.slice();
      this.prevBuildingsList = this.buildingsList.slice();
      this.fadeT = 0;
    }
    this.city = name;
    const c = this['city_' + name] || this.city_istanbul;
    this.buildings = c.buildings;
    this.landmark = c.landmark;
    this.dist = 0;
    this.smoothX = 0;
    this.builtUpTo = -1;
    this.lastLandmarkSlot = -9999;
    this.buildingsList = [];
    this.landmarkShown = false;
    this.landmarkY = 0;
  }
  /* Bir sim adiminda ilerletir. playerNx: oyuncu x normalizasyonu (-1..1). */
  update(dt, playerNx) {
    const P = CONFIG.PARALLAX;
    this.dist += CONFIG.SCROLL.speed * dt;
    // kritik sonumlu yaklasim: h = 1 - exp(-k*dt) (adim boyutundan bagimsiz)
    const h = 1 - Math.exp(-P.smooth * dt);
    this.smoothX += (playerNx - this.smoothX) * h;
    // crossfade ilerletme
    if (this.fadeT < 1) {
      this.fadeT = Math.min(1, this.fadeT + dt * 1000 / CONFIG.CROSSFADE_MS);
      if (this.fadeT >= 1) {
        this.prevCity = null;
        this.prevBuildingsList = [];
      }
    }
    this._ensureBuilt();
  }
  /* Simge yapı artık SAHNEDE CIZILMEZ — bölüm kartında amblem olarak
     kullanilir (round 8). "Uçuşan binalar" duzeltmesinde bina sprite katmani
     sahneden kaldirildi; landmark da o katmandaydi ve gorunmuyordu. Dunyaya
     geri koymak ayni sorunu yaratir (tepeden cekilmis fotografin uzerine egik
     acidan cizilmis sprite havada durur). Bu metot artik yalnizca flag'i
     ayarlar; kart, Game tarafinda stageTitleT ile tetiklenir.               */
  triggerLandmark() {
    if (this.landmarkShown || !this.landmark) return;
    this.landmarkShown = true;
  }
  /* NOT: bina katmani CIZILMEZ — "ucusan binalar" duzeltmesinde cizim
     sahneden kaldirildi. Bu uretim yalnizca buildingsOnScreen test kancasini
     (Game.state -> tools/evaluate.py) besler; sim/carpisma okumaz. */
  _ensureBuilt() {
    const SPACING = 260;                       // bina araligi (px)
    const H = CONFIG.H;
    const maxSlot = Math.floor((this.dist + H) / SPACING);
    if (this.builtUpTo >= maxSlot) return;     // yeni slot yok -> tarama yok
    while (this.builtUpTo < maxSlot) {
      this.builtUpTo++;
      this._spawnAt(this.builtUpTo, SPACING);
    }
    // ekrandan coktan cikmis binasi at (yalnızca spawn olan adımda)
    const minY = this.dist - H;                // y < minY -> ekranin ustunde
    this.buildingsList = this.buildingsList.filter((b) => b.y > minY - 400);
  }
  _spawnAt(slot, spacing) {
    // LCG: her slot icin deterministik tohum (Math.random YOK)
    let seed = (slot * 2654435761 + 1013904223) >>> 0;
    const rnd = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const baseY = slot * spacing;              // bina tabaninin kaydirilmis y'si
    const idx = this.buildings.length ? Math.floor(rnd() * this.buildings.length) : 0;
    const name = this.buildings[idx];
    // Cizim olcegi manifest boyutunun 0.45-0.65'i araliginda (round 4):
    // binalar sahneye oturur, ekranin uctunu kaplamaz.
    const P = CONFIG.PARALLAX;
    const sc = P.buildingScaleMin + rnd() * (P.buildingScaleMax - P.buildingScaleMin);
    const s = this.assets.manifest.sprites.find((m) => m.name === name);
    const bw = s ? Math.round(s.width * sc) : Math.round(130 * sc);
    const x = 20 + rnd() * (CONFIG.W - 40 - bw);
    this.buildingsList.push({ name, x, y: baseY, w: bw, scale: sc });
  }
  /* Sehir cizimi — "ucusan binalar" duzeltmesi.
   *
   * Once zeminin uzerine ayri bina sprite'lari cizilirdi. Kullanicinin sorusu
   * hakliydi: Bogaz'in ortasinda duran bir bina cikiyordu. Iki sebep vardi —
   * (1) bina katmani zeminden HIZLI kayiyordu (170 vs 120 px/s), yani gercekten
   * havada suzuluyorlardi; (2) zemin tam tepeden cekilmis ortografik bir hava
   * goruntusu, bina sprite'lari ise egik acidan cizilmisti; iki farkli
   * projeksiyon yan yana durunca goz onlari sahneye ait saymiyor. Ustelik
   * fotograf zaten kendi binalarini iceriyor, ustune bina koymak cakisma demek.
   *
   * Cozum: bina sprite'lari sahneden kaldirildi. Aci hissi sehir KAROSUNUN
   * kendisinden geliyor — karo hafifce buyutulup (zoom) oyuncunun yatay
   * konumuna gore ters yonde kaydiriliyor. Fotograftaki gercek yuksek binalar
   * goruntunun icinde oldugu icin tum kare birlikte kayinca "aci degisti" diye
   * okunuyor ve hicbir sey havada durmuyor. Simge yapilar da dunyadan cikarildi;
   * bolum basligi kartinda amblem olarak kullaniliyorlar (UI, dunya degil).      */
  draw(c, alpha) {
    const P = CONFIG.PARALLAX;
    const H = CONFIG.H;
    const W = CONFIG.W;
    const sy = this.dist % H;
    const zoom = P.tileZoom;                 // karo ekrandan biraz buyuk cizilir
    const zw = W * zoom, zh = H * zoom;
    const padX = (zw - W) / 2, padY = (zh - H) / 2;
    // oyuncu saga gidince goruntu sola kayar: aci degismis gibi
    const shift = -this.smoothX * P.cityShift;
    /* Karo A/B sirali dongusu (round 11): her sehir icin iki karo vardir
       (city_<sehir> ve city_<sehir>_b). Dikey dongude ikisi SIRAYLA dizilir
       (A, B, A, B...) — tekrar araligi iki katina cikar, ayni goruntu pes
       pese gelmez. Karo yukseklikleri esittir (800 px), gecis dikissizdir. */
    const drawCity = (name, a) => {
      if (a <= 0) return;
      const tileA = 'city_' + name;
      const tileB = 'city_' + name + '_b';
      const hasB = this.assets.has(tileB) || !!this.assets.fallback[tileB];
      const T = hasB ? H * 2 : H;        // dongu periyodu (px)
      const off = ((this.dist % T) + T) % T;
      c.save();
      c.globalAlpha = a;
      const x = -padX + shift;
      for (let k = -1; k <= 2; k++) {
        const base = off + k * T;
        for (let i = 0; i < 2; i++) {
          const yTop = base + i * H;
          if (yTop > H || yTop + H < 0) continue;
          let tName = i === 0 ? tileA : tileB;
          if (!hasB) tName = tileA;      // fallback: _b yoksa tek karoyla devam
          this.assets.draw(c, tName, x, yTop - padY, zw, zh);
        }
      }
      c.restore();
    };
    if (this.fadeT < 1 && this.prevCity) drawCity(this.prevCity, 1 - this.fadeT);
    drawCity(this.city, this.fadeT < 1 ? this.fadeT : 1);
  }
  /* Test kancasi: su an ekranda cizilen bina sayisi (landmark dahil degil). */
  onScreenCount() {
    const H = CONFIG.H;
    let n = 0;
    for (const b of (this.buildingsList || [])) {
      if (b.landmark) continue;
      const y = b.y - this.dist;
      if (y > -200 && y < H + 200) n++;
    }
    return n;
  }
  /* Test kancasi: bina katmani yatay ofseti (parallaks). */
  layerOffset() { return -this.smoothX * CONFIG.PARALLAX.buildingShift; }
}

/* --------------------------------------------------------------- CloudLayer
   Bulut katmani (round 10+11): sehir UZERINDE, dronlar ALTINDA cizilir.
   Dikey: zeminden hizli kayar (185 px/s vs 120) — yukseklik hissi.
   Yatay: oyuncunun x konumuna TERS yonde ve zeminden DAHA GUCLU kayar
   (hShift 70 vs cityShift 30) — bulut daha yakin oldugu icin parallaks
   buyuktur; oyuncu saga gidince bulut SOLA kayar (round 11 duzeltmesi).
   Cekit: cloud_a..cloud_f havuzundan LCG ile secim; arka arkaya AYNI
   cekit tekrarlanmaz; her dogustaki olcek/alfa farklidir.
   Yerlesim LCG ile DETERMINISTIK: iki kare hizinda birebir ayni konum.     */

/* ---- src/world/CloudLayer.js ---- */
class CloudLayer {
  constructor(assets) {
    this.assets = assets;
    this.clouds = [];           // ekrandaki bulut instanslari
    this.dist = 0;              // toplam kaydirma mesafesi (px)
    this.builtUpTo = -1;        // son uretilen slot
    this.smoothX = 0;           // soneumlu oyuncu x (-1..1)
    this._seedBase = 9173;      // LCG taban tohumu
    this._lastSprite = '';      // arka arkaya ayni cekit yasak
    this._catalog = ['cloud_a', 'cloud_b', 'cloud_c', 'cloud_d', 'cloud_e', 'cloud_f'];
  }
  reset() {
    this.clouds = [];
    this.dist = 0;
    this.builtUpTo = -1;
    this.smoothX = 0;
    this._lastSprite = '';
  }
  update(dt, playerNx) {
    const C = CONFIG.CLOUDS;
    this.dist += C.speed * dt;
    // yatay soneum: kritik sonumlu yaklasim (adim boyutundan bagimsiz)
    const h = 1 - Math.exp(-C.smooth * dt);
    this.smoothX += (playerNx - this.smoothX) * h;
    const H = CONFIG.H;
    const SP = C.spacing;
    const maxSlot = Math.floor((this.dist + H + 200) / SP);
    while (this.builtUpTo < maxSlot) {
      this.builtUpTo++;
      this._spawnAt(this.builtUpTo);
    }
    // ekrandan coktan cikmis bulutu at
    const minY = this.dist - H - 200;
    this.clouds = this.clouds.filter((c) => c.baseY > minY);
  }
  _spawnAt(slot) {
    // LCG: her slot icin deterministik tohum (Math.random YOK)
    let seed = ((slot * 2654435761 + this._seedBase) >>> 0);
    const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const C = CONFIG.CLOUDS;
    const baseY = slot * C.spacing;
    const x = 40 + rnd() * (CONFIG.W - 120);
    // cekit secimi: arka arkaya ayni cekit yasak (LCG ile deterministik)
    let idx = Math.floor(rnd() * this._catalog.length);
    if (this._catalog[idx] === this._lastSprite) {
      idx = (idx + 1 + Math.floor(rnd() * (this._catalog.length - 1))) % this._catalog.length;
    }
    const sprite = this._catalog[idx];
    this._lastSprite = sprite;
    const alpha = C.alphaMin + rnd() * (C.alphaMax - C.alphaMin);
    const scale = C.scaleMin + rnd() * (C.scaleMax - C.scaleMin);   // 0.7..1.3
    const driftPhase = rnd() * Math.PI * 2;
    this.clouds.push({ baseY, x, sprite, alpha, scale, driftPhase });
  }
  /* Test kancasi: yatay parallaks ofseti (px). Oyuncu saga -> NEGATIF (sola). */
  layerOffset() { return -this.smoothX * CONFIG.CLOUDS.hShift; }
  draw(c) {
    const C = CONFIG.CLOUDS;
    const H = CONFIG.H;
    const shift = this.layerOffset();
    for (const cl of this.clouds) {
      const y = cl.baseY - this.dist;
      if (y < -160 || y > H + 160) continue;
      // yatay suruklenme (dist'e bagli — sim adimindan bagimsiz, deterministik)
      const drift = Math.sin(cl.driftPhase + (this.dist / (C.driftPeriod * C.speed)) * Math.PI * 2) * C.driftAmp;
      const s = this.assets.manifest.sprites.find((m) => m.name === cl.sprite);
      const w = (s ? s.width : 200) * cl.scale;
      const h = (s ? s.height : 140) * cl.scale;
      c.save();
      c.globalAlpha = cl.alpha;
      this.assets.draw(c, cl.sprite, cl.x + drift + shift - w / 2, y - h / 2, w, h);
      c.restore();
    }
  }
  /* Test kancasi: su an ekranda olan bulut konumlari (determinizm). */
  onScreenPositions() {
    const H = CONFIG.H;
    const shift = this.layerOffset();
    const out = [];
    for (const cl of this.clouds) {
      const y = cl.baseY - this.dist;
      if (y > -160 && y < H + 160) out.push([Math.round((cl.x + shift) * 100) / 100, Math.round(y * 100) / 100]);
    }
    return out;
  }
  /* Test kancasi: son N dogustaki cekit listesi (cloud_variety).
     Ekran disinda kalanlar da dahil — slot 0'dan builtUpTo'ya tek geciste
     LCG ile yeniden uretir (deterministik, _spawnAt ile birebir ayni siralar). */
  spawnedSprites(n) {
    const out = [];
    let last = '';
    for (let s = 0; s <= this.builtUpTo; s++) {
      let seed = ((s * 2654435761 + this._seedBase) >>> 0);
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      rnd();   // x konumu
      let idx = Math.floor(rnd() * this._catalog.length);
      if (this._catalog[idx] === last) {
        idx = (idx + 1 + Math.floor(rnd() * (this._catalog.length - 1))) % this._catalog.length;
      }
      last = this._catalog[idx];
      out.push(last);
    }
    return out.slice(-n);
  }
}

/* -------------------------------------------------------------------- Bullet
   Oyuncu mermisi (yukari) ve dusman mermisi (asagi) ayni sinifta.
   Trail: son N konum — koyu iz icin. Sıcak dongude array tahsisi yok.     */

/* ---- src/units/Bullet.js ---- */
class Bullet {
  constructor() { this.trailX = new Float32Array(4); this.trailY = new Float32Array(4); this.trailN = 0; this.isEnemy = false; this.reset(0, 0); }
  reset(x, y, isEnemy) {
    this.x = x; this.y = y; this.isEnemy = !!isEnemy;
    const sp = isEnemy ? CONFIG.EBULLET.speed : CONFIG.BULLET.speed;
    this.vx = 0; this.vy = isEnemy ? sp : -sp;
    this.life = isEnemy ? CONFIG.EBULLET.life : CONFIG.BULLET.life;
    this.trailN = 0;
    this.flak = false;   // round 17: ucaksavar mermisi mi (omru bitince havada patlar)
  }
  update(dt) {
    // trail kaydir (en eskiyi at, sondakini yeni konuma yaz)
    for (let i = 0; i < this.trailN - 1; i++) { this.trailX[i] = this.trailX[i+1]; this.trailY[i] = this.trailY[i+1]; }
    this.trailX[this.trailN] = this.x; this.trailY[this.trailN] = this.y;
    if (this.trailN < 3) this.trailN++;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0 || this.y < -20 || this.y > CONFIG.H + 20) this.active = false;
  }
}

/* ------------------------------------------------------- mermi cizimi (r21)
   Bir havuzun TAMAMINI tek gecişte cizer. Cagrilma yeri: Game._drawBullets.
   Donen deger iz uzunlugu (L) — cagiran `this.tracerLen` kancasina yazar.

    Katman sirasi (hepsi renk+alfa kovasina gore gruplu, sicak dongude tahsis
    YOK — eski kodun mermi basina createRadialGradient'i kaldirildi):
      1) koyu kontrast halesi  — KAPSUL: 6 kademe round-cap cizgi (r27)
      2) koyu iz (trail)       — merminin arkasinda kisa sonen hat
      3) yumusak additif parlama + cyan/beyaz cekirdek  ('lighter')
      4) uc parlamasi          — iki additif yay (gradyan yok)

    Neden hale: `foreground_contrast` tepe - medyan olcer; 'lighter' cekirdek
    her zeminde 255'e doyar, yani tepe yukseltilemez. Parlak bulut bandin
    medyanini ~230'a cikarinca fark 25'e duser (beyaz iz beyaz bulutta gercekten
    kaybolur). Siyah + alfa carpimsaldir: koyu sehirde gorunmez, parlak zeminde
    mermiye kendi cercevesini verir ve bandin medyanini asagi ceker. Arka plan
    karartilmaz — hale mermiye aittir ve mermiyle birlikte hareket eder.

    Neden kapsul (Round 27): dikdortgen fillRect'in keskin koseleri vision
    denetiminde u kez "harmanlanmamis siyah dikdortgen" olarak bildirildi.
    Kademeler artik lineCap='round' cizgi — uc formu tracer uzunluguyla
    uyumlu kapsul, yatayda 6 ince kademe kenar bandini eritir. Genislikler
    ve birikimli tepe karanlik (~0.83) eski desenle ayni buyuklukte;
    kapinin 60 esigine ayni marjla hizmet eder.

    Cizim/sim ayrimi: burada sim durumu OKUNUR, hicbiri yazilmaz; carpisma
    dikdortgeni degismez (genislikler CONFIG.BULLET.w'nin katidir).          */
Bullet.drawPool = function (c, pool, isEnemy) {
  const T = CONFIG.FX.tracer;
  const H = CONFIG.BULLET.halo;
  const L = T.len, half = L * 0.5;
  const bw = CONFIG.BULLET.w;          // tek boyut kaynagi (carpisma ile ayni)
  const TAU = Math.PI * 2;
  const tipDy = isEnemy ? half : -half;   // iz ucu: dusman asagi, oyuncu yukari
  const outer = isEnemy ? 'rgba(255,100,40,0.85)' : 'rgba(90,230,255,0.85)';
  const inner = isEnemy ? 'rgba(255,220,180,0.95)' : 'rgba(255,255,255,0.95)';
  c.save();
  // --- 1) KOYU KONTRAST HALESI (source-over siyah = carpim)
  // Kapsul: her kademe round-cap cizgi, kademe basina tek stroke (gruplu).
  // Ucler yuvarlanir, yataydaki 6 ince alfa kademesi kenar bantlanmasini eritir.
  c.lineCap = 'round';
  c.strokeStyle = '#000';
  for (let i = 0; i < H.widths.length; i++) {
    c.globalAlpha = H.alphas[i];
    c.lineWidth = bw * H.widths[i];
    c.beginPath();
    pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
    c.stroke();
  }
  // --- 2) KOYU IZ: merminin arkasinda hizla sonen kisa hat
  c.lineCap = 'round';
  c.globalAlpha = 0.28;
  c.strokeStyle = '#000';
  c.lineWidth = bw * 0.7;
  c.beginPath();
  pool.forEach((b) => {
    if (b.trailN >= 2) { c.moveTo(b.trailX[0], b.trailY[0]); c.lineTo(b.x, b.y); }
  });
  c.stroke();
  // --- 3) PARLAK CEKIRDEK (lighter)
  c.globalCompositeOperation = 'lighter';
  // yumusak parlama: dar tutulur, yoksa bandin medyanini kendisi yukseltir
  c.globalAlpha = T.glowA;
  c.strokeStyle = outer;
  c.lineWidth = bw * T.glowW;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  c.globalAlpha = 1;
  c.strokeStyle = outer;
  c.lineWidth = bw * 0.7;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  c.strokeStyle = inner;
  c.lineWidth = bw / 3;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  // --- 4) UC PARLAMASI: iki additif yay (mermi basina gradyan YOK)
  c.globalAlpha = T.tipA;
  c.fillStyle = outer;
  c.beginPath();
  pool.forEach((b) => {
    const y = b.y + tipDy;
    c.moveTo(b.x + T.tipR, y); c.arc(b.x, y, T.tipR, 0, TAU);
  });
  c.fill();
  c.globalAlpha = 0.9;
  c.fillStyle = inner;
  const rIn = T.tipR * 0.45;
  c.beginPath();
  pool.forEach((b) => {
    const y = b.y + tipDy;
    c.moveTo(b.x + rIn, y); c.arc(b.x, y, rIn, 0, TAU);
  });
  c.fill();
  c.restore();
  return L;
};

/* --------------------------------------------------------------------- Rocket
   Round 12: kazanilabilir ek silah. Normal atisa EK olarak hafif gaitli.
   Hedef secimi deterministik: "en yakin aktif dusman, esitlikte en kucuk
   havuz indeksi". Donus hizi <= 180 deg/s. Isabette hasar 3.               */

/* ---- src/units/Rocket.js ---- */
class Rocket {
  constructor() { this.active = false; }
  reset(x, y, target) {
    this.x = x; this.y = y;
    this.target = target;            // Enemy nesnesi (referans)
    const R = CONFIG.ROCKET;
    this.speed = R.speed;
    // Baslangic acisi: hedefe dogru
    this.angle = Math.atan2(target.y - y, target.x - x);
    this.maxTurn = R.turnRate * Math.PI / 180;   // rad/s
    this.active = true;
  }
  update(dt, game) {
    // Hedef yoksa (oldu/ekrandan cikti) — son bilinen yone devam et
    if (!this.target || !this.target.active) {
      this.x += Math.cos(this.angle) * this.speed * dt;
      this.y += Math.sin(this.angle) * this.speed * dt;
      if (this.y < -40 || this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
      return;
    }
    // Gait: hedefe don (maks turnRate ile sinirli)
    const desired = Math.atan2(this.target.y - this.y, this.target.x - this.x);
    let diff = desired - this.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const maxStep = this.maxTurn * dt;
    if (Math.abs(diff) <= maxStep) this.angle = desired;
    else this.angle += Math.sign(diff) * maxStep;
    // Ilerle
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    if (this.y < -40 || this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
  }
  draw(c, assets) {
    const s = CONFIG.ROCKET.size;
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.angle + Math.PI / 2);   // sprite dikey, ustu yukari
    assets.draw(c, 'rocket', -s * 0.5 / 2, -s / 2, s * 0.5, s);
    c.restore();
  }
}

/* -------------------------------------------------------------------- Enemy
   Uc tip: scout (hizli, ateşsiz), gunner (nişanlı mermi), shield (kalkan).
   Havuzdan beslenir; sıcak döngüde `new` yok. LCG ile deterministik.       */

/* ---- src/units/SubDrone.js ---- */
class SubDrone {
  constructor() { this.active = false; }
  reset(x, y) {
    this.x = x; this.y = y;
    this.fireTimer = 0;
    this.active = true;
  }
  update(dt, game) {
    const S = CONFIG.SUBDRONE;
    const p = game.player;
    /* Yumusak gecikmeyle takip: oyuncunun ±offset px yanina kritik sonumlu
       yaklasim. Hedef konum her adimda hesaplanir, konum ustel sonumle
       hedefe dogru ilerler — ani sikintilar yok. */
    const side = this._side || 1;   // -1 sol, +1 sag
    const tx = p.x + side * S.offset;
    const ty = p.y + 8;             // hafif asagida
    const f = Math.min(1, S.followSmooth * dt);
    this.x += (tx - this.x) * f;
    this.y += (ty - this.y) * f;
    // Ates: oyuncuyla birlikte, hasar 1, aralik fireIntervalMs
    this.fireTimer -= dt;
    if (game.input.firing() && this.fireTimer <= 0) {
      this.fireTimer = S.fireIntervalMs / 1000;
      const b = game.bulletPool.acquire();
      if (b) { b.reset(this.x, this.y - 12); }
    }
  }
  draw(c, assets) {
    const s = CONFIG.SUBDRONE.size;
    c.save();
    c.translate(this.x, this.y);
    assets.draw(c, 'sub_drone', -s / 2, -s / 2, s, s);
    c.restore();
  }
}

/* ---------------------------------------------------------------------- Player
   Oyuncu dronu: hareket, ates, dash, sub-dronlar, isi.                     */

/* ---- src/units/Jammer.js ---- */
class Jammer {
  constructor() { this.active = false; }
  reset(x, y) {
    const J = CONFIG.JAMMER;
    this.x = x; this.y = y;
    this.t = 0;                       // sim saati (s) — salinim + nabiz
    this.inRange = false;             // oyuncu menzil icinde mi (sim durumu)
    this._seed = ((x * 31 + y * 17 + 13) >>> 0);   // LCG tohumu (deterministik)
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  update(dt, game) {
    if (!this.active) return;
    const J = CONFIG.JAMMER;
    this.t += dt;
    /* Yavas inis: hoverY'ye kadar sabit hiz, sonra yatay salinim.
       Ekranin ust yarısında kalmaya calisir (hoverY ~ H*0.30). */
    const entryT = 1.2;   // s — giris inişi suresi
    if (this.t < entryT) {
      this.y = -J.size / 2 + (J.hoverY + J.size / 2) * (this.t / entryT);
      this.x = Math.max(J.swayAmp + 20, Math.min(CONFIG.W - J.swayAmp - 20, this.x));
    } else {
      const ph = ((this.t - entryT) / J.swayPeriod) * Math.PI * 2;
      this.x = CONFIG.W / 2 + Math.sin(ph) * J.swayAmp;
      this.y = J.hoverY;
    }
    /* Jamming menzili: oyuncu radius icindeyse ates araligi yavaslar.
       Bu bir SIM durumudur (inRange) — cizimden bagimsiz. */
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    this.inRange = (dx * dx + dy * dy) <= J.radius * J.radius;
    /* Ekrandan cikarsa devre disi (yukari dogru suruklenirse). */
    if (this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
  }
  draw(c, assets) {
    const J = CONFIG.JAMMER;
    const s = J.size;
    c.save();
    c.translate(this.x, this.y);
    /* Menzil halkasi: soluk, nabiz atan (yalniz cizim — sim'e dokunmaz).
       Nabiz: t'ye bagli sinus ile alfa ve yaricap hafif salinir. */
    const pulse = 0.5 + 0.5 * Math.sin(this.t * J.ringPulse);
    const ringR = J.radius * (0.92 + 0.08 * pulse);
    c.globalAlpha = 0.12 + 0.10 * pulse;
    c.strokeStyle = 'rgba(180,120,255,1)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, ringR, 0, Math.PI * 2); c.stroke();
    /* Icinde hafif dolgu (menzil okunabilir olsun) */
    c.globalAlpha = 0.04 + 0.03 * pulse;
    c.fillStyle = 'rgba(180,120,255,1)';
    c.beginPath(); c.arc(0, 0, ringR, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
    /* Govde sprite'i — once yuklenen gorsel, yoksa prosedurel */
    assets.draw(c, 'drone_jammer', -s / 2, -s / 2, s, s);
    /* Menzil icindeyken kenar isigi parlaklasir (oyuncuyu zayiflatiyor) */
    if (this.inRange) {
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(200,140,255,0.7)';
      c.lineWidth = 2;
      c.shadowColor = 'rgba(200,140,255,0.6)';
      c.shadowBlur = 8;
      c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}
