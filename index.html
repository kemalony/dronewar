/* ---- src/units/Skimmer.js ---- */
/* ----------------------------------------------------------------------- Skimmer
   Round 17: limanin deniz tarafindan gelen dusmani. Diger dusmanlar yukaridan
   iner; skimmer YANDAN girer ve ekrani yatay geçer — liman bolumunun kendi
   silueti. Enemy sinifi sismesin diye ayri sinif.

   Determinizm: Math.random() yok; salinim fazi dt birikimiyle tasinir, dogus
   tarafi/ y konumu game paketindeki LCG'den gelir.
   Sprite: mevcut `drone_scout` kullanilir (yeni varlik uretilmedi) — yatay
   giden govde, yon bayragina gore aynalanir.                                */
class Skimmer {
  constructor() { this.active = false; }
  reset(dir, y) {
    const S = CONFIG.SKIMMER;
    this.dir = dir;                       // -1: sagdan sola, +1: soldan saga
    this.baseY = y;
    this.y = y;
    this.x = dir > 0 ? -S.w : CONFIG.W + S.w;
    this.hp = S.hp;
    this.score = S.score;
    this.radius = S.radius;
    this.phase = 0;                       // salinim fazi (s) — dt birikimi
    this.fired = false;                   // bandda BIR KEZ ates acar
    this.burstLeft = 0;
    this.gapT = 0;
    this.hitFlash = 0;
    this.active = true;
  }
  update(dt, game) {
    if (!this.active) return;
    const S = CONFIG.SKIMMER;
    this.x += this.dir * S.speed * dt;
    this.phase += dt;
    this.y = this.baseY + Math.sin(this.phase * S.waveHz * Math.PI * 2) * S.waveAmp;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    /* Oyuncunun yatay bandina girince BIR KEZ uclu seri: kacis bosluğu kalsin
       diye yon seri basinda sabitlenir (AA ile ayni tasarim). */
    const p = game.player;
    if (!this.fired && p && Math.abs(p.y - this.y) < S.bandY) {
      this.fired = true;
      this.burstLeft = S.burst;
      this.gapT = 0;
    }
    if (this.burstLeft > 0) {
      this.gapT -= dt;
      if (this.gapT <= 0) {
        const dx = p ? p.x - this.x : 0, dy = p ? p.y - this.y : 1;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const b = game.ebulletPool.acquire();
        if (b) {
          b.reset(this.x, this.y, true);
          b.vx = (dx / d) * S.bulletSpeed;
          b.vy = (dy / d) * S.bulletSpeed;
          b.life = 4.0;
        }
        game.sound.enemyShot();
        this.burstLeft--;
        this.gapT = S.burstGapMs / 1000;
      }
    }
    // karsi kenardan cikinca havuza iade
    if (this.dir > 0 ? this.x > CONFIG.W + S.w : this.x < -S.w) this.active = false;
  }
  hit(dmg) {
    if (!this.active) return false;
    this.hp -= dmg;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    if (this.hp <= 0) { this.active = false; return true; }
    return false;
  }
  draw(c, assets) {
    if (!this.active) return;
    const S = CONFIG.SKIMMER;
    c.save();
    c.translate(this.x, this.y);
    /* Yumuşak koyu hale — hafifletilmiş sürüm (CONFIG.ENEMY.haloLight).
       Liman sahnesinde suüstü gemileriyle ton çakışmasını keser; dairesel
       simetrik olduğu için rotasyondan BAĞIMSIZ, transform öncesi çizilir.
       Yalnızca çizim — sim/hitbox etkisi yok. */
    const HAL = CONFIG.ENEMY.haloLight;
    const haloR = Math.max(S.w, S.h) * HAL.radiusMul;
    const halo = c.createRadialGradient(0, 0, Math.max(S.w, S.h) * HAL.innerMul, 0, 0, haloR);
    for (let i = 0; i < HAL.pos.length; i++) halo.addColorStop(HAL.pos[i], HAL.col[i]);
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, haloR, 0, Math.PI * 2); c.fill();
    /* Yatay ucus: govde gidis yonune 90° cevrilir, yon bayragina gore aynalanir. */
    c.rotate(this.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    const w = S.h, h = S.w;            // dondurulmus cerceve
    if (assets.has('drone_scout')) {
      assets.draw(c, 'drone_scout', -w / 2, -h / 2, w, h);
    } else {
      c.fillStyle = '#7a5a8c';
      c.fillRect(-w * 0.3, -h * 0.42, w * 0.6, h * 0.84);
      c.fillStyle = '#d8e6ff';
      c.fillRect(-w * 0.12, -h * 0.5, w * 0.24, h * 0.2);
    }
    if (this.hitFlash > 0) {
      c.globalAlpha = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalCompositeOperation = 'lighter';
      const wt = assets.whiteTint('drone_scout');
      if (wt) c.drawImage(wt, -w / 2, -h / 2, w, h);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
  state() { return { x: this.x, y: this.y, dir: this.dir, hp: this.hp }; }
}

/* ---- src/units/GroundUnit.js ---- */
/* --------------------------------------------------------------------- GroundUnit
   Round 16: kara hedefleri (liman bolumu). YALNIZCA ground:true olan bolumde
   dogar; dogurmayi game paketi yapar, bu sinif davranisi yazar.

   Bir numarali kural — zemine civili olma:
     Alanlar `x` (ekran x) + `y0`/`spawnDist` (dogus anindaki ekran y ve
     city.dist). Ekran y'si HER KAREDE zemin kaymasindan türetilir:
       screenY = y0 + (city.dist - spawnDist)
     Kendi vy'si YOKTUR; y0/spawnDist sim icinde asla degismez. Boylece bir
     sim adiminda ΔscreenY tam olarak Δcity.dist kadardir — zeminle birebir
     ayni hizda kayar, "ucan bina" olmaz.                                  */
class GroundUnit {
  constructor() { this.active = false; }
  reset(type, x, y0, spawnDist) {
    const G = CONFIG.GROUND;
    const T = G.types[type];
    this.type = type;
    this.sprite = T.sprite;
    this.w = T.w; this.h = T.h;
    this.x = x;                       // ekran x (sim sabiti)
    this.y0 = y0;                     // dogus anindaki ekran y (ekranin ustunde)
    this.spawnDist = spawnDist;       // dogus anindaki city.dist
    this.hp = T.hp;
    this.score = T.score;
    this.hitFlash = 0;                // beyaz tint parlamasi kalan sure (s)
    /* aa tipi: nişanlı seri atis zamanlayicilari (dt birikimi, deterministik) */
    this.fireT = T.fireMs ? T.fireMs / 1000 : Infinity;
    this.burstLeft = 0;               // devam eden seride kalan mermi sayisi
    this.gapT = 0;                    // mermiler arasi gecikme sayaci (s)
    this._aimDX = 0; this._aimDY = 1; // seri baslangicindaki oyuncu yonu (seri boyunca sabit)
    this.inRange = false;             // jammer: oyuncu radius icinde mi (her adimda yeniden)
    this.active = true;
  }
  /* Ekran y konumu — zemin kaymasindan türetilir (cizim VE sim menzili icin). */
  screenY(city) { return this.y0 + (city.dist - this.spawnDist); }
  update(dt, game) {
    if (!this.active) return;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const G = CONFIG.GROUND;
    const p = game.player;
    const sy = this.screenY(game.city);
    switch (this.type) {
      case 'radar':
        /* Pasif — oyunun enemyFireMul etkiyi uygulamasini bekler; burada
           sadece alive bayragi dogru tutulur (hit() ile). */
        break;
      case 'aa':
        /* Nişanlı seri: oyuncu range icindeyse fireMs'de bir burst adet mermi,
           aralarinda burstGapMs. Seri boyunca yon GÜNCELLENMEZ (kacis boslugu). */
        const A = G.types.aa;
        if (this.burstLeft > 0) {
          this.gapT -= dt;
          if (this.gapT <= 0) {
            this.burstLeft--;
            this.gapT = A.burstGapMs / 1000;
            const b = game.ebulletPool.acquire();
            if (b) {
              b.reset(this.x, sy + this.h * 0.35, true);
              b.vx = this._aimDX * A.bulletSpeed;
              b.vy = this._aimDY * A.bulletSpeed;
              /* Round 17: omur mesafeye gore — mermi hedefin onunde havada
                 patlar. Sabit 4 sn ile mermi ekrandan cikiyordu ve flak hic
                 gorunmuyordu (olculdu: 0 kivilcim). */
              const pd = Math.sqrt((game.player.x - this.x) * (game.player.x - this.x) +
                                   (game.player.y - sy) * (game.player.y - sy));
              b.life = Math.max(A.flakMinS,
                       Math.min(A.flakMaxS, (pd / A.bulletSpeed) * A.flakLead));
              b.flak = true;    // omru bitince havada patlar (round 17)
            }
            game.sound.enemyShot();
          }
        } else {
          this.fireT -= dt;
          if (this.fireT <= 0) {
            const dx = p.x - this.x, dy = p.y - sy;
            const d2 = dx * dx + dy * dy;
            if (d2 <= A.range * A.range && sy > -20 && sy < CONFIG.H + 20) {
              const d = Math.sqrt(d2) || 1;
              this._aimDX = dx / d; this._aimDY = dy / d;
              this.burstLeft = A.burst;
              this.gapT = 0;          // ilk mermi hemen
              this.fireT = A.fireMs / 1000;
            } else {
              this.fireT = 100;       // menzil disinda: 100ms sonra tekrar dene
            }
          }
        }
        break;
      case 'jammer':
        /* Hava Jammer'in inRange mantiginin aynisi — her sim adiminda yeniden
           hesaplanir (Round 15'te unutulmustu, tekrarlama). Oyuncunun birincil
           ates araligini fireSlowMul ile yavaslatma etkiyi game uygular. */
        const J = G.types.jammer;
        const jdx = p.x - this.x, jdy = p.y - sy;
        this.inRange = (jdx * jdx + jdy * jdy) <= J.radius * J.radius;
        break;
    }
    /* Ekrandan cikinca devre disi: zemin asagi kaydigi icin hedef de asagi iner;
       ekran altinin belirgin sekilde altina gecince havuza geri verilir. */
    if (sy > CONFIG.H + 80) this.active = false;
  }
  /* Hasar: hp düser; 0'da alive=false, active=false, true döner (game patlama
     + skoru isler). Oyuncu govdesi kara hedefine carpMAZ — carpisma hasari yok. */
  hit(dmg) {
    if (!this.active) return false;
    this.hp -= dmg;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    if (this.hp <= 0) { this.active = false; return true; }
    return false;
  }
  /* Test kancasi: state() — pozisyon hem dünya (worldY) hem ekran (screenY) uzayında. */
  state(city) {
    return {
      type: this.type,
      x: this.x,
      worldY: this.y0 + (city.dist - this.spawnDist),
      screenY: this.screenY(city),
      hp: this.hp,
      alive: this.active,
    };
  }
  draw(c, assets, city) {
    if (!this.active) return;
    const G = CONFIG.GROUND;
    const sy = this.screenY(city);
    const w = this.w, h = this.h;
    c.save();
    c.translate(this.x, sy);
    /* 1) Sert temas gölgesi: sprite silueti DEGIL — basit koyu elips,
       shadowDx/shadowDy kadar kaydirilmis. Gölgeler zeminde kalir; sprite
       onlarin uzerinden geçer gibi durur. */
    c.globalAlpha = G.shadowAlpha;
    c.fillStyle = '#000';
    c.beginPath();
    /* Golge TABANDA durur ve silüetin disina tasar; sprite'in altinda
       kalirsa temas hissi hic olusmaz (olculdu: tasma +0 px). */
    c.ellipse(G.shadowDx, h * 0.34 + G.shadowDy, w * 0.48, h * 0.17, 0, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = 1;
    /* 2) Sprite — manifest çizim boyutunda. Once yuklenen gorsel; PNG YOKSA
       (Assets'e "ground" fallback dali eklenene kadar cizim bozulmasin diye)
       burada koyu gri govde + tip rengi ile prosedurel yedek. */
    if (assets.has(this.sprite)) {
      assets.draw(c, this.sprite, -w / 2, -h / 2, w, h);
    } else {
      const col = this.type === 'radar' ? '#4a7fb5' :
                  this.type === 'aa'    ? '#b5651d' : '#8a4ab5';
      c.fillStyle = '#3a4048';
      c.fillRect(-w * 0.38, -h * 0.42, w * 0.76, h * 0.84);
      c.fillStyle = col;
      if (this.type === 'radar') {
        c.beginPath(); c.arc(0, -h * 0.18, w * 0.22, Math.PI, 0); c.fill();
      } else if (this.type === 'aa') {
        c.fillRect(-w * 0.08, -h * 0.55, w * 0.16, h * 0.3);
      } else {
        c.beginPath(); c.arc(0, -h * 0.15, w * 0.18, 0, Math.PI * 2); c.fill();
      }
    }
    /* 3) Vuruş parlaması: Assets.whiteTint yolu (source-atop + fillRect ASLA
       kullanilmiyor — tuval geneline calisir). */
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const wt = assets.whiteTint(this.sprite);
      if (wt) c.drawImage(wt, -w / 2, -h / 2, w, h);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* ---- src/units/Carrier.js ---- */
class Carrier {
  constructor() { this.active = false; }
  reset(stageIdx) {
    const C = CONFIG.CARRIER;
    this.stageIdx = stageIdx;
    this.x = CONFIG.W / 2;
    this.y = -100;                  // üstten girecek
    this.t = 0;                      // sim saati (s) — giriş + salınım
    this.bodyHp = C.bodyHp;
    this.maxBodyHp = C.bodyHp;
    this.hitFlash = 0;               // gövde vuruş parlaması kalan süre (s)
    /* Parçalar: her biri kendi can'ı, sprite'ı ve konum ofsetiyle.
       Sıra: pylonL, pylonR -> bay -> antenna -> body. */
    this.parts = {};
    for (const id of ['pylonL', 'pylonR', 'bay', 'antenna']) {
      const P = C.parts[id];
      this.parts[id] = { hp: P.hp, maxHp: P.hp, alive: true, hitFlash: 0 };
    }
    /* Atış zamanlayıcıları (sim zamanına bağlı — performance.now YOK) */
    this.pylonFireT = C.pylonFireMs / 1000;
    this.bayLaunchT = C.bayLaunchMs / 1000;
    this._seed = (1000 + stageIdx * 7919) >>> 0;   // LCG tohumu
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  /* Gövde ancak anten düştükten sonra hasar alır. */
  get bodyVulnerable() { return !this.parts.antenna.alive; }
  /* state().carrier için: { parts: {id: hp}, bodyVulnerable } */
  state() {
    const parts = {};
    for (const id in this.parts) parts[id] = this.parts[id].hp;
    return { parts, bodyVulnerable: this.bodyVulnerable };
  }
  update(dt, game) {
    if (!this.active) return;
    const C = CONFIG.CARRIER;
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    /* Giriş inişi: üstten hoverY'ye sabit hız */
    const entryT = C.entryMs / 1000;
    if (this.t < entryT) {
      this.y = -100 + (C.hoverY + 100) * (this.t / entryT);
      this.x = CONFIG.W / 2;
      return;
    }
    /* Salınım: y=hoverY'de sabit, x = merkez ± swayAmp */
    const ph = ((this.t - entryT) / C.swayPeriod) * Math.PI * 2;
    this.x = CONFIG.W / 2 + Math.sin(ph) * C.swayAmp;
    this.y = C.hoverY;
    /* --- Parça saldırıları (yalnızca canlı parçalar ateş eder) --- */
    const p = game.player;
    /* Pilon top ateşi: nişanlı 3'lü yelpaze (her iki pilon ayrı zamanlayıcıda) */
    if (this.parts.pylonL.alive || this.parts.pylonR.alive) {
      this.pylonFireT -= dt;
      if (this.pylonFireT <= 0) {
        this.pylonFireT = C.pylonFireMs / 1000;
        this._firePylons(game, p);
      }
    }
    /* Kargo kapağı: düşman dronu fırlatır */
    if (this.parts.bay.alive) {
      this.bayLaunchT -= dt;
      if (this.bayLaunchT <= 0) {
        this.bayLaunchT = C.bayLaunchMs / 1000;
        this._launchDrone(game);
      }
    }
    /* Anten jammer alanı: oyuncu menzildeyken atış aralığı yavaşlar.
       Bu bir SIM etkisidir — Player.update fireTimer hesaplamasında okunur. */
    const dx = p.x - this.x, dy = p.y - this.y;
    this.inJamRange = this.parts.antenna.alive &&
      (dx * dx + dy * dy) <= C.antennaJamRadius * C.antennaJamRadius;
  }
  /* Pilon top ateşi: her canlı pilondan nişanlı 3'lü yelpaze. */
  _firePylons(game, player) {
    const C = CONFIG.CARRIER;
    const off = C.partOffsets;
    for (const id of ['pylonL', 'pylonR']) {
      if (!this.parts[id].alive) continue;
      const px = this.x + off[id].x, py = this.y + off[id].y;
      const dx = player.x - px, dy = player.y - py;
      const base = Math.atan2(dy, dx);
      for (let i = -1; i <= 1; i++) {
        const a = base + i * (18 * Math.PI / 180);
        this._emit(game, px, py + 20, Math.cos(a) * C.bulletSpeed, Math.sin(a) * C.bulletSpeed);
      }
    }
    game.sound.bossShot();
  }
  /* Kargo kapağı: en yakın aktif düşmana doğru düşman dronu fırlatır.
     Havuzdan scout tipi düşman alınır; yoksa ekrandan aşağı mermi. */
  _launchDrone(game) {
    const C = CONFIG.CARRIER;
    const off = C.partOffsets.bay;
    const bx = this.x + off.x, by = this.y + off.y;
    /* Düşman havuzundan scout al (varsa) */
    const pools = [game.scoutPool, game.gunnerPool, game.kamikazePool];
    let launched = false;
    for (const pool of pools) {
      if (pool.count() >= pool.items.length) continue;   // dolu
      const e = pool.acquire();
      if (!e) continue;
      e.reset('scout', bx, by);
      e.speed = 200;   // yavaş iniş
      launched = true;
      break;
    }
    if (!launched) {
      /* Havuz doluysa: aşağıya 3'lü bomba yelpazesi (yedek saldırı) */
      for (let i = -1; i <= 1; i++) {
        this._emit(game, bx, by + 20, i * 80, 220);
      }
    }
    game.sound.enemyShot();
  }
  _emit(game, x, y, vx, vy) {
    const b = game.ebulletPool.acquire();
    if (!b) return;
    b.reset(x, y, true);
    b.vx = vx; b.vy = vy;
  }
  /* Mermi çarpışması: önce parçalara, sonra gövdeye.
     Geri döndürülen değer: 'part' | 'body' | null */
  hitBullet(bx, by, br) {
    const C = CONFIG.CARRIER;
    /* Önce parçaları dene (konuma en yakın olan) */
    let bestPart = null, bestD = Infinity;
    for (const id in this.parts) {
      const part = this.parts[id];
      if (!part.alive) continue;
      const off = C.partOffsets[id];
      const px = this.x + off.x, py = this.y + off.y;
      const P = C.parts[id];
      const hw = P.w / 2 + br, hh = P.h / 2 + br;
      const dx = bx - px, dy = by - py;
      if (Math.abs(dx) <= hw && Math.abs(dy) <= hh) {
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; bestPart = id; }
      }
    }
    if (bestPart) {
      const part = this.parts[bestPart];
      part.hp--;
      part.hitFlash = CONFIG.FX.hitFlashMs / 1000;
      if (part.hp <= 0) {
        part.alive = false;
        /* Düşen parça patlar ve o parçanın saldırısı durur */
        const off = C.partOffsets[bestPart];
        return { type: 'part', id: bestPart, x: this.x + off.x, y: this.y + off.y };
      }
      return { type: 'hit', id: bestPart };
    }
    /* Gövde: yalnızca anten düştükten sonra hasar alır */
    if (this.bodyVulnerable) {
      const rr = 60 + br;   // gövde hitbox yarıçapı
      const dx = bx - this.x, dy = by - this.y;
      if (dx * dx + dy * dy <= rr * rr) {
        this.bodyHp--;
        this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
        if (this.bodyHp <= 0) return { type: 'bodyKilled' };
        return { type: 'bodyHit' };
      }
    }
    return null;
  }
  draw(c, assets) {
    const C = CONFIG.CARRIER;
    c.save();
    c.translate(this.x, this.y);
    /* Gövde: boss_tokyo sprite'ı (ana gövde). Anten düştükten sonra
       hasar görme efekti: hafif titreme (yalnız çizim). */
    const bodyW = 208, bodyH = 176;
    const shake = this.bodyVulnerable ? (this.hitFlash > 0 ? 2 : 0) : 0;
    const sx = shake ? (this._lcg() - 0.5) * 4 : 0;
    const sy = shake ? (this._lcg() - 0.5) * 4 : 0;
    assets.draw(c, 'boss_tokyo', -bodyW / 2 + sx, -bodyH / 2 + sy, bodyW, bodyH);
    /* Gövde vuruş parlaması */
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint('boss_tokyo');
      if (w) c.drawImage(w, -bodyW / 2, -bodyH / 2, bodyW, bodyH);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    /* Parçalar: her biri kendi sprite'ı + konum ofsetiyle */
    for (const id in this.parts) {
      const part = this.parts[id];
      if (!part.alive) continue;
      const off = C.partOffsets[id];
      const P = C.parts[id];
      c.save();
      c.translate(off.x, off.y);
      assets.draw(c, P.sprite, -P.w / 2, -P.h / 2, P.w, P.h);
      /* Parça vuruş parlaması */
      if (part.hitFlash > 0) {
        const a = Math.min(1, part.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
        c.globalAlpha = a;
        c.globalCompositeOperation = 'lighter';
        const w = assets.whiteTint(P.sprite);
        if (w) c.drawImage(w, -P.w / 2, -P.h / 2, P.w, P.h);
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'source-over';
      }
      /* Can göstergesi: ince bar (parça üstünde) */
      const frac = part.hp / part.maxHp;
      if (frac < 1) {
        c.fillStyle = 'rgba(0,0,0,0.5)';
        c.fillRect(-P.w / 2, -P.h / 2 - 8, P.w, 4);
        c.fillStyle = '#ff5540';
        c.fillRect(-P.w / 2, -P.h / 2 - 8, P.w * frac, 4);
      }
      c.restore();
    }
    /* Anten jammer alanı: soluk nabız halkası (yalnız çizim) */
    if (this.parts.antenna.alive) {
      const pulse = 0.5 + 0.5 * Math.sin(this.t * 1.2);
      const r = C.antennaJamRadius * (0.92 + 0.08 * pulse);
      c.globalAlpha = 0.08 + 0.06 * pulse;
      c.strokeStyle = 'rgba(180,120,255,1)';
      c.lineWidth = 2;
      c.beginPath(); c.arc(0, C.partOffsets.antenna.y, r, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    }
    c.restore();
  }
}

/* ---------------------------------------------------------------------- Game
   boot -> menu -> play -> pause -> gameover/victory                        */

/* ---- src/units/Enemy.js ---- */
class Enemy {
  constructor() { this.reset('scout', 0, 0); }
  reset(type, x, y) {
    const E = CONFIG.ENEMIES[type];
    this.type = type;
    this.x = x; this.y = y;
    this.hp = E.hp;
    this.shieldHp = E.shieldHp || 0;
    this.speed = E.speed;
    this.score = E.score;
    this.radius = E.radius;
    this.sprite = E.sprite;
    this.fireTimer = E.fireInterval ? E.fireInterval : Infinity;
    this.hitFlash = 0;              // beyaz tint parlamasi kalan sure (s)
    /* Round 12: yeni tip durum alanlari */
    this.bombT = E.bombMs ? E.bombMs / 1000 : Infinity;   // bomber bomba sayaci (s)
    this.locked = false;             // kamikaze: kilitlendi mi
    this.lockX = x;                  // kamikaze: kilitleme anindaki oyuncu x
    this.sniperT = E.fireMs ? E.fireMs / 1000 : Infinity; // sniper atis sayaci (s)
    this.telegraphing = false;       // sniper: nişan cizgisi gorunuyor mu
    this.telegraphX = 0;             // sniper: nişan hedefi x (test kancasi)
    this._seed = (x * 31 + y * 17 + 7) >>> 0;  // LCG tohumu (deterministik)
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  update(dt, game) {
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const p = game.player;
    switch (this.type) {
      case 'scout':
      case 'shield':
        this.y += this.speed * dt;
        break;
      case 'gunner':
        this.y += this.speed * dt;
        this.fireTimer -= dt;
        if (this.fireTimer <= 0 && this.y > 40 && this.y < CONFIG.H * 0.7) {
          const st = CONFIG.STAGES[game.stageIdx];
          this.fireTimer = st.gunnerFireMs / 1000;
          const b = game.ebulletPool.acquire();
          if (b) {
            const dx = p.x - this.x, dy = p.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            const sp = st.ebulletSpeed;
            b.reset(this.x, this.y + 20, true);
            b.vx = (dx / d) * sp;
            b.vy = (dy / d) * sp;
            game.sound.enemyShot();
          }
        }
        break;
      case 'bomber':
        // Yavas inis + 1800ms'de bir asagi dogru 3'lü bomba yelpazesi
        this.y += this.speed * dt;
        this.bombT -= dt;
        if (this.bombT <= 0 && this.y > 40 && this.y < CONFIG.H * 0.75) {
          this.bombT = CONFIG.ENEMIES.bomber.bombMs / 1000;
          for (let i = -1; i <= 1; i++) {
            const b = game.ebulletPool.acquire();
            if (b) {
              b.reset(this.x, this.y + 20, true);
              b.vx = i * 70;                 // hafif yatay yelpaze
              b.vy = 200;                     // mermiden yavas (200 px/s)
              b.life = 4.0;
            }
          }
          game.sound.enemyShot();
        }
        break;
      case 'kamikaze':
        if (!this.locked) {
          // Zikzak iniş: sinüs ile yatay salınım + sabit dikey hız
          this.y += this.speed * dt;
          this.x += Math.sin(this.y * 0.04) * 120 * dt;
          // Oyuncunun o anki x'ine KİLİTLEN (ekranın üst üçte birinde)
          if (this.y >= CONFIG.H / 3) {
            this.locked = true;
            this.lockX = p.x;
          }
        } else {
          // Kilitleme: lockX'e hizlanarak dal (260 -> 520 px/s)
          const targetY = p.y;
          const dx = this.lockX - this.x;
          const dy = targetY - this.y;
          const d = Math.hypot(dx, dy) || 1;
          const sp = CONFIG.ENEMIES.kamikaze.lockSpeed;
          this.x += (dx / d) * sp * dt;
          this.y += (dy / d) * sp * dt;
        }
        break;
      case 'sniper':
        // Ekranın üst üçte birinde durur, telegraflı atış
        if (this.y < CONFIG.H * 0.33) {
          this.y += 120 * dt;   // hiza ulaşana kadar in
        } else {
          this.sniperT -= dt;
          if (this.sniperT <= 0) {
            // Atış döngüsü: önce 600ms telegraf, sonra hızlı tek mermi
            if (!this.telegraphing) {
              this.telegraphing = true;
              this.telegraphX = p.x;   // oyuncunun o anki x'i
              this.sniperT = CONFIG.ENEMIES.sniper.telegraphMs / 1000;
            } else {
              this.telegraphing = false;
              this.sniperT = CONFIG.ENEMIES.sniper.fireMs / 1000;
              const b = game.ebulletPool.acquire();
              if (b) {
                const sp = CONFIG.ENEMIES.sniper.bulletSpeed;
                b.reset(this.x, this.y + 20, true);
                b.vx = 0;
                b.vy = sp;   // asagi dogru hizli tek mermi
                b.life = 2.0;
              }
              game.sound.enemyShot();
            }
          }
        }
        break;
    }
    if (this.y > CONFIG.H + 60) { this.active = false; return; }
  }
  hit() {
    if (this.shieldHp > 0) { this.shieldHp--; return false; }
    this.hp--;
    return this.hp <= 0;
  }
  draw(c, assets) {
    const s = this.radius * 2;
    c.save();
    c.translate(this.x, this.y);
    // --- yumuşak koyu hale (yalnızca çizim; sim'e dokunmaz). Oyuncu halesi
    //     deseni (Player.js): radyal gradeyan, rgba kademeleri config'ten.
    //     Neden: yeşil scout / cyan tonlu tipler parlak şehir karosu ve liman
    //     suyu üstünde kaynaşıyordu (mimo: _gnd_a ve shot_2, öncelik 4).
    //     Hale sprite'ın TAŞINA kadar geniş ve yumuşak kenarlı — "gövde
    //     çevresinde daire" hissi vermez. Kenar ışığı ayrıcadır (aşağıda).
    const HAL = CONFIG.ENEMY.halo;
    const haloR = s * HAL.radiusMul;
    const halo = c.createRadialGradient(0, 0, s * HAL.innerMul, 0, 0, haloR);
    for (let i = 0; i < HAL.pos.length; i++) halo.addColorStop(HAL.pos[i], HAL.col[i]);
    c.fillStyle = halo;
    c.beginPath(); c.arc(0, 0, haloR, 0, Math.PI * 2); c.fill();
    // --- gövde sprite'i
    assets.draw(c, this.sprite, -s/2, -s/2, s, s);
    // --- tip ayrimi: kenar isigi (halenin ustune additive vurur; oyuncudaki
    //     cyan kenar isigi deseninin dusman renkli karsiligi)
    c.globalCompositeOperation = 'lighter';
    if (this.type === 'scout') {
      // soğuk gri govde uzerine ince KIRMIZI kenar isigi
      c.strokeStyle = 'rgba(255,70,60,0.85)';
      c.lineWidth = 1.5;
      c.shadowColor = 'rgba(255,70,60,0.7)';
      c.shadowBlur = 5;
      c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI * 2); c.stroke();
    } else if (this.type === 'gunner') {
      // TURUNCU kenar isigi + altta namlu parlamasi
      c.strokeStyle = 'rgba(255,150,40,0.9)';
      c.lineWidth = 2;
      c.shadowColor = 'rgba(255,150,40,0.8)';
      c.shadowBlur = 6;
      c.beginPath(); c.arc(0, 0, s * 0.44, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 0;
      const mg = c.createRadialGradient(0, s * 0.32, 0, 0, s * 0.32, s * 0.2);
      mg.addColorStop(0, 'rgba(255,190,90,0.9)');
      mg.addColorStop(0.5, 'rgba(255,120,30,0.4)');
      mg.addColorStop(1, 'rgba(255,120,30,0)');
      c.fillStyle = mg;
      c.beginPath(); c.arc(0, s * 0.32, s * 0.2, 0, Math.PI * 2); c.fill();
    }
    // shield: kalkan varken MAVI KABARCIK (kalkan kirilincada soner)
    if (this.type === 'shield' && this.shieldHp > 0) {
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(90,170,255,0.7)';
      c.lineWidth = 2;
      c.beginPath(); c.arc(0, 0, s * 0.55, 0, Math.PI * 2); c.stroke();
      c.fillStyle = 'rgba(90,170,255,0.08)';
      c.fill();
    }
    // Round 12: bomber — altta bomba hazirligi parlamasi (turuncu)
    if (this.type === 'bomber') {
      c.shadowBlur = 0;
      const mg = c.createRadialGradient(0, s * 0.35, 0, 0, s * 0.35, s * 0.22);
      mg.addColorStop(0, 'rgba(255,160,40,0.85)');
      mg.addColorStop(1, 'rgba(255,100,20,0)');
      c.fillStyle = mg;
      c.beginPath(); c.arc(0, s * 0.35, s * 0.22, 0, Math.PI * 2); c.fill();
    }
    // Round 12: kamikaze — kilitlendiginde kisa KIRMIZI uyarı çizgisi (oyuncuya)
    if (this.type === 'kamikaze' && this.locked) {
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,60,40,0.55)';
      c.lineWidth = 1.5;
      c.setLineDash([6, 6]);
      c.beginPath();
      c.moveTo(0, s * 0.3);
      c.lineTo(this.lockX - this.x, CONFIG.H - this.y);
      c.stroke();
      c.setLineDash([]);
      c.globalCompositeOperation = 'source-over';
    }
    // Round 12: sniper — telegraf sirasinda ince KIRMIZI nişan çizgisi
    if (this.type === 'sniper' && this.telegraphing) {
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,50,40,0.7)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, s * 0.3);
      c.lineTo(this.telegraphX - this.x, CONFIG.H - this.y);   // ekranin altina
      c.stroke();
      c.globalCompositeOperation = 'source-over';
    }
    c.shadowBlur = 0;
    c.globalCompositeOperation = 'source-over';
    // --- vurus parlamasi: onceden beyaz tint'lenmis kopya, ~90ms, alfa ile soner
    //     (source-atop + fillRect KULLANILMAZ — tuval geneline calisir)
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint(this.sprite);
      if (w) c.drawImage(w, -s/2, -s/2, s, s);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* --------------------------------------------------------------------- Boss
   Bölüm sonu boss'u (round 8). Tek slot, önceden ayrılmış; Math.random YOK —
   tüm rastgelelik LCG'den. Desenler bölüm bazlı ve birikimli:
     1: nişanlı 3'lü yelpaze | 2: + 12'li dairesel patlama
     3: + iki taraftan çapraz tarama | 4: üçü birden, aralıklar %20 kısa
   Girişte 1500 ms kapalı formda iniş, sonra y=150'de 70 px / 3 s salınım.    */

/* ---- src/units/Boss.js ---- */
class Boss {
  constructor() { this.active = false; }
  reset(stageIdx) {
    const B = CONFIG.BOSS;
    this.stageIdx = stageIdx;
    this.maxHp = B.hp[stageIdx];
    this.sprite = B.sprite[stageIdx];   // bolum bazli boss sprite'i (round 11)
    this.hp = this.maxHp;
    this.x = CONFIG.W / 2;
    this.y = -B.size / 2;        // üstten girecek
    this.t = 0;                  // giriş + salınım saati (s)
    this.phase = 1;              // can eşiğine göre 1..4
    this.hitFlash = 0;           // beyaz tint parlaması kalan süre (s)
    this.fanT = 0; this.ringT = 0; this.sweepT = 0;
    this._seed = (1000 + stageIdx * 7919) >>> 0;
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  /* Can eşiği fazı: hp/maxHp >= .75 -> 1, >= .5 -> 2, >= .25 -> 3, aksi 4. */
  _updatePhase() {
    const r = this.hp / this.maxHp;
    this.phase = r >= 0.75 ? 1 : r >= 0.5 ? 2 : r >= 0.25 ? 3 : 4;
  }
  update(dt, game) {
    if (!this.active) return;
    const B = CONFIG.BOSS;
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const entryT = B.entryMs / 1000;
    if (this.t < entryT) {
      // kapalı formda iniş: üstten hoverY'ye doğru sabit hız
      this.y = -B.size / 2 + (B.hoverY + B.size / 2) * (this.t / entryT);
      this.x = CONFIG.W / 2;
      return;
    }
    // salınım: y=hoverY'de sabit, x = merkez ± swayAmp, periyot swayPeriod
    const ph = ((this.t - entryT) / B.swayPeriod) * Math.PI * 2;
    this.x = CONFIG.W / 2 + Math.sin(ph) * B.swayAmp;
    this.y = B.hoverY;
    // --- desen zamanlayıcıları (yalnizca aktif fazdaki desenler ates eder)
    const st = this.stageIdx;
    const fanMs = B.fanMs[st], ringMs = B.ringMs[st], sweepMs = B.sweepMs[st];
    if (this.phase >= 1 && fanMs > 0) {
      this.fanT -= dt * 1000;
      if (this.fanT <= 0) { this.fanT = fanMs; this._fireFan(game); }
    }
    if (this.phase >= 2 && ringMs > 0) {
      this.ringT -= dt * 1000;
      if (this.ringT <= 0) { this.ringT = ringMs; this._fireRing(game); }
    }
    if (this.phase >= 3 && sweepMs > 0) {
      this.sweepT -= dt * 1000;
      if (this.sweepT <= 0) { this.sweepT = sweepMs; this._fireSweep(game); }
    }
  }
  /* Nişanlı 3'lü yelpaze: oyuncuya bakan merkezi açı ± 18°. */
  _fireFan(game) {
    const B = CONFIG.BOSS;
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    const base = Math.atan2(dy, dx);
    for (let i = -1; i <= 1; i++) {
      const a = base + i * (18 * Math.PI / 180);
      this._emit(game, this.x, this.y + 40, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
    }
  }
  /* 12'li dairesel patlama: tam turda eşit açılar, hafif LCG kayması. */
  _fireRing(game) {
    const B = CONFIG.BOSS;
    const off = this._lcg() * Math.PI * 2;
    for (let i = 0; i < 12; i++) {
      const a = off + (i / 12) * Math.PI * 2;
      this._emit(game, this.x, this.y + 20, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
    }
  }
  /* İki taraftan çapraz tarama: soldan ve sağdan aşağı-yoğun 3'er mermi. */
  _fireSweep(game) {
    const B = CONFIG.BOSS;
    const jx = (this._lcg() - 0.5) * 0.3;   // hafif LCG sapması
    for (const side of [-1, 1]) {
      const ox = this.x + side * 60;
      for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 2) + side * (0.28 + i * 0.16) + jx;
        this._emit(game, ox, this.y + 30, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
      }
    }
  }
  _emit(game, x, y, vx, vy) {
    const b = game.ebulletPool.acquire();
    if (!b) return;
    b.reset(x, y, true);
    b.vx = vx; b.vy = vy;
    game.sound.bossShot();
  }
  hit() {
    this.hp--;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    this._updatePhase();
    return this.hp <= 0;
  }
  draw(c, assets) {
    const B = CONFIG.BOSS;
    const s = B.size;
    c.save();
    c.translate(this.x, this.y);
    // gövde sprite'i — bölüm bazlı (round 11), önce yüklenen görsel
    assets.draw(c, this.sprite, -s / 2, -s / 2, s, s);
    // vuruş parlaması: sprite'ın önceden beyaz tint'lenmiş kopyası (~90ms)
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint(this.sprite);
      if (w) c.drawImage(w, -s / 2, -s / 2, s, s);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* -------------------------------------------------------------------- Player
   Helikopter hissi: ivme + ustel sonum (biraz "kayar"). Hitbox ekranda kalir. */

/* ---- src/units/Player.js ---- */
class Player {
  constructor(droneId) {
    // Round 12: dron secimi — CONFIG.DRONES tablosundan ozellikler gelir
    const D = CONFIG.DRONES.find((d) => d.id === (droneId || 'falcon')) || CONFIG.DRONES[0];
    this.droneId = D.id;
    this.sprite = D.sprite;
    this.maxSpeed = D.speed;
    this.x = CONFIG.W / 2; this.y = CONFIG.H * 0.78;
    this.vx = 0; this.vy = 0;
    this.fireTimer = 0; this.muzzle = 0; this.tilt = 0;
    this.lives = D.lives;
    this.invincible = 0;
    this._invincibleMs = D.invincibleMs || CONFIG.INVINCIBLE_MS;   // ghost: 2000ms
    this._hitboxMul = D.hitboxMul || 1;                            // tank: %15 buyuk
    /* acro-dash: sim zamanina bagli, cizimden bagimsiz. Iz noktalari sabit boyutlu
       dizi (sicak dongude new yok); trailLen kadar slot, en eski uzerine yazar. */
    const DASH = CONFIG.PLAYER.DASH;
    this.dashT = 0;            // kalan dash suresi (s)
    this.dashCd = 0;           // kalan cooldown (s)
    this._dashDirX = 0; this._dashDirY = -1;
    this._trail = [];
    for (let i = 0; i < DASH.trailLen; i++) this._trail.push({ x: 0, y: 0, a: 0 });
    /* Isisi sistemi (round 13): dash + roket + sub-launch is harcar.
       BIRINCIL ATIS IS HARCAMAZ. overheatAt'e ulasinca kilit: ates araligi
       overheatFireMul kadar yavaslar, dash kullanilamaz. recoverAt'in altina
       inince normale doner. Tek kaynak: Game._addHeat — Game.state() ve HUD
       game.heat'i okur; Player kendi degiskenini tutarsa iki gorunum ayrisir. */
    /* Sub-dronlar (round 13): 2 mini refakatci, havuzdan beslenir. */
    this.subs = new Pool(CONFIG.SUBDRONE.pool, () => new SubDrone());
    this._subSide = [1, -1];   // sag, sol — her sub-drone bir tarafa bagli
  }
  /* Mikro kacis hamlesi: 180 ms boyunca 3x hiz + dokunulmazlik. Tetikleme girdi
     paketindedir; buradan yalnizca Player tarafini calistirir. */
  /* Havuza bir sub-dron ekler (pu_subdrone alindiginda). Tek giris noktasi:
     game paketi kendi sayacini doldurmak yerine burayi cagirir. */
  addSub() {
    if (this.subs.count() >= CONFIG.SUBDRONE.max) return false;
    const s = this.subs.acquire();
    if (!s) return false;
    s.reset(this.x, this.y);
    s._side = this._subSide[this.subs.count() - 1] || 1;
    s.mode = 'gun';
    return true;
  }
  dash(dirX, dirY, game) {
    const DASH = CONFIG.PLAYER.DASH;
    if (this.dashCd > 0 || game.overheated) return false;
    /* Is harca: dash is maliyeti — tek kaynak Game.heat (state/HUD oradan okur) */
    game._addHeat(CONFIG.HEAT.cost.dash);
    const len = Math.hypot(dirX, dirY);
    if (len === 0) { dirX = 0; dirY = -1; } else { dirX /= len; dirY /= len; }
    this._dashDirX = dirX; this._dashDirY = dirY;
    this.dashT = DASH.ms / 1000;
    this.dashCd = DASH.cooldownMs / 1000;
    return true;
  }
  get dashActive() { return this.dashT > 0; }
  /* Hitbox yaricapi (tank %15 buyuk). */
  hitR() { return CONFIG.PLAYER.half * this._hitboxMul; }
  takeHit() {
    if (this.invincible > 0 || this.dashT > 0) return false;   // dash suresince dokunulmaz
    this.lives--;
    this.invincible = this._invincibleMs / 1000;
    return true;
  }
  /* Sinir kelepcesi: hitbox ekran icinde kalir, temasta o eksenin hizi sifirlanir. */
  _clamp() {
    const h = CONFIG.PLAYER.half;
    if (this.x < h) { this.x = h; if (this.vx < 0) this.vx = 0; }
    else if (this.x > CONFIG.W - h) { this.x = CONFIG.W - h; if (this.vx > 0) this.vx = 0; }
    if (this.y < h) { this.y = h; if (this.vy < 0) this.vy = 0; }
    else if (this.y > CONFIG.H - h) { this.y = CONFIG.H - h; if (this.vy > 0) this.vy = 0; }
  }
  update(dt, input, game) {
    const P = CONFIG.PLAYER;
    let { ax, ay } = input.axis();          // const idi: dokunmatik yol atama
    let hasInput = (ax !== 0 || ay !== 0);  // yapinca TypeError firlatiyordu
    /* Dokunmatik: BIREBIR bagil takip. Parmagin bastigi noktaya ucmak yerine,
       parmagin bastigindan beri kaydigi kadar dron kayar — parmak dronu
       kapatmaz ve nisan almak birebir olur (game/ projesinde dogrulanan tasarim).
       Ivme/atalet devre disi: hedefe hiz sinirli, dogrudan gidilir. */
    if (input.touchDX != null) {
      const tx = Math.max(P.half, Math.min(CONFIG.W - P.half, input.baseX + input.touchDX));
      const ty = Math.max(P.half, Math.min(CONFIG.H - P.half, input.baseY + input.touchDY));
      const dx = tx - this.x, dy = ty - this.y;
      const dist = Math.hypot(dx, dy);
      const step = P.followSpeed * dt;
      if (dist <= step || dist === 0) { this.x = tx; this.y = ty; this.vx = 0; this.vy = 0; }
      else { this.x += dx / dist * step; this.y += dy / dist * step;
             this.vx = dx / dist * P.followSpeed; this.vy = dy / dist * P.followSpeed; }
      this._clamp();
      hasInput = false;          // hareket bu dalda tamamlandi
      ax = 0; ay = 0;
    } else if (hasInput) {
      this.vx += ax * P.accel * dt;
      this.vy += ay * P.accel * dt;
    } else {
      // ustel sonum: yaromuru 0.12 s
      const f = Math.pow(0.5, dt / P.decayHalfLife);
      this.vx *= f; this.vy *= f;
      if (Math.abs(this.vx) < 0.5) this.vx = 0;
      if (Math.abs(this.vy) < 0.5) this.vy = 0;
    }
    /* Dokunmatik dalda konum zaten hesaplandi; ivme/entegrasyon adimlari
       yalnizca klavye yolunda calisir. Ilk denemede bu dal `return` ediyordu ve
       ates kodu hic calismiyordu — klavyeyle atis sayisi 0'a dustu. */
    const touchDriven = (input.touchDX != null);
    /* Dash tetikleme: input.consumeDash() tek seferlik bayragi okur.
       Is soneumu Game._simStep yapar (tek kaynak game.heat). */
    const dashDir = input.consumeDash();
    if (dashDir) this.dash(dashDir.x, dashDir.y, game);
    const DASH = CONFIG.PLAYER.DASH;
    /* acro-dash: sim zamanina bagli 3x hamle. Dash sirasinda normal hareket
       devre disi kalir; iz noktasi her adimda en eski slotun uzerine yazilir. */
    if (this.dashT > 0) {
      const dSp = this.maxSpeed * DASH.speedMul;
      this.vx = this._dashDirX * dSp; this.vy = this._dashDirY * dSp;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const tr = this._trail, n = tr.length, gap = DASH.trailGap;
      for (let i = n - 1; i >= 1; i--) {
        const c = tr[i], p = tr[i - 1];
        c.x = p.x; c.y = p.y; c.a = Math.min(1, p.a + gap / (DASH.ms / 1000));
      }
      tr[0].x = this.x; tr[0].y = this.y; tr[0].a = 1;
      this.dashT -= dt;
      if (this.dashT < 0) this.dashT = 0;
    } else {
      const ms = this.maxSpeed;   // Round 12: dron bazli maks hiz
      if (!touchDriven) {
        // maks hiz
        const sp = Math.hypot(this.vx, this.vy);
        if (sp > ms) { const k = ms / sp; this.vx *= k; this.vy *= k; }
        // entegre
        this.x += this.vx * dt; this.y += this.vy * dt;
      }
    }
    if (this.dashCd > 0) this.dashCd -= dt;
    // dash bitince izi sonumle (cizim tarafinda kullanilir)
    for (const t of this._trail) {
      if (t.a > 0) { t.a -= dt / (DASH.ms / 1000); if (t.a < 0) t.a = 0; }
    }
    // hitbox ekranda kalir, temasta o eksenin hizi sifirlanir
    const h = this.hitR();
    if (this.x < h) { this.x = h; this.vx = 0; }
    if (this.x > CONFIG.W - h) { this.x = CONFIG.W - h; this.vx = 0; }
    if (this.y < h) { this.y = h; this.vy = 0; }
    if (this.y > CONFIG.H - h) { this.y = CONFIG.H - h; this.vy = 0; }
    // hafif yalpa: yatay hiza bagli ±6° (yalniz cizim)
    let targetTilt = Math.max(-1, Math.min(1, this.vx / this.maxSpeed)) * (6 * Math.PI / 180);
    if (this.dashT > 0) {
      /* Dash sirasinda govde 25° yatar (yalniz cizim) — hamle yonune dogru. */
      targetTilt = Math.atan2(this._dashDirY, this._dashDirX) * (25 / 90);   // ±25°
    }
    this.tilt += (targetTilt - this.tilt) * Math.min(1, dt * 12);
    // ates (round 10: uc seviye, PARALEL mermi — round 12: swift %15 kisa aralik)
    // Round 13: overheated iken ates araligi overheatFireMul kadar yavaslar
    this.fireTimer -= dt;
    if (input.firing() && this.fireTimer <= 0) {
      const W = CONFIG.WEAPON;
      const lv = W.levels[game.weaponLevel - 1];
      let interval = lv.interval;
      if (this.droneId === 'swift') interval *= 0.85;   // swift: %15 kisa
      if (game.overheated) interval /= CONFIG.HEAT.overheatFireMul;   // is kilidi
      /* Round 16: jammer (kara veya hava) menzilde -> ates araligi uzar.
         Tek kaynak game.fireSlowMul; Game._computeFireMods her sim adiminda
         hesaplar ve iki jammer ayni anda etkiliyse carpan bir kez uygulanir. */
      if (game.fireSlowMul && game.fireSlowMul < 1) interval /= game.fireSlowMul;
      this.fireTimer = interval;
      this.muzzle = CONFIG.FIRE.muzzleMs / 1000;
      const offsets = lv.count === 1 ? [0] :
                      lv.count === 2 ? [-lv.offset, lv.offset] :
                                        [-lv.offset, 0, lv.offset];
      for (const ox of offsets) {
        const b = game.bulletPool.acquire();
        if (b) { b.reset(this.x + ox, this.y - h); }
      }
      /* Atis sayaci Game'in tek giris noktasindan gecer: hem shotsFired hem
         kosu istatistigi (_stats.shots) orada artar. Burada dogrudan
         `game.shotsFired += ...` yazilirsa istatistik sifir kalir. */
      game.addShots(offsets.length);
      game.sound.playerShot();
    }
    if (this.muzzle > 0) this.muzzle -= dt;
    if (this.invincible > 0) this.invincible -= dt;
    /* Sub-dronlar: takip + ates */
    this.subs.forEach((s) => s.update(dt, game));
  }
  draw(ctx, assets) {
    const P = CONFIG.PLAYER;
    /* acro-dash izi: dash sirasinda ve bitiminden sonra kisa bir sure,
       govdenin arkasinda solan alfa kopyalari (yalniz cizim). */
    for (const t of this._trail) {
      if (t.a <= 0.01) continue;
      ctx.save();
      ctx.globalAlpha = t.a * 0.35;
      ctx.translate(t.x, t.y);
      ctx.rotate(this.tilt);
      const s = P.size * 1.1;
      assets.draw(ctx, this.sprite, -s/2, -s/2, s, s);
      ctx.restore();
    }
    // Round 4: tam cyan cerceg DEGIL — dronun altina yumusak radyal koyu hale
    // (sehir dokusunu bastirip silueti ayirir) + govde kenarina ince cyan
    // kenar isigi. Amaç: dron her zaman okunsun ama sahneye ait gorunsun.
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);
    // dokunulmazlik: yanip sonek (100ms periyot)
    if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) {
      ctx.globalAlpha = 0.3;
    }
    // 1) yumusak radyal koyu hale (alfa <= 0.35, yaricap ~ dron genisligi x 0.8)
    /* Hale guclendirildi: denetim turlarca "dron parlak sehir isiklarinda
       kaynasiyor" dedi ve bu dogruydu — zemin gece sehri oldugu icin bazi
       bolgeler dronun kendisinden parlak. Sehri karartmak yerine (denendi,
       sehir sahnenin yildizi) dronun altindaki koyu zemini buyutup
       koyulastiriyoruz: silüet her zeminde ayrisiyor.                        */
    const haloR = P.size * 1.05;
    const halo = ctx.createRadialGradient(0, 0, P.half * 0.35, 0, 0, haloR);
    halo.addColorStop(0, 'rgba(3,6,12,0.62)');
    halo.addColorStop(0.45, 'rgba(3,6,12,0.42)');
    halo.addColorStop(0.75, 'rgba(3,6,12,0.18)');
    halo.addColorStop(1, 'rgba(3,6,12,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, haloR, 0, Math.PI * 2); ctx.fill();
    // 2) dron sprite'i (%10 buyuk — ekranda belirgin). Round 12: secilen dron
    const s = P.size * 1.1;
    assets.draw(ctx, this.sprite, -s/2, -s/2, s, s);
    // 3) ince cyan kenar isigi (1-2 px, govde kenarina oturan parlaklik)
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(110,235,255,0.95)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(110,235,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 0, this.hitR() * 0.92, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    // namlu alevi (her atista 60ms gorunur, parlak)
    if (this.muzzle > 0) {
      const a = this.muzzle / (CONFIG.FIRE.muzzleMs / 1000);
      ctx.save(); ctx.globalAlpha = a;
      ctx.globalCompositeOperation = 'lighter';
      assets.draw(ctx, 'muzzle_flash', this.x - 24, this.y - P.half - 30, 48, 48);
      ctx.restore();
    }
    /* Sub-dronlar: oyuncunun yaninda cizilir */
    this.subs.forEach((s) => s.draw(ctx, assets));
  }
}

/* ---------------------------------------------------------------------- Game
   boot -> menu -> play -> pause -> gameover/victory                        */

/* ---- src/game/Game.js ---- */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new Renderer(canvas);
    this.assets = new Assets(MANIFEST);
    this.clock = new Clock(CONFIG.SIM_HZ);
    this.input = new Input(this);
    this.bulletPool = new Pool(CONFIG.FIRE.pool, () => new Bullet());
    this.ebulletPool = new Pool(CONFIG.ENEMY_BULLET_POOL, () => new Bullet());
    this.scoutPool = new Pool(16, () => new Enemy());
    this.gunnerPool = new Pool(8, () => new Enemy());
    this.shieldPool = new Pool(8, () => new Enemy());
    /* Round 12: uc yeni dusman tipi — kendi havuzlari (sicak dongude `new` yok) */
    this.bomberPool = new Pool(8, () => new Enemy());
    this.kamikazePool = new Pool(10, () => new Enemy());
    this.sniperPool = new Pool(4, () => new Enemy());
    /* Round 15: jammer dronu — kendi havuzu (CONFIG.JAMMER.pool).
       Ates etmez; menzildeyken oyuncuyu zayiflatir + ambient glitch tetikler. */
    this.jammerPool = new Pool(CONFIG.JAMMER.pool, () => new Jammer());
    /* Round 16: kara hedefleri — YALNIZCA ground:true olan bolumde dogar. */
    this.groundPool = new Pool(CONFIG.GROUND.pool, () => new GroundUnit());
    /* Round 17: skimmer — limanin yandan giren dusmani (units paketi). */
    this.skimmerPool = new Pool(CONFIG.SKIMMER.pool, () => new Skimmer());
    this._skimmerT = 0;          // dogus sayaci (s)
    this._skimSeed = 0;          // skimmer dogusu icin ayri LCG tohumu
    this._groundBuiltUpTo = -1;   // son uretilen slot (slot tabanli LCG)
    this._groundSeed = 42;        // kara hedefi LCG tohumu (deterministik)
    /* Round 12: roket havuzu (kendi havuzu, 8) */
    this.rocketPool = new Pool(CONFIG.ROCKET.pool, () => new Rocket());
    this.player = new Player('falcon');
    this.city = new CityScroller(this.assets);   // sehir paralaks katmani
    this.clouds = new CloudLayer(this.assets);   // bulut katmani (round 10)
    this.fx = new FxSystem();                    // vurus geri bildirimi + zengin patlama (round 10)
    this.sound = new Sound();                    // prosedurel WebAudio (round 9)
    this.state = 'boot';
    this.scrollY = 0;
    this.shotsFired = 0;
    this.score = 0;
    this.hp = 1;               // 0..1 (boss turunde hasarla dolacak)
    this.fps = 0; this.frameMs = 0;
    this._lastTime = 0;
    this._raf = null;
    this._autotest = CONFIG.AUTOTEST;
    // spawn yonetimi (LCG — Math.random YOK)
    this._spawnSeed = 42;
    this._spawnTimer = 0;
    // bölüm ilerlemesi (round 7)
    this.stageIdx = 0;
    this.killsThisStage = 0;
    this.stageTitleT = 0;      // bölüm kartı kalan süre (s) — amblem + ad (round 8)
    this.landmarkTriggered = false;
    // boss döngüsü (round 8): warn -> active -> dying
    this.boss = null;                  // Boss nesnesi (aktifken)
    this.bossState = 'none';           // none | warn | active | dying
    this.bossWarnT = 0;                // DIKKAT uyarısı kalan süre (s)
    this.bossDeathT = 0;               // ölüm patlamaları kalan süre (s)
    this.bossFlashT = 0;               // ekran parlaması kalan süre (s)
    this.bossScored = false;           // skor bir kez eklensin
    /* Round 15: cok asamali tasici boss (bolum 4 / Tokyo). Tek nesne,
       onceden ayrilir — sicak dongude `new` yok. */
    this.carrier = new Carrier();
    this.victoryT = 0;                 // zafer gecikmesi (bölüm 4 boss'u)
    this.playTime = 0;                 // toplam oyun süresi (s) — VICTORY için
    this.simTimeMs = 0;                // toplam sim suresi (ms) — rotor acisi (yalniz cizim)
    this.bestScore = 0;               // yeni rekor vurgusu
    this._newRecord = false;
    /* Round 20: kalici rekor + kosu istatistikleri + ipuclari.
       localStorage erisimi ASLA try/catch disinda degil (file:// / gizli
       sekme exception atabilir) — _loadPersist/_savePersist. */
    this._persistAvailable = false;   // localStorage okunabilir mi
    this._runCount = 0;               // toplam baslatilan kosu (ipucu kapi)
    this._stats = { kills: 0, bestCombo: 0, shots: 0, hits: 0 };
    this._tipT = 0;                   // kalan sure (s): >0 ekranda, <0 bosluk
    this._tipIndex = 0;
    const p = this._loadPersist();
    this.bestScore = p.best;
    this._runCount = p.runs;
    // silah yukseltmesi + poweruplar (round 10)
    this.weaponLevel = 1;             // 1..3
    this.shieldT = 0;                 // kalkan kalan sure (s)
    this.powerups = [];               // ekrandaki powerup nesneleri
    this._puSeed = 7;                 // LCG tohumu (powerup drop/yerlesim)
    /* Round 12: roket + silah sifirlanma yanip sonegi + dron secimi */
    this.rocketT = 0;                 // roket kalan sure (s)
    this.rocketFireT = 0;             // roket atis sayaci (s)
    this.weaponFlashT = 0;            // SİLAH 1 yanip sonek kalan sure (s)
    this.selectedDrone = 'falcon';    // secili dron id
    this.shipSelectIdx = 0;           // dron secim ekranindaki indeks
    /* Round 13: isisi + sub-dronlar (CONFIG.HEAT / CONFIG.SUBDRONE — game.config.js) */
    this.heat = 0;                    // 0..HEAT.max
    this.overheated = false;          // kilit: recoverAt'a inene kadar dash/roket/sub yok
    this.subDrones = 0;               // aktif sub-dron sayisi (0..SUBDRONE.max)
    this.subLaunchFailT = 0;          // is yetmezse HUD uyarisi kalan sure (s)
    /* Round 16: kara hedefi etki carpanlari — her sim adiminda _computeFireMods
       ile yeniden hesaplanir. enemyFireMul: radar sagken dusman ates araligi
       carpani. fireSlowMul: jammer menzildeyken oyuncu birincil ates araligi
       carpani (hava jammer'i ile ayni etki, ikisi ayni anda etkiliyse bir kez). */
    this.enemyFireMul = 1;
    this.fireSlowMul = 1;
    /* Round 18: kombo carpani — art arda oldurmeler skor'u carpilir.
       comboT her oldurmada yenilenir, sifira inince sayac silinir. Oyuncu
       hasar alinca aninda sifirlanir. Zamanlayici dt birikimiyle ilerler
       (_updateCombo) — deterministik, Math.random YOK. */
    this.comboCount = 0;        // art arda oldurma sayisi
    this.comboT = 0;            // kalan sure (s); windowMs/1000'den baslar
    this.repairFlashT = 0;      // onarim kutusu alininca kisa yesil parlamasi (yalniz cizim)
    // Sarsinti + hit-stop (round 9) — yalniz cizim, sim'e dokunmaz
    this.shakeT = 0;                  // kalan sarsinti suresi (s)
    this.shakeDur = 0;                // toplam sarsinti suresi (s)
    this.shakeAmp = 0;                // maksimum kayma (px)
    this.hitstopT = 0;                // kalan hit-stop suresi (s)
    this._killingEnemyType = '';      // game over: olduren dusman tipi
    // Menu yumusak gecis (round 9)
    this.menuFadeT = 1;               // 1 = tam gorunur, 0 = gecis ortasinda
    /* Round 22: yazili ama hic cagrilmamis ozelliklerin oyun tarafi durumu.
       _wreckSeed: enkaz tohumu icin ADLI LCG akisi — her olumde yeni bir LCG
       kurulmaz, tek akis ilerler (determinizm: iki kare hizinda ayni enkaz).
       _hoverOn/_hoverLevel: surekli rotor uguldusunun oyun tarafi niyeti;
       gercek bayrak sound.hoverOn, bu ikisi yalniz gecis tespiti icin.
       _jammersKilled: VURULARAK dusurulen jammer sayisi (ekrandan cikan degil). */
    this._wreckSeed = 9;
    this._hoverOn = false;
    this._hoverLevel = 0;
    this._hoverT = 0;                 // seviye tazeleme sayaci (s)
    this._jammersKilled = 0;
    this._expose();
  }
  _expose() {
    if (!this._autotest) return;
    window.__game = {
      game: this,
      renderer: this.renderer,
      tick: (ms) => this._tickOnce(ms),
      press: (k) => this.input.setKey(k, true),
      release: (k) => this.input.setKey(k, false),
      touchMove: (x, y) => this.input.touchMove(x, y),
      releaseTouch: () => this.input.releaseTouch(),
      startGame: () => this.startGame(),
      togglePause: () => this.togglePause(),
      toMenu: () => this.toMenu(),
      state: () => ({
        mode: this.state,
        player: { x: this.player.x, y: this.player.y, vx: this.player.vx, vy: this.player.vy, lives: this.player.lives, invincible: this.player.invincible },
        bullets: this.bulletPool.count(),
        ebullets: this.ebulletPool.count(),
        shotsFired: this.shotsFired,
        poolExhausted: this.bulletPool.exhausted + this.ebulletPool.exhausted,
        score: this.score,
        scrollY: this.scrollY,
        resScale: this.renderer.scale,
        drawCalls: this.renderer.drawCalls,
        saveCalls: this.renderer.saveCalls,
        assetsUsed: this.assets.n_png,
        assetsProcedural: this.assets.n_proc,
        manifestCount: this.assets.manifest.sprites.length,
        // paralaks test kancalari (round 3)
        cityOffset: this.city.layerOffset(),
        buildingsOnScreen: this.city.onScreenCount(),
        smoothX: this.city.smoothX,
        // tracer test kancasi (round 4): cizilen mermi iz uzunlugu (px)
        tracerLen: this.tracerLen || 0,
        // dusman test kancalari (round 5)
        enemies: this._enemiesState(),
        // FX test kancalari (round 6)
        sparksActive: this.fx.sparks.count(),
        explosionsActive: this.fx.explosions.count(),
        shockwavesActive: this.fx.shockwaves.count(),
        // bölüm ilerlemesi (round 7)
        stage: this.stageIdx,
        city: this.city.city,
        kills: this.killsThisStage,
        quota: CONFIG.STAGES[this.stageIdx].quota,
        landmarkShown: this.city.landmarkShown,
        crossfadeT: this.city.fadeT,
        // boss dongusu (round 8)
        bossState: this.bossState,
        bossHp: this.boss ? this.boss.hp : 0,
        bossMaxHp: this.boss ? this.boss.maxHp : 0,

        // round 10: rotor + silah + bulut + patlama
        simTimeMs: this.simTimeMs,
        weaponLevel: this.weaponLevel,
        shieldT: this.shieldT,
        powerups: this.powerups.filter((p) => p.active).map((p) => ({ type: p.type, x: p.x, y: p.y })),
        cloudsOnScreen: this.clouds.onScreenPositions(),
        cloudCount: this.clouds.onScreenPositions().length,
        /* Round 12: roket + silah yanip sonegi + dron secimi */
        rocketT: this.rocketT,

        shipSelectIdx: this.shipSelectIdx,

        rocketsActive: this.rocketPool.count(),
        /* Round 13: isisi + sub-dronlar */
        /* Orkestrator notu: yeni ozellikler state() uzerinden OLCULEBILIR olmali;
           aksi halde harness onlari goremez ve testler yesil gorunurken ozellik

        heat: this.heat,
        overheated: this.overheated,
        subs: this.player ? {

        dash: this.player ? {

        subDrones: this.player && this.player.subs ? this.player.subs.count() : 0,
        subLaunchFailT: this.subLaunchFailT,
        // round 11: bulut yatay parallaks + boss sprite + karo A/B
        cloudOffset: this.clouds.layerOffset(),
        cloudSprites: this.clouds.spawnedSprites(12),
        bossSprite: this.boss ? this.boss.sprite : '',
        /* Round 15: jammer — sahnede aktif mi + oyuncu menzilde mi.
           Round 22: `killed` EKLENDI (mevcut alanlar korundu): jammer artik
           vurulabiliyor; kapi "aktif/menzilde" yerine gercekten dusuruleni
           olcer — yoksa dokunulmaz bir dron da yesil yanardi. */
        jammer: (function() {
          let active = false, inRange = false, count = 0;
          this.jammerPool.forEach((j) => {
            if (!j.active) return;
            active = true; count++;
            if (j.inRange) inRange = true;
          });
          return { active, inRange, count, killed: this._jammersKilled };
        }).call(this),
        /* Round 22: dusen enkaz (FxSystem.spawnWreck) — olculebilir olmali.
           Okuyucular fx paketinindir; yoksa havuzdan DUSURULMEDEN hesaplanir
           (eksik okuyucu sessizce "her sey yolunda" dememeli). */
        fx: (function() {
          const f = this.fx;
          const pool = f.wrecks;
          const wrecks = typeof f.wreckCount === 'function'
            ? f.wreckCount() : (pool ? pool.count() : 0);
          let finite;
          if (typeof f.wreckFinite === 'function') finite = f.wreckFinite();
          else if (pool) {
            finite = true;
            pool.forEach((w) => {
              if (!(isFinite(w.x) && isFinite(w.y) && isFinite(w.ang))) finite = false;
            });
          } else finite = false;
          let sample = null;
          if (typeof f.wreckSample === 'function') sample = f.wreckSample();
          else if (pool) {
            for (const w of pool.items) {
              if (w.active) { sample = { x: w.x, y: w.y, ang: w.ang }; break; }
            }
          }
          return { wrecks, wreckFinite: finite, wreckSample: sample };
        }).call(this),
        /* Round 22: glitch — ambient (jammer menzili) + anlik hasar glitch'i. */
        glitch: (function() {
          const f = this.fx;
          return {
            level: typeof f.ambientGlitchLevel === 'function'
              ? f.ambientGlitchLevel() : (f._ambientGlitch || 0),
            damageT: typeof f.damageGlitchT === 'function'
              ? f.damageGlitchT() : Math.max(0, f._glitchT || 0),
          };
        }).call(this),
        /* Round 22: surekli rotor uguldusu. Autotest'te AudioContext ASKIDA
           kalir ve hicbir ses dugumu kurulmaz — bayrak yine de acilmali,
           bu yuzden mantiksal bayrak okunur (sound.hoverOn), ses grafigi degil. */
        sound: (function() {
          const s = this.sound;
          const on = (typeof s.hoverOn === 'boolean') ? s.hoverOn
            : (typeof s.hoverActive === 'function' ? !!s.hoverActive() : this._hoverOn);
          return { hover: !!on, hoverLevel: this._hoverLevel, muted: s.muted };
        }).call(this),
        /* Round 15: tasici boss — parca canlari + govde kilit durumu.
           Antenden once bodyVulnerable=false (govde hasar almaz). */
        carrier: this.carrier && this.carrier.active ? this.carrier.state() : null,
        cityTileA: 'city_' + this.city.city,
        cityTileB: 'city_' + this.city.city + '_b',
        tileBLoaded: this.assets.has('city_' + this.city.city + '_b') || !!this.assets.fallback['city_' + this.city.city + '_b'],
        explosionLayers: (function() {
          const F = CONFIG.FX;
          let flash = 0, fire = 0, smoke = 0;
          this.fx.explosions.forEach((e) => {
            if (e.t / (F.flashMs / 1000) < 1) flash++;
            if (e.t / (F.fireMs / 1000) < 1) fire++;
            if ((e.t - F.smokeDelay) / (F.smokeMs / 1000) > 0 && (e.t - F.smokeDelay) / (F.smokeMs / 1000) < 1) smoke++;
          });

        }).call(this),
        /* Round 16: kara hedefleri — liman bolumu + etki carpanlari */
        ground: (function() {
          const units = [];
          let radarAlive = false, jammerInRange = false;
          this.groundPool.forEach((g) => {
            if (!g.active) return;
            /* worldY = zemine cakili SABIT koordinat (y0 - spawnDist). Onceki hali
               screenY ile ayni degeri veriyordu; o zaman "dunya konumu degismedi"
               olcumu anlamsizdi ve kare-kare eslestirme icin kimlik anahtari yoktu. */
            units.push({ type: g.type, x: g.x, worldY: g.y0 - g.spawnDist, screenY: g.screenY(this.city), hp: g.hp });
            if (g.type === 'radar') radarAlive = true;
            if (g.type === 'jammer' && g.inRange) jammerInRange = true;
          });
          if (!jammerInRange) {
            this.jammerPool.forEach((j) => { if (j.active && j.inRange) jammerInRange = true; });
          }
          return { count: units.length, units, radarAlive, jammerInRange, enemyFireMul: this.enemyFireMul };
        }).call(this),
        /* Round 17: skimmer + zemin izi (scorch) — olculebilirlik zorunlu. */
        skimmers: (function() {
          const out = [];
          this.skimmerPool.forEach((k) => { if (k.active) out.push(k.state()); });
          return out;
        }).call(this),
        scorches: (function() {
          const out = [];
          this.fx.scorches.forEach((sc) => {
            if (sc.active) out.push({ x: sc.x, y: sc.screenY(this.city) });
          });
          return out;
        }).call(this),
        stageCount: CONFIG.STAGES.length,
        cityDist: this.city.dist,
        /* Round 18: kombo carpani — harness'in penceresi (count/mult/t). */
        combo: { count: this.comboCount, mult: this.comboMult(), t: this.comboT },
        scorePops: (function() {
          let n = 0;
          this.fx.scorePops.forEach((sp) => { if (sp.active) n++; });
          return n;
        }).call(this),
        repairFlashT: this.repairFlashT,
        /* Round 19: muzik durumu — audio paketi motoru yazdikca state() doner. */
        music: this.sound.music ? this.sound.music.state() : null,
        /* Round 20: kosu istatistikleri + kalici rekor + ipucu */
        stats: (function() {
          const s = this._stats;
          return {
            kills: s.kills, bestCombo: s.bestCombo, shots: s.shots, hits: s.hits,
            accuracy: s.shots > 0 ? Math.min(1, s.hits / s.shots) : 0,
            timeMs: Math.round(this.simTimeMs),
          };
        }).call(this),
        persist: { available: this._persistAvailable, best: this.bestScore },
        tip: { text: this.tipText(), index: this._tipIndex },
      }),
      spawnEnemy: (type, x, y) => this._spawnEnemy(type, x != null ? x : CONFIG.W / 2, y != null ? y : -40),
      spawnPowerup: (type, x, y) => this.spawnPowerup(type, x, y),
      forceKills: (n) => { for (let i = 0; i < n; i++) this._onKill(); },
      /* Round 18: komboyu n oldurmeye ayarla (skor EKLEMEZ — test kancasi). */
      forceCombo: (n) => { this.comboCount = n; this.comboT = CONFIG.COMBO.windowMs / 1000; },
      forceBoss: () => this.forceBoss(),
      killBoss: () => this.killBoss(),
      killCarrier: () => this.killCarrier(),
      /* Round 15: tasici boss'u bolumden bagimsiz baslat (autotest kancasi). */
      spawnCarrier: () => this.spawnCarrier(),
      /* Round 22: olu kod kancalari — hepsi NORMAL yollardan gecer (ayri bir
         "test yolu" yok; yoksa kapi gercekte calismayan bir seyi olcerdi). */
      killNearestEnemy: () => this.killNearestEnemy(),
      damagePlayer: () => this.damagePlayer(),
      spawnJammer: (x, y) => this.spawnJammer(x, y),
      killNearestJammer: () => this.killNearestJammer(),
      /* Round 16: kara hedefi test kancalari */
      spawnGround: (type, x, screenY) => this.spawnGround(type, x, screenY),
      /* Round 17: skimmer test kancasi — liman disinda false doner. */
      spawnSkimmer: () => this.spawnSkimmer(),
      clearGround: () => this.clearGround(),
      /* Round 14: sub-dron test kancalari (sub_drones kapisi) */
      grantSubDrone: () => this.grantSubDrone(),
      launchSubDrones: () => this.launchSubDrones(),
      /* Round 12: dron secimi + silah degistirme kancalari */
      toShipSelect: () => this.toShipSelect(),
      shipSelectLeft: () => this.shipSelectLeft(),
      shipSelectRight: () => this.shipSelectRight(),
      confirmShipSelect: () => this.confirmShipSelect(),
      switchWeapon: () => this.switchWeapon(),
      screenshot: () => {
        // file:// altinda toDataURL calismayabilir (taint). Vision denetimi icin
        // SADECE oyun dunyasi cizilir: sehir + dron + mermiler. HUD/debug YOK.
        // Basariya ulasamazsa null doner; evaluate.py page.screenshot kullanir.
        try {
          const r = this.renderer;
          r.begin();
          this._drawWorldNoHud(r.ctx, 0);
          return r.canvas.toDataURL('image/png');
        } catch (e) { return null; }
      },
    };
  }
  stop() { if (this._raf) cancelAnimationFrame(this._raf); this._raf = null; }
  start() {
    this.state = 'menu';
    /* Muzik acilistan itibaren calar (menu yogunlugunda). Tarayici ilk
       kullanici hareketine kadar AudioContext'i askida tutar; motor bunu
       zaten kontrol ediyor, burada yalniz calma niyeti kuruluyor. */
    this._startMusic();
    this._lastTime = performance.now();
    if (this._autotest) return;   // otostest'te rAF yok, tick() kullanilir
    const loop = (t) => {
      this._raf = requestAnimationFrame(loop);
      const raw = t - this._lastTime; this._lastTime = t;
      this._frame(raw);
    };
    this._raf = requestAnimationFrame(loop);
  }
  /* Autotest: rAF yerine dogrudan cagirilir. */
  _tickOnce(ms) {
    // Hit-stop: sim duraklatir ama cizim devam eder (autotest'te devre disi)
    if (this.hitstopT > 0 && !CONFIG.AUTOTEST) {
      this.hitstopT -= ms / 1000;
      this._render(0);
      return;
    }
    const { steps } = this.clock.advance(ms);
    for (let i = 0; i < steps; i++) this._simStep(this.clock.step);
    this._render(0);
  }
  _frame(rawMs) {
    const t0 = performance.now();
    // Hit-stop: sim duraklatir ama cizim devam eder
    if (this.hitstopT > 0 && !CONFIG.AUTOTEST) {
      this.hitstopT -= rawMs / 1000;
      this._render(0);
      this.frameMs = performance.now() - t0;
      this.fps = this.frameMs;
      return;
    }
    const { steps, alpha } = this.clock.advance(rawMs);
    for (let i = 0; i < steps; i++) this._simStep(this.clock.step);
    this._render(alpha);
    this.frameMs = performance.now() - t0;
    this.fps = this.frameMs;
    this.renderer.recordFrame(this.frameMs);
  }
  _simStep(dt) {
    // Sarsinti soneum (tum durumlarda ilerler — cizim katmani)
    if (this.shakeT > 0) this.shakeT -= dt;
    // Menu yumusak gecis
    if (this.menuFadeT < 1) this.menuFadeT = Math.min(1, this.menuFadeT + dt * 1000 / CONFIG.MENU_FADE_MS);
    if (this.state === 'play') {
      this.playTime += dt;
      this.simTimeMs += dt * 1000;
      // kalkan soneum (round 10)
      if (this.shieldT > 0) this.shieldT -= dt;
      /* Round 12: roket sure + silah yanip sonegi */
      if (this.rocketT > 0) {
        this.rocketT -= dt;
        this._updateRockets(dt);   // roket atis + gait + carpisma
      }
      if (this.weaponFlashT > 0) this.weaponFlashT -= dt;
      /* Round 18: onarim parlamasi soneumu (yalniz cizim) + kombo zamanlayicisi */
      if (this.repairFlashT > 0) this.repairFlashT -= dt;
      this._updateCombo(dt);
      /* Round 20: en iyi kombo YASAYAN sayactan izlenir, yalnizca _onKill'den
         degil. Kombo sayaci oldurme disi yollardan da degisebiliyor
         (forceCombo test kancasi, boss girisi sure yenilemesi); o zaman
         _stats.bestCombo geride kaliyordu — olculdu: en_iyi_kombo=6/16.
         Sim adiminda okunur, dt birikimine bagli degil: deterministik. */
      if (this.comboCount > this._stats.bestCombo) this._stats.bestCombo = this.comboCount;
      /* Round 20: ipucu sirasi — sim adiminda, girdiye/cizime dokunmaz */
      this._updateTip(dt);
      /* Round 13: isisi — dash/roket/subLaunch harcar, sure ile sogur.
         Asiri sicaklikta kilit: recoverAt'a inene kadar yeni harcama yok. */
      const H = CONFIG.HEAT;
      this.heat = Math.max(0, this.heat - H.cooldownPerSec * dt);
      if (this.overheated && this.heat <= H.recoverAt) this.overheated = false;
      if (this.subLaunchFailT > 0) this.subLaunchFailT -= dt;
      // Sub-dron firlatma girdisi (Input.consumeSubLaunch bayragi)
      if (this.input.consumeSubLaunch()) this._trySubLaunch();
      this.player.update(dt, this.input, this);
      this.bulletPool.forEach((b) => b.update(dt));
      /* Round 17: omru biten ucaksavar mermisi EKRAN ICINDE patlar (flak).
         Ekrandan cikarak olenler patlamaz — hava patlamasi hissi bozulmasin. */
      this.ebulletPool.forEach((b) => {
        const wasFlak = b.active && b.flak;
        const px = b.x, py = b.y;
        b.update(dt);
        if (wasFlak && !b.active && py > -20 && py < CONFIG.H + 20 && px > -20 && px < CONFIG.W + 20) {
          this.fx.flak(px, py);
          if (this.sound.flak) this.sound.flak();
        }
      });
      // dusmanlar (boss aktifken yeni dusman DOGMAZ — kota doldu)
      this.scoutPool.forEach((e) => e.update(dt, this));
      this.gunnerPool.forEach((e) => e.update(dt, this));
      this.shieldPool.forEach((e) => e.update(dt, this));
      /* Round 12: uc yeni tip */
      this.bomberPool.forEach((e) => e.update(dt, this));
      this.kamikazePool.forEach((e) => e.update(dt, this));
      this.sniperPool.forEach((e) => e.update(dt, this));
      /* Round 15: jammer dronlari — menzil durumu update'te guncellenir */
      this.jammerPool.forEach((j) => j.update(dt, this));
      this._updateJammerFx();
      /* Round 16: kara hedefleri — slot tabanli LCG spawn + update.
         YALNIZCA ground:true olan bolumde dogar (liman). */
      this._updateGround(dt);
      this.groundPool.forEach((g) => g.update(dt, this));
      /* Round 17: skimmer dogusu + guncelleme (yalniz liman, crossfade sonrasi) */
      this._updateSkimmers(dt);
      this._computeFireMods();
      // boss dongusu: warn -> active -> dying (round 8)
      this._updateBoss(dt);
      // spawn yonetimi (yalnizca boss yokken)
      if (this.bossState === 'none') this._updateSpawn(dt);
      // powerup guncelleme (round 10): asagi suzuleme + pickup
      this._updatePowerups(dt);
      // carpisma: oyuncu mermisi vs dusman + boss
      this._collidePlayerBullets();
      // carpisma: dusman mermisi vs oyuncu
      this._collideEnemyBullets();
      // FX (cizim katmani — sim'e dokunmaz, determinizm bozulmaz)
      this.fx.update(dt);
      // sehir paralaks katmani: oyuncu x normalizasyonu (-1..1) ile ilerler
      const nx = (this.player.x / CONFIG.W) * 2 - 1;
      this.city.update(dt, nx);
      // bulut katmani (round 10+11): yatay parallaks ayni nx ile
      this.clouds.update(dt, nx);
      // bölüm karti soneum (amblem + ad)
      if (this.stageTitleT > 0) this.stageTitleT -= dt;
      // simge yapı: kotanın yarısında bir kez gec (flag; artik sahnede cizilmez)
      const st = CONFIG.STAGES[this.stageIdx];
      if (!this.landmarkTriggered && this.killsThisStage >= Math.floor(st.quota / 2)) {
        this.landmarkTriggered = true;
        this.city.triggerLandmark();
      }
      // zafer gecikmesi (bölüm 4 boss'u ölünce)
      if (this.victoryT > 0) {
        this.victoryT -= dt;
        if (this.victoryT <= 0) this.state = 'victory';
      }
      /* Round 20: can bitince oyun BURADA biter — tek kosulsuz kapanis noktasi.
         Oncesinde bitis yalnizca dusman mermisi carpismasinin icine gomuluydu;
         canlari baska bir yol sifirlarsa oyun 'play'de asili kaliyor ve rekor
         hic kaydedilmiyordu (olculdu: mod_oyun_sonu=play, rekor=0). */
      if (this.player.lives <= 0) this._gameOver('düşman');
    }
    /* Round 19: menüde oyun dünyası kaymaya devam etsin (şehir + bulut).
       Yalnizca dist ilerler — bina/parallaks durumu degismez, sim'e dokunmaz. */
    if (this.state === 'menu') {
      this.city.dist += CONFIG.SCROLL.speed * dt;
      this.clouds.dist += CONFIG.CLOUDS.speed * dt;
    }
    /* Round 19: müzik yogunlugunu duruma bagla (audio paketi motoru yazar).
       Zamanlama sim'den BAGIMSIZ: buradan sadece hedef yogunluk verilir. */
    this._syncMusic();
    /* Round 22: surekli rotor uguldusu — oyun basladiginda acilir, duraklama /
       oyun sonu / menude kapanir. Durum kontrolu BURADA (play blogunun disinda)
       yapilir ki her cikis yolu tek yerden kapatilsin. */
    this._updateHover(dt);
  }
  /* Surekli motor sesi (Sound.hover / stopHover). Ses dugumleri yalnizca
     GECISTE kurulur/yikilir; seviye tazelemesi kademe (hoverStep) ve zaman
     araligiyla kisilir — kare basina cagri YOK (audio paketinin notu).
     Seviye oyuncunun hizindan turetilir: durur gibi sukunetli, hizlanirken
     perde/genlik yukselir. Sim adiminda hesaplanir, performance.now() YOK.   */
  _updateHover(dt) {
    const F = CONFIG.FEEDBACK;
    if (this.state !== 'play') {
      if (this._hoverOn) {
        if (typeof this.sound.stopHover === 'function') this.sound.stopHover();
        this._hoverOn = false;
        this._hoverLevel = 0;
        this._hoverT = 0;
      }
      return;
    }
    const p = this.player;
    const maxV = p.maxSpeed || CONFIG.PLAYER.maxSpeed;
    const sp = Math.min(1, Math.sqrt(p.vx * p.vx + p.vy * p.vy) / (maxV || 1));
    /* Seviye araligi: audio paketi kendi araligini yayinlarsa O gecerlidir
       (tek kaynak); yoksa game.config'teki yedek kullanilir. */
    const H = (CONFIG.SOUND && CONFIG.SOUND.hover) || null;
    const lo = (H && H.levelMin != null) ? H.levelMin : F.hoverMin;
    const hi = (H && H.levelMax != null) ? H.levelMax : F.hoverMax;
    const lv = lo + (hi - lo) * sp;
    this._hoverT += dt;
    const fresh = !this._hoverOn;
    if (fresh || (this._hoverT >= 0.2 && Math.abs(lv - this._hoverLevel) >= F.hoverStep)) {
      if (typeof this.sound.hover === 'function') this.sound.hover(lv);
      this._hoverOn = true;
      this._hoverLevel = lv;
      this._hoverT = 0;
    }
  }
  /* Hedef yogunlugu: boss uyarisi/aktifken boss, oyun play, menu/duraklama/
     gameover/victory menu seviyesi. Duraklamada muzik DURMAZ — menu seviyesine iner. */
  _musicIntensity() {
    const I = CONFIG.MUSIC.intensity;
    if (this.bossState === 'warn' || this.bossState === 'active') return I.boss;
    switch (this.state) {
      case 'play':      return I.play;
      case 'victory':   return I.victory;
      default:          return I.menu;   // menu, shipselect, pause, gameover
    }
  }
  _syncMusic() {
    const m = this.sound.music;
    if (!m) return;
    if (typeof m.setIntensity === 'function') m.setIntensity(this._musicIntensity());
    else if (m.level !== undefined) m.level = this._musicIntensity();
  }
  /* ------------------------------------------------ Round 20: kalici rekor */
  /* localStorage erisimi her zaman try/catch icinde: file:// ve gizli sekmede
     exception atabilir; oyun bu yuzden ASLA cokmemeli. Erisilemiyorsa
     bellekteki degerle devam edilir (_persistAvailable=false).            */
  _loadPersist() {
    let best = 0, runs = 0;
    try {
      const raw = window.localStorage.getItem(CONFIG.STATS.storageKey);
      if (raw) {
        const o = JSON.parse(raw);
        if (typeof o.best === 'number' && isFinite(o.best)) best = Math.max(0, o.best);
        if (typeof o.runs === 'number' && isFinite(o.runs)) runs = Math.max(0, o.runs);
      }
      this._persistAvailable = true;
    } catch (e) { this._persistAvailable = false; }
    return { best, runs };
  }
  _savePersist() {
    try {
      window.localStorage.setItem(CONFIG.STATS.storageKey,
        JSON.stringify({ best: this.bestScore, runs: this._runCount }));
    } catch (e) { /* bellek icindeki deger gecerli kalmaya devam eder */ }
  }
  /* Round 20: kosunun bitisi — TEK yol. Rekor burada kalicilasir; _savePersist
     zaten try/catch icinde, yani localStorage erisilemezse oyun cokmez, rekor
     bellekte kalir. Iki kez cagirilsa da bir kez calisir (state korumasi).   */
  _gameOver(cause) {
    if (this.state !== 'play') return;
    if (cause && !this._killingEnemyType) this._killingEnemyType = cause;
    this._newRecord = this.score > this.bestScore;
    this.bestScore = Math.max(this.bestScore, this.score);
    this._savePersist();
    this.menuFadeT = 0;   // yumusak gecis
    this.state = 'gameover';
  }
  /* Round 20: atis sayaci TEK YERDEN artar. Once `shotsFired` (HUD/harness)
     ve kosu istatistigi `_stats.shots` ayri yerlerde tutuluyordu; ikincisi hic
     artmadi ve isabet orani anlamsiz kaldi (olculdu: atis=0 isabet=6).
     Player.update bunu cagirir — sim adiminda, wall-clock yok.              */
  addShots(n) {
    this.shotsFired += n;
    this._stats.shots += n;
  }
  /* Ipuclu sirasi: sim adiminda ilerler (dt birikimi), cizim/girdiye dokunmaz.
     Yalnizca ilk CONFIG.TIPS.onlyFirstRuns kosuda calisir.                */
  _updateTip(dt) {
    const T = CONFIG.TIPS;
    if (!T || !T.list || !T.list.length) return;
    if (this._runCount >= T.onlyFirstRuns) return;
    if (this._tipT > 0) { this._tipT -= dt; return; }
    if (this._tipIndex < T.list.length) {
      this._tipT = T.showMs / 1000;
      this._tipIndex++;
    } else {
