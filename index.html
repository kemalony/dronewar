      this._tipT = -T.gapMs / 1000;   // bosluk: sonraki ipucuna kadar bekle
    }
  }
  tipText() {
    const T = CONFIG.TIPS;
    if (this._tipT <= 0 || !T || !T.list) return '';
    return T.list[this._tipIndex - 1] || '';
  }
  /* ------------------------------------------------------------- durumlar */
  /* Round 12: elle silah degistirme — sahip olunan seviyeler arasinda gecis.
     Q tusu / HUD rozetine dokunma ile cagrilir. Secim state()'te gorunur.   */
  switchWeapon() {
    if (this.state !== 'play') return;
    // Mevcut seviyeden bir sonrakine gec (max'ta 1'e don)
    this.weaponLevel = (this.weaponLevel >= CONFIG.WEAPON.maxLevel) ? 1 : this.weaponLevel + 1;
  }
  togglePause() {
    if (this.state === 'play') { this.menuFadeT = 0; this.state = 'pause'; }
    else if (this.state === 'pause') { this.menuFadeT = 0; this.state = 'play'; }
  }
  toMenu() {
    this._startMusic();
    if (this.state === 'play' || this.state === 'pause' || this.state === 'gameover' || this.state === 'victory') {
      this.menuFadeT = 0;
      this.state = 'menu';
      /* Round 19: muzik durmaz — menu yogunluguna iner. */
      this._syncMusic();
    }
  }
  /* ---------------------------------------------------- dron secimi (round 12) */
  /* Menu -> dron secim ekranina gec. Kilitler bestScore'a gore acilir. */
  toShipSelect() {
    this.menuFadeT = 0;
    this.state = 'shipselect';
    // En son secili acik dronu indeksle (kilitli ise falcon)
    const idx = CONFIG.DRONES.findIndex((d) => d.id === this.selectedDrone && d.unlock <= this.bestScore);
    this.shipSelectIdx = idx >= 0 ? idx : 0;
  }
  _droneUnlocked(i) { return CONFIG.DRONES[i].unlock <= this.bestScore; }
  shipSelectLeft() {
    if (this.state !== 'shipselect') return;
    let i = this.shipSelectIdx;
    for (let n = 0; n < CONFIG.DRONES.length; n++) {
      i = (i - 1 + CONFIG.DRONES.length) % CONFIG.DRONES.length;
      if (this._droneUnlocked(i)) break;
    }
    this.shipSelectIdx = i;
  }
  shipSelectRight() {
    if (this.state !== 'shipselect') return;
    let i = this.shipSelectIdx;
    for (let n = 0; n < CONFIG.DRONES.length; n++) {
      i = (i + 1) % CONFIG.DRONES.length;
      if (this._droneUnlocked(i)) break;
    }
    this.shipSelectIdx = i;
  }
  confirmShipSelect() {
    if (this.state !== 'shipselect') return;
    const D = CONFIG.DRONES[this.shipSelectIdx];
    if (!this._droneUnlocked(this.shipSelectIdx)) return;   // kilitli: secilemez
    this.selectedDrone = D.id;
    this.startGame();
  }
  /* Round 19: muzik MENUDE de calar (yogunluk menu seviyesinde). Yalniz
     startGame'de baslatilinca menu sessiz kaliyordu — olculdu: playing=false. */
  _startMusic() {
    const m = this.sound && this.sound.music;
    if (m && typeof m.start === 'function' && !m.state().playing) m.start();
  }
  startGame() {
    this.menuFadeT = 0;   // yumusak gecis
    this.state = 'play';
    this._startMusic();
    /* Round 12: secilen dronla oyuncu olustur (tank silah 2 ile baslar) */
    const D = CONFIG.DRONES.find((d) => d.id === this.selectedDrone) || CONFIG.DRONES[0];
    this.player = new Player(this.selectedDrone);
    this.bulletPool.reset();
    this.ebulletPool.reset();
    this.scoutPool.reset();
    this.gunnerPool.reset();
    this.shieldPool.reset();
    this.bomberPool.reset();
    this.kamikazePool.reset();
    this.sniperPool.reset();
    this.jammerPool.reset();
    /* Round 16: kara hedefleri sifirlari */
    this.groundPool.reset();
    this.skimmerPool.reset();
    this._skimmerT = 0;
    this._skimSeed = 0;
    this._groundBuiltUpTo = -1;
    this._groundSeed = 42;
    this.enemyFireMul = 1;
    this.fireSlowMul = 1;
    this.rocketPool.reset();
    this.fx.reset();
    this.clock.acc = 0;   // temiz baslangic: bir onceki oturumun kalan acc'i sim'i kaydirmasin
    this.city.setCity('istanbul', true);   // paralaks katmanini sifirla (instant, crossfade yok)
    this.shotsFired = 0; this.score = 0; this.scrollY = 0; this.hp = 1;
    this.simTimeMs = 0;
    this.weaponLevel = D.startWeapon || 1;   // tank: 2 baslar
    this.shieldT = 0;
    this.powerups = [];
    this._puSeed = 7;
    /* Round 12: roket + silah yanip sonegi sifirlari */
    this.rocketT = 0; this.rocketFireT = 0; this.weaponFlashT = 0;
    /* Round 13: isisi + sub-dronlar */
    this.heat = 0; this.overheated = false;
    this.subDrones = 0; this.subLaunchFailT = 0;
    /* Round 18: kombo + onarim parlamasi sifirlari */
    this.comboCount = 0; this.comboT = 0; this.repairFlashT = 0;
    this.clouds.reset();
    this._spawnSeed = 42;
    this._spawnTimer = 0;
    /* Round 22: enkaz tohumu + jammer sayaci sifirlari (deterministik kosu:
       ayni girdi ayni enkaz savrulmasini vermeli). Hover bayragi kapali
       baslar; _updateHover ilk sim adiminda yeniden acar. */
    this._wreckSeed = 9;
    this._jammersKilled = 0;
    if (this._hoverOn && typeof this.sound.stopHover === 'function') this.sound.stopHover();
    this._hoverOn = false; this._hoverLevel = 0; this._hoverT = 0;
    // bölüm ilerlemesi (round 7)
    this.stageIdx = 0;
    this.killsThisStage = 0;
    this.stageTitleT = CONFIG.STAGE_TITLE_MS / 1000;   // ilk bölüm karti
    this.landmarkTriggered = false;
    // boss dongusu sifirlari (round 8)
    this.boss = null;
    this.bossState = 'none';
    this.bossWarnT = 0;
    this.bossDeathT = 0;
    this.bossFlashT = 0;
    this.bossScored = false;
    /* Round 15: tasici boss sifirlari (parca _exploded bayraklari dahil) */
    this.carrier.active = false;
    for (const id in this.carrier.parts) this.carrier.parts[id]._exploded = false;
    this.victoryT = 0;
    this.playTime = 0;
    this._newRecord = false;
    /* Round 20: kosu istatistikleri + ipucu sifirlari */
    this._stats.kills = 0; this._stats.bestCombo = 0;
    this._stats.shots = 0; this._stats.hits = 0;
    this._tipT = CONFIG.TIPS.showMs / 1000;   // ilk kosuda hemen basla
    this._tipIndex = 0;
    this._runCount++;
    this._savePersist();
    // Sarsinti + hit-stop sifirlari (round 9)
    this.shakeT = 0; this.shakeDur = 0; this.shakeAmp = 0;
    this.hitstopT = 0;
    this._killingEnemyType = '';
  }
}

/* ------------------------------------------------------------------- boot */
(function main() {
  const params = new URLSearchParams(location.search);
  CONFIG.DEBUG = params.get('debug') === '1';
  CONFIG.AUTOTEST = params.get('autotest') === '1';
  const canvas = document.getElementById('game');
  // pencereye sigdir: 480x800 oranini koru
  function fit() {
    const ww = innerWidth, wh = innerHeight;
    const s = Math.min(ww / CONFIG.W, wh / CONFIG.H);
    canvas.style.width = (CONFIG.W * s) + 'px';
    canvas.style.height = (CONFIG.H * s) + 'px';
  }
  fit(); addEventListener('resize', fit);
  const game = new Game(canvas);
  /* Round 12: klavye akisi — Space: menu->secim, secim->oyun.
     Ok/WASD + Q: dron secim ekraninda gezinme/silah degistirme. */
  addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const st = game.state;
    if (st === 'menu' && e.code === 'Space') { game.toShipSelect(); }
    else if (st === 'shipselect') {
      if (e.code === 'Space' || e.code === 'Enter') game.confirmShipSelect();
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') game.shipSelectLeft();
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') game.shipSelectRight();
    }
  });
  /* Autotest: boot'ta oyuncu olustur ki cizim/hata uretmesin; startGame()
     secilen dronla yeniden olusturur (sim sifirlari orada). */
  if (CONFIG.AUTOTEST) game.player = new Player(game.selectedDrone);
  game.start();
})();

/* ---- src/game/Game.spawn.js ---- */
/* game paketi — spawn yonetimi + boss dongusu + powerup/roket/isisi.
   Round 17: Game.js'ten birebir tasinan metotlar; davranis DEGISMEDI. */
Object.assign(Game.prototype, {
  /* ---------------------------------------------------- boss dongusu (round 8) */
  _updateBoss(dt) {
    const B = CONFIG.BOSS;
    if (this.bossState === 'warn') {
      this.bossWarnT -= dt;
      if (this.bossWarnT <= 0) {
        /* Round 16: son bolum boss'u cok asamali tasici — tek kurulum yolu.
           spawnCarrier() hem forceBoss hem test kancasi icin ayni reset'i yapar.
           stageIdx === STAGES.length-1: bolum 4 (Tokyo) normal boss, bolum 5
           (Liman) tasici. Sabit sayi YOK — STAGES.length'ten turetilir. */
        if (this.stageIdx === CONFIG.STAGES.length - 1) {
          this.spawnCarrier();
        } else {
          this.boss = new Boss();
          this.boss.reset(this.stageIdx);
          this.bossState = 'active';
        }
      }
      return;
    }
    if (this.bossState === 'active') {
      if (this.carrier.active) {
        this._updateCarrier(dt);
      } else if (this.boss) {
        this.boss.update(dt, this);
      }
      return;
    }
    if (this.bossState === 'dying') {
      this.bossDeathT -= dt;
      /* Round 15: tasici govde olumu — CONFIG.CARRIER sayilari, boss_tokyo boyutu */
      const isCarrier = !this.boss && this.carrier.active;
      const cfg = isCarrier ? CONFIG.CARRIER : B;
      const cx = isCarrier ? this.carrier.x : this.boss.x;
      const cy = isCarrier ? this.carrier.y : this.boss.y;
      const spreadX = isCarrier ? 208 : 120;
      const spreadY = isCarrier ? 176 : 90;
      // patlamalar, deathWindowMs icinde esit araliklarla (LCG konum sapmasi)
      const n = cfg.deathExplosions;
      const win = cfg.deathWindowMs / 1000;
      const done = Math.min(n, Math.ceil((win - this.bossDeathT) / win * n));
      for (let i = 0; i < done; i++) {
        let s = (i * 2654435761 + 9176) >>> 0;
        const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
        this.fx.explode(cx + (rnd() - 0.5) * spreadX, cy + (rnd() - 0.5) * spreadY);
      }
      if (this.bossFlashT > 0) this.bossFlashT -= dt;
      if (this.bossDeathT <= 0) {
        this.boss = null;
        this.carrier.active = false;
        this.bossState = 'none';
        this._afterBossDeath();
      }
    }
  },
  /* Round 15: jammer ambient glitch — oyuncu herhangi bir jammer'in
     CONFIG.JAMMER.radius menziline girince hafif surekli glitch, cikinca 0.
     Yalniz cizim katmani; sim durumuna dokunmaz. */
  _updateJammerFx() {
    let inRange = false;
    this.jammerPool.forEach((j) => { if (j.active && j.inRange) inRange = true; });
    /* Round 16: kara jammer de ambient glitch'e katilir — hava jammer'i ile
       ayni etki, ikisi ayni anda menzilde gorse bile seviye bir kez uygulanir. */
    this.groundPool.forEach((g) => { if (g.active && g.type === 'jammer' && g.inRange) inRange = true; });
    this.fx.setAmbientGlitch(inRange ? CONFIG.JAMMER.glitchLevel : 0);
  },
  /* Round 16: kara hedefi spawn yonetimi — slot tabanli LCG (binalardaki
     builtUpTo mantiginin aynisi). YALNIZCA ground:true olan bolumde calisir.
     Her slot CONFIG.GROUND.spacing kadar dunya mesafesinde; slotta tip ve x
     (marginX'e saygili) LCG'den secilir. Ayni slot iki kez uretilmez.        */
  _groundLcg() {
    this._groundSeed = (Math.imul(this._groundSeed, 1664525) + 1013904223) >>> 0;
    return this._groundSeed / 4294967296;
  },
  _updateGround(dt) {
    const st = CONFIG.STAGES[this.stageIdx];
    if (!st.ground) return;   // diger dort bolumde tek bir kara hedefi bile dogmaz
    /* Bolum gecisi crossfade'i bitmeden dogurma: fadeT < 1 iken ekranda hala
       ONCEKI sehrin (Tokyo) fotografi var ve kara araci onun uzerinde duruyor
       gibi gorunuyor — kacinmak istedigimiz sey tam olarak bu. */
    if (this.city.fadeT < 1) return;
    const G = CONFIG.GROUND;
    const maxSlot = Math.floor((this.city.dist + CONFIG.H) / G.spacing);
    while (this._groundBuiltUpTo < maxSlot) {
      this._groundBuiltUpTo++;
      const slot = this._groundBuiltUpTo;
      // deterministik tohum: slot bazli (CityScroller._spawnAt ile ayni desen)
      let seed = (slot * 2654435761 + 1013904223) >>> 0;
      const rnd = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      // tip secimi: radar / aa / jammer
      const r = rnd();
      const type = r < 0.4 ? 'radar' : r < 0.75 ? 'aa' : 'jammer';
      // x konumu: marginX'e saygili
      const m = G.marginX;
      const x = m + rnd() * (CONFIG.W - 2 * m);
      // dogus: ekranin ustunden (y0 = -80), city.dist'ten turetilir
      const y0 = -80;
      const u = this.groundPool.acquire();
      if (u) u.reset(type, x, y0, this.city.dist);
    }
  },
  /* Test kancasi: kara hedefini dogrudan dogur (bolum sartini atlamaz —
     bolum liman degilse false doner). Autotest icin. */
  spawnGround(type, x, screenY) {
    const st = CONFIG.STAGES[this.stageIdx];
    if (!st.ground) return false;
    const u = this.groundPool.acquire();
    if (!u) return false;
    /* Ucuncu arguman EKRAN y'sidir (dogus anindaki). Onceki hali mutlak bir
       dunya ekseni bekliyordu: ayni deger bolumun basinda ekranda, 300 tick
       sonra ekranin 600 px ustunde dogurdugu icin olcum "menzilde degil"
       diyordu. Ekran y'si test icin tek dogal birim. */
    u.reset(type, x != null ? x : CONFIG.W / 2, screenY, this.city.dist);
    return true;
  },
  /* Test kancasi: tum kara hedeflerini temizle. */
  /* ------------------------------------------------- skimmer (round 17)
     Limanin deniz tarafindan gelen dusmani: YALNIZCA ground:true bolumde ve
     crossfade bittikten sonra dogar (kara hedefleriyle ayni kural — gecis
     sirasinda ekranda hala onceki sehir var). Dogus LCG ile deterministik. */
  _skimLcg() {
    this._skimSeed = (Math.imul(this._skimSeed || 1, 1664525) + 1013904223) >>> 0;
    return this._skimSeed / 4294967296;
  },
  _updateSkimmers(dt) {
    const S = CONFIG.SKIMMER;
    this.skimmerPool.forEach((k) => k.update(dt, this));
    const st = CONFIG.STAGES[this.stageIdx];
    if (!st.ground || this.city.fadeT < 1) return;
    if (this.bossState !== 'none') return;    // boss varken dogmaz
    let live = 0;
    this.skimmerPool.forEach((k) => { if (k.active) live++; });
    if (live >= S.maxConcurrent) return;
    this._skimmerT -= dt;
    if (this._skimmerT > 0) return;
    this._skimmerT = S.spawnIntervalMs / 1000;
    const dir = this._skimLcg() < 0.5 ? -1 : 1;
    const y = 120 + this._skimLcg() * (CONFIG.H * 0.55);
    const k = this.skimmerPool.acquire();
    if (k) k.reset(dir, y);
  },
  /* Test kancasi: skimmer dogur — liman disinda false doner. */
  spawnSkimmer() {
    if (!CONFIG.STAGES[this.stageIdx].ground) return false;
    const k = this.skimmerPool.acquire();
    if (!k) return false;
    const dir = this._skimLcg() < 0.5 ? -1 : 1;
    k.reset(dir, 260);
    return true;
  },
  clearGround() {
    this.groundPool.reset();
    this._groundBuiltUpTo = -1;
  },
  /* Round 16: kara hedefi etki carpanlarini her sim adiminda hesapla.
     enemyFireMul: radar sagken dusman ates araligi carpani (birden fazla
     radar varsa etki bir kez uygulanir, carpan ust uste binmez).
     fireSlowMul: jammer (kara veya hava) menzildeyken oyuncu birincil ates
     araligi carpani — ikisi ayni anda etkiliyse etki bir kez uygulanir.     */
  _computeFireMods() {
    const G = CONFIG.GROUND;
    // Radar: sagken enemyFireMul
    let radarAlive = false;
    this.groundPool.forEach((g) => {
      if (g.active && g.type === 'radar') radarAlive = true;
    });
    this.enemyFireMul = radarAlive ? G.types.radar.enemyFireMul : 1;
    // Jammer: kara veya hava — menzildeyse fireSlowMul (ikisi ayni anda: bir kez)
    let jammerInRange = false;
    this.groundPool.forEach((g) => {
      if (g.active && g.type === 'jammer' && g.inRange) jammerInRange = true;
    });
    if (!jammerInRange) {
      this.jammerPool.forEach((j) => {
        if (j.active && j.inRange) jammerInRange = true;
      });
    }
    this.fireSlowMul = jammerInRange ? G.types.jammer.fireSlowMul : 1;
  },
  /* Boss öldürüldüğünde (carpismadan cagrilir). */
  _onBossKilled() {
    const isCarrier = !this.boss && this.carrier.active;
    const cfg = isCarrier ? CONFIG.CARRIER : CONFIG.BOSS;
    /* Round 18: boss puan da kombo carpaniyla eklenir (boss oldurma bir oldurmadir). */
    if (!this.bossScored) { this._addComboScore(cfg.score); this.bossScored = true; }
    this.bossState = 'dying';
    this.bossDeathT = cfg.deathWindowMs / 1000;
    this.bossFlashT = cfg.flashMs / 1000;
    // Sarsinti: boss olumunde 500 ms
    this.shakeT = CONFIG.SHAKE.bossDeathMs / 1000;
    this.shakeDur = this.shakeT;
    this.shakeAmp = CONFIG.SHAKE.bossAmp;
  },
  /* Boss ölümü sonrası: bölüm geçişi veya VICTORY. */
  _afterBossDeath() {
    if (this.stageIdx < CONFIG.STAGES.length - 1) {
      this.stageIdx++;
      this.killsThisStage = 0;
      this.landmarkTriggered = false;
      this.stageTitleT = CONFIG.STAGE_TITLE_MS / 1000;
      const next = CONFIG.STAGES[this.stageIdx];
      this.city.setCity(next.city);   // crossfade (instant=false)
      this.sound.stageChange();
    } else {
      // bölüm 4 boss'u: VICTORY (kisa gecikmeyle)
      this._newRecord = this.score > this.bestScore;
      this.bestScore = Math.max(this.bestScore, this.score);
      this._savePersist();   // Round 20: kalici rekor (try/catch icinde)
      this.victoryT = 0.9;
      this.menuFadeT = 0;   // yumusak gecis
      this.sound.victory();
    }
  },
  /* Test kancasi: kota dolmus gibi boss uyarisini tetikle. */
  forceBoss() {
    if (this.bossState !== 'none') return;
    this.bossState = 'warn';
    this.bossWarnT = CONFIG.BOSS.warnMs / 1000;
    /* Round 18: boss girisi art arda oldurme serisini kesmesin — sureyi yenile. */
    if (this.comboCount > 0) this.comboT = CONFIG.COMBO.windowMs / 1000;
    this.sound.bossWarn();
  },
  /* Test kancasi: boss'u aninda oldur (olum sekansi baslar). */
  killBoss() {
    if (this.bossState !== 'active') return;
    if (this.carrier.active) {
      this.killCarrier();
      return;
    }
    if (!this.boss) return;
    this.boss.hp = 1;   // hit() bir kez dusursun -> 0
    const killed = this.boss.hit();
    if (killed) this._onBossKilled();
  },
  /* Test kancasi: tasici boss'un tum parcalarini ve govdesini yok eder,
     normal olum sekansini tetikler (ayri kod yolu degil — ayni _onBossKilled). */
  killCarrier() {
    if (this.bossState !== 'active' || !this.carrier.active) return;
    // Tum parcalari yok et (anten dahil — govde acilir)
    for (const id in this.carrier.parts) {
      this.carrier.parts[id].hp = 0;
      this.carrier.parts[id].alive = false;
    }
    // Govdeyi tek vurusla oldur: hitBullet ile ayni yol
    this.carrier.bodyHp = 1;
    const res = this.carrier.hitBullet(this.carrier.x, this.carrier.y, 3);
    if (res && res.type === 'bodyKilled') this._onBossKilled();
  },
  /* Round 15: cok asamali tasici boss — bolumden bagimsiz test kancasi.
     Mevcut boss/caller aktifse once devre disi birakilir. */
  spawnCarrier() {
    if (this.state !== 'play') return false;
    if (this.boss) this.boss.active = false;
    this.boss = null;
    this.bossScored = false;
    this.carrier.reset(this.stageIdx);
    this.bossState = 'active';
    return true;
  },
  /* Tasici boss sim adimi: guncelleme + parca patlama kontrolu.
     Parca dustukce o parcain saldirisi otomatik durur (units paketi
     update'te parcain alive bayragina bakar). */
  _updateCarrier(dt) {
    const C = CONFIG.CARRIER;
    this.carrier.update(dt, this);
    for (const id in this.carrier.parts) {
      const part = this.carrier.parts[id];
      if (part.alive) continue;
      if (part._exploded) continue;   // patlama zaten yapildi
      part._exploded = true;
      const off = C.partOffsets[id];
      this.fx.explode(this.carrier.x + off.x, this.carrier.y + off.y);
      this.sound.enemyDeath();
      this.shakeT = Math.max(this.shakeT, 0.2);
      this.shakeDur = this.shakeT;
      this.shakeAmp = Math.max(this.shakeAmp, 8);
    }
  },
  /* Sub-dron test kancalari (round 14): sub_drones kapisi icin.
     grantSubDrone: pu_subdrone kapsulunun ALINMA yoluyla ayni — iki kod yolu yok.
     launchSubDrones: Input.consumeSubLaunch bayragini tetikler, sim adimindaki
     _trySubLaunch calisir (is kilidi dahil). Autotest disinda da zararsiz. */
  grantSubDrone() {
    if (!this.player) return false;
    this.spawnPowerup('subdrone', this.player.x, this.player.y);
    this._updatePowerups(0);   // oyuncu uzerinde dogdu -> aninda alinir
    return true;
  },
  launchSubDrones() {
    if (this.state !== 'play') return false;
    this.input._subLaunchQueued = true;
    return true;
  },
  /* Round 18: kombo carpani — tiers/mults tablosundan turetilir.
     comboCount >= tiers[i] ise mults[i+1]. En ust tier'da maxMult.         */
  comboMult() {
    const C = CONFIG.COMBO;
    let m = C.mults[0];
    for (let i = 0; i < C.tiers.length; i++) {
      if (this.comboCount >= C.tiers[i]) m = C.mults[i + 1];
    }
    return Math.min(m, C.maxMult);
  },
  /* Kalo sure doldugunda sayaci siler. Her sim adiminda calisir; dt birikimi
     ile ilerler (deterministik). Sure bitince cagrilan oldurma yeni pencere acar. */
  _updateCombo(dt) {
    if (this.comboT > 0) {
      this.comboT -= dt;
      if (this.comboT <= 0) { this.comboT = 0; this.comboCount = 0; }
    }
  },
  /* Skor'u mevcut kombo carpaniyla ekler (boss puan dahil).               */
  _addComboScore(base) { this.score += base * this.comboMult(); },
  /* Düşman öldürüldüğünde çağrılır: kombo + kota. Kota dolunca BÖLÜM SONU
     BOSS'U tetiklenir (round 8) — bölüm geçişi artık boss ölünce olur.
     SKOR EKLEMEZ (skor _onEnemyKilled/_onSkimmerKilled'de carpanli eklenir). */
  _onKill() {
    /* Round 18: her oldurma komboyu besler + sureyi yeniler. Kara hedefi de
       kotaya sayilmaz ama bu yola girdigi icin komboyu besler. */
    this.comboCount += CONFIG.COMBO.step;
    this.comboT = CONFIG.COMBO.windowMs / 1000;
    /* Round 20: kosu istatistikleri (sim adiminda, dt birikimiyle) */
    this._stats.kills++;
    if (this.comboCount > this._stats.bestCombo) this._stats.bestCombo = this.comboCount;
    this.killsThisStage++;
    const st = CONFIG.STAGES[this.stageIdx];
    if (this.killsThisStage >= st.quota && this.bossState === 'none') {
      this.forceBoss();   // DIKKAT uyarisi -> boss giris
    }
  },
  /* ---------------------------------------------------- spawn yonetimi */
  _lcg() {
    this._spawnSeed = (Math.imul(this._spawnSeed, 1664525) + 1013904223) >>> 0;
    return this._spawnSeed / 4294967296;
  },
  _updateSpawn(dt) {
    this._spawnTimer -= dt * 1000;
    if (this._spawnTimer > 0) return;
    const st = CONFIG.STAGES[this.stageIdx];
    // eşzamanlı düşman sınırı (round 12: altı tipin hepsi sayilir)
    const activeCount = this.scoutPool.count() + this.gunnerPool.count() + this.shieldPool.count()
                      + this.bomberPool.count() + this.kamikazePool.count() + this.sniperPool.count();
    if (activeCount >= st.maxConcurrent) {
      this._spawnTimer = 200;   // kısa bekleme, tekrar dene
      return;
    }
    // spawn aralığı bölüm çarpanıyla
    this._spawnTimer = (CONFIG.SPAWN.base + this._lcg() * CONFIG.SPAWN.variance) * st.spawnMul;
    /* Round 12: tip karisimi bolume gore.
       1: scout+gunner | 2: +kamikaze | 3: +bomber | 4: +sniper ve hepsi */
    const r = this._lcg();
    let type, pool;
    if (this.stageIdx === 0) {
      // bölüm 1: scout + gunner
      if (r < 0.6) { type = 'scout'; pool = this.scoutPool; }
      else { type = 'gunner'; pool = this.gunnerPool; }
    } else if (this.stageIdx === 1) {
      // bölüm 2: + kamikaze
      if (r < 0.45) { type = 'scout'; pool = this.scoutPool; }
      else if (r < 0.75) { type = 'gunner'; pool = this.gunnerPool; }
      else { type = 'kamikaze'; pool = this.kamikazePool; }
    } else if (this.stageIdx === 2) {
      // bölüm 3: + bomber + jammer (round 15)
      if (r < 0.33) { type = 'scout'; pool = this.scoutPool; }
      else if (r < 0.52) { type = 'gunner'; pool = this.gunnerPool; }
      else if (r < 0.70) { type = 'kamikaze'; pool = this.kamikazePool; }
      else if (r < 0.85) { type = 'bomber'; pool = this.bomberPool; }
      else { type = 'jammer'; pool = this.jammerPool; }
    } else if (this.stageIdx === 3) {
      // bölüm 4: + sniper ve hepsi (jammer dahil)
      if (r < 0.26) { type = 'scout'; pool = this.scoutPool; }
      else if (r < 0.43) { type = 'gunner'; pool = this.gunnerPool; }
      else if (r < 0.56) { type = 'kamikaze'; pool = this.kamikazePool; }
      else if (r < 0.72) { type = 'bomber'; pool = this.bomberPool; }
      else if (r < 0.85) { type = 'jammer'; pool = this.jammerPool; }
      else { type = 'sniper'; pool = this.sniperPool; }
    } else {
      /* Round 16: bolum 5 (liman) — ayni karisim, kara hedefleri ayri havuzda */
      if (r < 0.26) { type = 'scout'; pool = this.scoutPool; }
      else if (r < 0.43) { type = 'gunner'; pool = this.gunnerPool; }
      else if (r < 0.56) { type = 'kamikaze'; pool = this.kamikazePool; }
      else if (r < 0.72) { type = 'bomber'; pool = this.bomberPool; }
      else if (r < 0.85) { type = 'jammer'; pool = this.jammerPool; }
      else { type = 'sniper'; pool = this.sniperPool; }
    }
    // x konumu: kenara yakın ağırlıklı
    const rx = this._lcg();
    let x;
    if (rx < 0.35) x = 30 + this._lcg() * 100;         // sol kenar
    else if (rx > 0.65) x = CONFIG.W - 130 + this._lcg() * 100; // sağ kenar
    else x = 80 + this._lcg() * (CONFIG.W - 160);       // orta
    this._spawnEnemy(type, x, -40, pool);
  },
  _spawnEnemy(type, x, y, pool) {
    /* Round 15: jammer — kendi sinifi/havuzu; Enemy tablosu yok. */
    if (type === 'jammer') {
      const j = this.jammerPool.acquire();
      if (!j) return null;
      j.reset(x, y);
      /* Round 22: jammer artik vurulabiliyor. Can Jammer sinifinda YOK (units);
         reset() onu temizlemedigi icin BURADA verilmeli — havuzdan yeniden
         alinan bir jammer aksi halde olu canla (0) doğar ve tek mermiyle
         duserdi. Units'e hp/hit() gelince bu satir oraya tasinir.           */
      if (typeof j.hit !== 'function') j.hp = CONFIG.JAMMER.hp;
      return j;
    }
    const pools = { scout: this.scoutPool, gunner: this.gunnerPool, shield: this.shieldPool,
                    bomber: this.bomberPool, kamikaze: this.kamikazePool, sniper: this.sniperPool };
    pool = pool || pools[type] || this.scoutPool;
    const e = pool.acquire();
    if (!e) return null;
    e.reset(type, x, y);
    // bölüm hız çarpanı (sniper speed=0 oldugu icin etki etmez)
    const st = CONFIG.STAGES[this.stageIdx];
    e.speed *= st.enemySpeedMul;
    return e;
  },
  /* Round 22: jammer test kancasi (autotest). Verilen konumda bir jammer dogurur.
     DIKKAT — olcum kosulu: Jammer.update kendi y'sini CONFIG.JAMMER.hoverY'ye
     (240) civiler, yani verilen y giris inisinden sonra gecersizdir (units
     paketi). Oyuncu H*0.78 = 624'te baslar; 200 px'lik jamming menzili bu iki
     nokta arasinda ASLA kapanmaz, dolayisiyla girdi verilmeyen bir kosumda
     inRange hic true olmaz ve ambient glitch olculemezdi. Kanca bu yuzden
     oyuncuyu menzil icine ceker — gercek oyunda oyuncunun yukari ucarak
     yaptigi seyin aynisi (y ~ 350 ekran icinde ve serbestce erisilebilir).
     inRange'i yine Jammer.update hesaplar; hicbir bayrak elle kurulmaz.     */
  spawnJammer(x, y) {
    const J = CONFIG.JAMMER;
    const j = this._spawnEnemy('jammer', x != null ? x : CONFIG.W / 2,
                                         y != null ? y : -40);
    if (!j) return null;
    const near = J.radius * 0.7;
    const dx = this.player.x - CONFIG.W / 2, dy = this.player.y - J.hoverY;
    if (dx * dx + dy * dy > near * near) {
      this.player.x = CONFIG.W / 2;                 // salinim merkezi
      this.player.y = J.hoverY + J.radius * 0.55;   // 240 + 110 = 350
      this.player.vx = 0; this.player.vy = 0;
    }
    return j;
  },
  _enemiesState() {
    const out = [];
    const push = (pool) => pool.forEach((e) => out.push({
      type: e.type, x: e.x, y: e.y, hp: e.hp, shieldHp: e.shieldHp, score: e.score,
      /* Round 12: yeni tip durum alanlari */
      locked: e.locked || false,
      lockX: e.lockX != null ? e.lockX : 0,
      telegraphing: e.telegraphing || false,
      telegraphX: e.telegraphX != null ? e.telegraphX : 0,
    }));
    push(this.scoutPool); push(this.gunnerPool); push(this.shieldPool);
    push(this.bomberPool); push(this.kamikazePool); push(this.sniperPool);
    return out;
  },
  /* ---------------------------------------------------- poweruplar (round 10) */
  _puLcg() {
    this._puSeed = (Math.imul(this._puSeed, 1664525) + 1013904223) >>> 0;
    return this._puSeed / 4294967296;
  },
  /* Dusman olumunda %12 pu_weapon, %8 pu_rocket, %6 pu_shield, %6 pu_subdrone,
     %5 pu_repair duser (tek LCG'den art arda — Math.random YOK).
     Round 18: onarim kutusu. Round 26 (F3): shield dali — HUD'daki KALKAN
     satiri gerceklesir. Zincirin sekli degittigi icin LCG akisi/sim ciktisi
     bilincli olarak farkli akar (altin iz sonradan senkronlanir). */
  _maybeDropPowerup(x, y) {
    const r = this._puLcg();
    const cW = CONFIG.WEAPON.dropChance, cR = CONFIG.ROCKET.dropChance;
    const cS = CONFIG.SHIELD.dropChance;
    const cD = CONFIG.HEAT.dropChanceSubdrone, cP = CONFIG.REPAIR.dropChance;
    if (r < cW) {
      this.powerups.push({ type: 'weapon', x, y, active: true });
    } else if (r < cW + cR) {
      this.powerups.push({ type: 'rocket', x, y, active: true });
    } else if (r < cW + cR + cS) {
      this.powerups.push({ type: 'shield', x, y, active: true });
    } else if (r < cW + cR + cS + cD) {
      this.powerups.push({ type: 'subdrone', x, y, active: true });
    } else if (r < cW + cR + cS + cD + cP) {
      this.powerups.push({ type: 'repair', x, y, active: true });
    }
  },
  /* Test kancasi: powerup dogrudan yerlestir. */
  spawnPowerup(type, x, y) {
    this.powerups.push({ type, x: x != null ? x : CONFIG.W / 2, y: y != null ? y : -30, active: true });
  },
  _updatePowerups(dt) {
    const W = CONFIG.WEAPON;
    for (const p of this.powerups) {
      if (!p.active) continue;
      p.y += W.fallSpeed * dt;
      if (p.y > CONFIG.H + 30) { p.active = false; continue; }
      // pickup: oyuncu ile mesafe
      const dx = p.x - this.player.x, dy = p.y - this.player.y;
      if (dx * dx + dy * dy < 30 * 30) {
        p.active = false;
        if (p.type === 'weapon') {
          if (this.weaponLevel < W.maxLevel) this.weaponLevel++;
          else this.score += W.overMaxScore;
        } else if (p.type === 'shield') {
          this.shieldT = W.shieldMs / 1000;
        } else if (p.type === 'rocket') {
          // Round 12: roket alindi — 15 sn boyunca ek silah
          this.rocketT = CONFIG.ROCKET.durationMs / 1000;
          this.rocketFireT = 0;
        } else if (p.type === 'subdrone') {
          /* Round 13: eksik sub-dron tamamlanir (en fazla SUBDRONE.max).
             Tam kapasitede alinca kucuk bonus puan — kapsul boşa gitmesin. */
          /* Orkestrator koprusu: 'units' ajani sub-dronlari Player.subs HAVUZUNDA
             tutarken 'game' ajani ayri bir Game.subDrones SAYACI tuttu — paralel
             calismanin klasik ayrisma hatasi. Canli olan havuz (guncellenen ve
             cizilen o); sayac hicbir zaman havuzu doldurmuyordu, bu yuzden kapsul
             alininca ekranda sub-dron belirmiyordu. Tek gercek kaynak havuzdur;
             sayac ondan turetilir. */
          if (this.player && this.player.addSub && this.player.addSub()) {
            this.subDrones = this.player.subs.count();
          } else {
            this.score += 100;   // tam kapasite: kapsul bosa gitmesin
          }
        } else if (p.type === 'repair') {
          /* Round 18: onarim kutusu — can dolu degilse heal, doluyse puan.
             Kisa yesil parlamasi HUD'da gosterilir (yalniz cizim). */
          const R = CONFIG.REPAIR;
          if (this.player.lives < R.maxLives) {
            this.player.lives = Math.min(R.maxLives, this.player.lives + R.heal);
          } else {
            this.score += R.score;
          }
          this.repairFlashT = 0.6;
        }
      }
    }
    this.powerups = this.powerups.filter((p) => p.active);
  },
  _drawPowerups(c) {
    for (const p of this.powerups) {
      if (!p.active) continue;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.3 + 0.15 * Math.sin(this.simTimeMs * 0.008);
      const col = p.type === 'weapon' ? 'rgba(255,200,60,1)' :
                  p.type === 'rocket' ? 'rgba(255,120,40,1)' :
                  p.type === 'subdrone' ? 'rgba(120,255,170,1)' :
                  p.type === 'repair' ? 'rgba(90,230,120,1)' : 'rgba(80,180,255,1)';
      c.strokeStyle = col;
      c.lineWidth = 2;
      c.beginPath(); c.arc(p.x, p.y, 22, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
      /* Round 18: onarim kutusu — manifest'te sprite YOK, prosedurel yesil hac. */
      if (p.type === 'repair') {
        c.fillStyle = '#5fe07a';
        const cx = p.x, cy = p.y, arm = 15, th = 7;
        c.fillRect(cx - th / 2, cy - arm, th, arm * 2);
        c.fillRect(cx - arm, cy - th / 2, arm * 2, th);
        c.restore();
        continue;
      }
      const spr = p.type === 'weapon' ? 'pu_weapon' :
                  p.type === 'rocket' ? 'pu_rocket' :
                  p.type === 'subdrone' ? 'pu_subdrone' : 'pu_shield';
      this.assets.draw(c, spr, p.x - 24, p.y - 24, 48, 48);
      c.restore();
    }
  },
  /* ---------------------------------------------------- roketler (round 12) */
  /* En yakin aktif dusmani sec: esitlikte en kucuk havuz indeksi (deterministik).
     Round 16: kara hedefleri de hedeflenebilir (roket onlari vurabilir). */
  _nearestEnemy() {
    const pools = [this.scoutPool, this.gunnerPool, this.shieldPool,
                   this.bomberPool, this.kamikazePool, this.sniperPool];
    let best = null, bestD = Infinity, bestIdx = Infinity;
    for (let pi = 0; pi < pools.length; pi++) {
      pools[pi].forEach((e, ei) => {
        if (!e.active) return;
        const d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
        if (d < bestD || (d === bestD && pi * 100 + ei < bestIdx)) {
          bestD = d; best = e; bestIdx = pi * 100 + ei;
        }
      });
    }
    /* Kara hedefleri — ekran konumu city.dist'ten turetilir */
    this.groundPool.forEach((g, gi) => {
      if (!g.active) return;
      const sy = g.screenY(this.city);
      const d = Math.hypot(g.x - this.player.x, sy - this.player.y);
      if (d < bestD || (d === bestD && 1000 + gi < bestIdx)) {
        bestD = d; best = g; bestIdx = 1000 + gi;
      }
    });
    return best;
  },
  /* Roket atis + gait + carpisma. rocketT > 0 iken her sim adiminda calisir. */
  _updateRockets(dt) {
    const R = CONFIG.ROCKET;
    // Atis zamanlayicisi
    this.rocketFireT -= dt;
    if (this.rocketFireT <= 0) {
      const target = this._nearestEnemy();
      if (target) {
        const rk = this.rocketPool.acquire();
        if (rk) {
          rk.reset(this.player.x, this.player.y - this.player.hitR(), target);
          this.rocketFireT = R.fireMs / 1000;
          /* Round 13: her roket isisi harcar (CONFIG.HEAT.cost.rocket) */
          this._addHeat(CONFIG.HEAT.cost.rocket);
        }
      } else {
        this.rocketFireT = 0;   // hedef yoksa hemen tekrar dene
      }
    }
    // Gait + ilerleme + carpisma
    this.rocketPool.forEach((rk) => {
      if (!rk.active) return;
      rk.update(dt, this);
      // Hedef ile carpisma (hasar 3)
      if (rk.target && rk.target.active) {
        /* Round 16: kara hedefi — ekran y'si city.dist'ten turetilir, hitbox kare */
        const isGround = rk.target.type === 'radar' || rk.target.type === 'aa' || rk.target.type === 'jammer';
        let tx = rk.target.x, ty;
        if (isGround) {
          ty = rk.target.screenY(this.city);
          const hw = rk.target.w / 2 + 10, hh = rk.target.h / 2 + 10;
          const dx = rk.x - tx, dy = rk.y - ty;
          if (Math.abs(dx) <= hw && Math.abs(dy) <= hh) {
            rk.active = false;
            for (let i = 0; i < R.damage; i++) {
              if (!rk.target.active) break;
              const killed = rk.target.hit(1);
              if (killed) this._onGroundKilled(rk.target);
            }
            this.fx.explode(rk.x, rk.y);
            this.sound.enemyDeath();
          }
        } else {
          ty = rk.target.y;
          const dx = rk.x - tx, dy = rk.y - ty;
          const rr = 10 + rk.target.radius;
          if (dx * dx + dy * dy <= rr * rr) {
            rk.active = false;
            for (let i = 0; i < R.damage; i++) {
              if (!rk.target.active) break;
              const killed = rk.target.hit();
              if (killed) this._onEnemyKilled(rk.target);
            }
            this.fx.explode(rk.x, rk.y);
            this.sound.enemyDeath();
          }
        }
      }
    });
  },
  /* ---------------------------------------------------- isisi + sub-dronlar (round 13) */
  /* Isisi ekle; limit dolunca asiri sicaklik kilidi acilir.
     Dash bu metodu cagririr (Player paketi), roket/subLaunch buradan. */
  _addHeat(n) {
    const H = CONFIG.HEAT;
    this.heat = Math.min(H.max, this.heat + n);
    if (this.heat >= H.overheatAt) this.overheated = true;
  },
  /* Sub-dron firlatma: Input.consumeSubLaunch() bayragi tetikler.
     SARTLAR: en az 1 sub-dron + isisi yetiyor + kilit yok.
     Kamikaze mermi: oyuncunun ustunden yukari, 520 px/s, dusmanlari eritir. */
  _trySubLaunch() {
    const H = CONFIG.HEAT, S = CONFIG.SUBDRONE;
    if (this.subDrones <= 0 || this.overheated || this.heat > H.max - H.cost.subLaunch) {
      this.subLaunchFailT = 0.6;   // HUD'da kisa uyarı yanip sonegi
      return;
    }
    this.subDrones--;
    this._addHeat(H.cost.subLaunch);
    const p = this.player;
    const b = this.bulletPool.acquire();
    if (!b) return;
    b.reset(p.x, p.y - p.hitR());
    b.vy = -S.launchSpeed;
    b.life = S.life;
    this.sound.enemyShot();
  },
});

/* ---- src/game/Game.collide.js ---- */
/* game paketi — carpisma cozumleri + hasar/skor sonuclari.
   Round 17: Game.js'ten birebir tasinan metotlar; davranis DEGISMEDI. */
Object.assign(Game.prototype, {
  /* Round 18: skor baloncugu — kazanilan puan olum yerinde yukselir. Renk
     kombo tier'ina gore isinir, boylece carpanin ise yaradigi EKRANDA gorunur. */
  _scorePop(x, y, base) {
    const C = CONFIG.COMBO;
    const m = this.comboMult();
    const tier = Math.max(0, C.mults.indexOf(m));
    this.fx.scorePop(x, y, '+' + (base * m), tier);
  },
  /* Dusman oldurme (roket/mermi ortak): skor + kota + patlama + powerup.
     Round 18: SKOR KOMBO CARPANIYLA eklenir (once carpanli skor, sonra _onKill
     sayaci besler — Boylece bu oldurma kendi katkisiyla artan carpani GORMEZ). */
  /* Round 22: enkaz tohumu icin ADLI LCG akisi. Her olumde yeni bir LCG
     kurulmaz (o zaman ayni konumda olen iki dron ayni sekilde savrulurdu ve
     akis kare hizina gore kayabilirdi); tek akis sirayla ilerler.
     Math.random YASAK — determinizm sozlesmesi.                            */
  _wreckLcg() {
    this._wreckSeed = (Math.imul(this._wreckSeed, 1664525) + 1013904223) >>> 0;
    return this._wreckSeed;
  },
  _onEnemyKilled(e) {
    e.active = false;
    this._addComboScore(e.score);
    this._scorePop(e.x, e.y, e.score);
    this._onKill();
    /* Round 22: olum geri bildirimi UC KATMANLI patlamadir (round 6: flash +
       fire + smoke); enkaz onun yerine gecmez, USTUNE gelir. Patlama olum
       ANINDA calar, govde donerek suzulur, omru dolunca bir kez daha patlar.
       Ilk yazimda patlamayi yalnizca "enkaz havuzu dolu" daline koymustum:
       normal olum tek kivilcima dustu ve explosion_layers kapisi (uc katmanin
       da cizilmesi) kirmiziya dondu — vurusun tokati da kayboldu.
       Havuz basincı ARTMAZ: olum basina patlama sayisi round 21'deki gibi bir
       tanedir, ayrica kivilcim vurusu (fx.hit) EKLENMEZ — explode zaten
       CONFIG.FX.sparksPerExplosion kadar kivilcim atar.                     */
    this.fx.explode(e.x, e.y);
    /* Enkaz havuzu (12 slot) doluysa geri bildirim yine TAM: patlama calisti,
       yalnizca dusen govde eksik kalir — sessiz olum yok. */
    this.fx.spawnWreck(e.x, e.y, e.sprite, this._wreckLcg());
    this._maybeDropPowerup(e.x, e.y);
    this.sound.enemyDeath();
    this.hitstopT = Math.max(this.hitstopT, CONFIG.HITSTOP.enemyMs / 1000);
  },
  /* Round 16: kara hedefi oldurme — skor + patlama + ses.
     KOTAYA SAYILMAZ (kota hava dusmanlariyla dolar). Powerup DUSMEZ.
     Round 18: komboyu BESLER (oldurma oldurmadir) ama kotaya girmez. */
  _onGroundKilled(g) {
    g.active = false;
    this._addComboScore(g.score);
    /* Komboyu besle ama kotayi doldurma: _onKill'deki killsThisStage++ atilir. */
    this.comboCount += CONFIG.COMBO.step;
    this.comboT = CONFIG.COMBO.windowMs / 1000;
    const sy = g.screenY(this.city);
    this._scorePop(g.x, sy, g.score);
    this.fx.explode(g.x, sy);
    /* Round 17: zeminde kalan is izi — zemine civili (y0/spawnDist modeli). */
    this.fx.spawnScorch(g.x, sy, this.city.dist);
    this.sound.groundDeath ? this.sound.groundDeath() : this.sound.enemyDeath();
  },
  /* Round 17: skimmer olumu — hava dusmani, bolum kotasina SAYILIR.
     Round 18: skor carpanli eklenir (once skor, sonra _onKill). */
  _onSkimmerKilled(k) {
    k.active = false;
    this._addComboScore(k.score);
    this._scorePop(k.x, k.y, k.score);
    this.fx.explode(k.x, k.y);
    this.sound.enemyDeath();
    this._onKill();
  },
  /* ---------------------------------------------------- carpisma */
  _collidePlayerBullets() {
    const BR = 3;   // oyuncu mermisi yaricapi
    this.bulletPool.forEach((b) => {
      if (!b.active) return;
      /* Round 15: tasici boss carpismasi — parcalar -> govde (units paketi). */
      if (this.bossState === 'active' && this.carrier.active) {
        const res = this.carrier.hitBullet(b.x, b.y, BR);
        if (res) {
          b.active = false;
          this._stats.hits++;   // Round 20: isabet sayaci
          if (res.type === 'bodyKilled') {
            this._onBossKilled();
            this.sound.enemyDeath();
            this.hitstopT = Math.max(this.hitstopT, CONFIG.HITSTOP.bossMs / 1000);
          } else {
            this.fx.hit(b.x, b.y);
            this.sound.hit();
          }
          return;
        }
      }
      // boss carpismasi (yalnizca aktifken) — once dusmanlara bakilir
      if (this.bossState === 'active' && this.boss) {
        const dx = b.x - this.boss.x, dy = b.y - this.boss.y;
        const rr = BR + CONFIG.BOSS.radius;
        if (dx * dx + dy * dy <= rr * rr) {
          b.active = false;
          this._stats.hits++;   // Round 20: isabet sayaci
          const killed = this.boss.hit();
          if (killed) {
            this._onBossKilled();
            this.sound.enemyDeath();
            this.hitstopT = Math.max(this.hitstopT, CONFIG.HITSTOP.bossMs / 1000);
          } else {
            this.fx.hit(b.x, b.y);
            this.sound.hit();
          }
          return;
        }
      }
      /* Round 16: kara hedefleri — oyuncu mermisi hasar verir; kotaya SAYILMAZ.
         Oyuncu govdesi kara hedefiyle carpismaz (cagirmak yok). */
      {
        let gHit = false;
        this.groundPool.forEach((g) => {
          if (gHit || !g.active) return;
          const G = CONFIG.GROUND;
          const sy = g.screenY(this.city);
          const hw = g.w / 2 - G.hitPad, hh = g.h / 2 - G.hitPad;
          if (b.x >= g.x - hw && b.x <= g.x + hw &&
              b.y >= sy - hh && b.y <= sy + hh) {
            b.active = false;
            this._stats.hits++;   // Round 20: kara hedefine isabet
            const killed = g.hit(1);
            if (killed) this._onGroundKilled(g);
            else { this.fx.hit(b.x, b.y); this.sound.groundHit ? this.sound.groundHit() : this.sound.hit(); }
            gHit = true;
          }
        });
        if (gHit) return;
      }
      /* Round 17: skimmer — oyuncu mermisi hasar verir, olunce kotaya sayilir. */
      {
        let kHit = false;
        this.skimmerPool.forEach((k) => {
          if (kHit || !k.active) return;
          const dx = b.x - k.x, dy = b.y - k.y;
          if (dx * dx + dy * dy <= (k.radius + BR) * (k.radius + BR)) {
            b.active = false;
            this._stats.hits++;   // Round 20: isabet sayaci
            kHit = true;
            if (k.hit(1)) this._onSkimmerKilled(k);
            else { this.fx.hit(b.x, b.y); this.sound.hit(); }
          }
        });
        if (kHit) return;
      }
      /* Round 22: JAMMER — havuz taramasinda hic yoktu, yani dron olumsuzdu.
         Oyuncu mermisi artik hasar verir; can bitince normal olum yolundan
         (skor + kota + kombo + enkaz) duser.                                */
      {
        let jHit = false;
        this.jammerPool.forEach((j) => {
          if (jHit || !j.active) return;
          const r = this._jammerHitR(j) + BR;
          const dx = b.x - j.x, dy = b.y - j.y;
          if (dx * dx + dy * dy <= r * r) {
            b.active = false;
            this._stats.hits++;   // Round 20: isabet sayaci
            jHit = true;
            this._hitJammer(j, b.x, b.y);
          }
        });
        if (jHit) return;
      }
      /* Round 12: alti tipin hepsi (scout/gunner/shield/bomber/kamikaze/sniper) */
      for (const pool of [this.scoutPool, this.gunnerPool, this.shieldPool,
                          this.bomberPool, this.kamikazePool, this.sniperPool]) {
        let hit = false;
        pool.forEach((e) => {
          if (hit || !e.active) return;
          const dx = b.x - e.x, dy = b.y - e.y;
          const rr = BR + e.radius;
          if (dx * dx + dy * dy <= rr * rr) {
            b.active = false;
            this._stats.hits++;   // Round 20: isabet sayaci
            const killed = e.hit();
            if (killed) {
              this._onEnemyKilled(e);   // skor + kota + patlama + powerup
            } else {
              e.hitFlash = CONFIG.FX.hitFlashMs / 1000;  // beyaz tint parlamasi
              this.fx.hit(b.x, b.y);           // kucuk kivilcim vurusu
              this.sound.hit();
            }
            hit = true;
          }
        });
        if (hit) break;
      }
    });
  },
  _collideEnemyBullets() {
    const ER = 5;   // dusman mermisi yaricapi
    const PR = 16;  // oyuncu yaricapi
    if (this.player.invincible > 0) return;
    this.ebulletPool.forEach((b) => {
      if (!b.active) return;
      const dx = b.x - this.player.x, dy = b.y - this.player.y;
      const rr = ER + PR;
      if (dx * dx + dy * dy <= rr * rr) {
        b.active = false;
        // Kalkan aktifse hasari em (round 10)
        if (this.shieldT > 0) {
          this.fx.hit(b.x, b.y);
          return;
        }
        this._damagePlayer('düşman mermisi');
      }
    });
  },
  /* Round 22: oyuncu hasarinin TEK yolu. Once bu blok yalnizca dusman mermisi
     carpismasinin icinde gomuluydu; disaridan (test kancasi, baska bir hasar
     kaynagi) ayni sonuclari uretmenin yolu yoktu. Sinyal bozulmasi (glitch)
     de burada tetiklenir — sarsinti + ses vardi ama glitch hic cagrilmiyordu.
     Donus: gercekten hasar alindi mi (dokunulmazlik/dash sirasinda false).  */
  _damagePlayer(cause) {
    if (!this.player.takeHit()) return false;
    /* Round 18: oyuncu hasar alinca kombo ANINDA sifirlanir. */
    this.comboCount = 0; this.comboT = 0;
    /* Round 12: silah seviyesi DOGRUDAN 1'e dustur (kademeli degil) +
       roket suresi sifirlanir + HUD'da SİLAH 1 yanip soner. */
    this.weaponLevel = 1;
    this.rocketT = 0;
    this.weaponFlashT = CONFIG.WEAPON.resetFlashMs / 1000;
    /* Round 13: bir sub-dron kaybedilir (gövde hasarıyla birlikte). */
    if (this.subDrones > 0) this.subDrones--;
    // Sarsinti: oyuncu hasar alinca 260 ms
    this.shakeT = CONFIG.SHAKE.playerHitMs / 1000;
    this.shakeDur = this.shakeT;
    this.shakeAmp = CONFIG.SHAKE.playerAmp;
    /* Round 22: sinyal bozulmasi — kamera sarsintisi FIZIKSEL darbeyi anlatir,
       glitch YAYINDA olan bozulmayi. Ambient (jammer) glitch'ten daha guclu ve
       uzun; FxSystem ikisini toplayip glitchMaxCap'te kirpar. Yalniz cizim. */
    this.fx.glitch(CONFIG.FEEDBACK.damageGlitchMs, CONFIG.FEEDBACK.damageGlitchAmp);
    this.sound.hit();
    if (this.player.lives <= 0) {
      /* Round 20: bitis TEK yoldan (_gameOver) — rekor orada kalicilasir. */
      this._gameOver(cause || 'düşman');
    }
    return true;
  },
  /* ----------------------------------------------- Round 22: jammer hasari */
  /* Jammer'in govde yaricapi. CONFIG.JAMMER.radius jamming MENZILIDIR (200 px),
     hitbox degil — onunla carpisma yazilsa ekranin dortte birine dokunan mermi
     jammer'i vururdu. Units'e hitbox/hp gelirse buradaki yedek dusurulmeli. */
  _jammerHitR(j) {
    if (j && typeof j.hitR === 'function') return j.hitR();
    return CONFIG.FEEDBACK.jammerHitR;
  },
  /* Bir mermilik hasar. Jammer sinifinda (units) hp/hit() YOK; can burada,
     CONFIG.JAMMER.hp'den (core, 4) tembel olarak baslatilir. Units'e hit()
     eklenince bu dal kendiliginden ona devreder (reports/requests/game.md). */
  _hitJammer(j, x, y) {
    let killed;
    if (typeof j.hit === 'function') {
      killed = j.hit(1);
    } else {
      if (typeof j.hp !== 'number') j.hp = CONFIG.JAMMER.hp;
      j.hp--;
      killed = j.hp <= 0;
    }
    if (killed) { this._onJammerKilled(j); return true; }
    /* Beyaz tint parlamasi YOK: Jammer.draw hitFlash okumuyor (units). Okumayan
       bir alani doldurmak tam da bu turun temizledigi olu yazim olurdu. */
    this.fx.hit(x != null ? x : j.x, y != null ? y : j.y);
    this.sound.hit();
    return false;
  },
  /* Jammer olumu: hava dusmani — kotaya SAYILIR, komboyu besler, enkaz birakir.
     `_jammersKilled` YALNIZCA burada artar: ekrandan cikip devre disi kalan
     jammer dusurulmus sayilmaz, yoksa kapi olumsuz bir dronu yesil gosterirdi. */
  _onJammerKilled(j) {
    j.active = false;
    this._jammersKilled++;
    const score = CONFIG.JAMMER.score;
    this._addComboScore(score);
    this._scorePop(j.x, j.y, score);
    this._onKill();
    /* Diger hava olumleriyle ayni: once uc katmanli patlama, ustune enkaz. */
    this.fx.explode(j.x, j.y);
    this.fx.spawnWreck(j.x, j.y, 'drone_jammer', this._wreckLcg());
    this._maybeDropPowerup(j.x, j.y);
    this.sound.enemyDeath();
    this.hitstopT = Math.max(this.hitstopT, CONFIG.HITSTOP.enemyMs / 1000);
    /* Menzildeki jammer dustu: ambient glitch bir sonraki sim adiminda
       _updateJammerFx tarafindan zaten kapatilir — burada elle sifirlanmaz. */
  },
  /* ------------------------------------------- Round 22: autotest kancalari */
  /* Hepsi NORMAL yollardan gecer: kanca kendi olum/hasar kodunu yazmaz.     */
  /* En yakin aktif dusmani (alti hava tipi) oldurur. Canini bitirmek icin
     e.hit() tekrar tekrar cagrilir — kalkanli dron da boylece duser.        */
  killNearestEnemy() {
    let best = null, bestD = Infinity;
    for (const pool of [this.scoutPool, this.gunnerPool, this.shieldPool,
                        this.bomberPool, this.kamikazePool, this.sniperPool]) {
      pool.forEach((e) => {
        const dx = e.x - this.player.x, dy = e.y - this.player.y;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = e; }
      });
    }
    if (!best) return false;
    for (let i = 0; i < 64; i++) {
      if (best.hit()) { this._onEnemyKilled(best); return true; }
    }
    return false;
  },
  /* Oyuncuya bir hasar uygular (normal hasar yolu). Dokunulmazlik/dash
     sirasinda false doner — kanca bunu DELMEZ, gercek oyundaki kural gecerli. */
  damagePlayer() { return this._damagePlayer('düşman'); },
  /* En yakin jammer'a bir mermilik hasar uygular. */
  killNearestJammer() {
    let best = null, bestD = Infinity;
    this.jammerPool.forEach((j) => {
      const dx = j.x - this.player.x, dy = j.y - this.player.y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = j; }
    });
    if (!best) return false;
    return this._hitJammer(best, best.x, best.y);
  },
});

/* ---- src/game/Game.hud.js ---- */
/* game paketi — HUD, bolum karti, menu/duraklat/gameover/zafer cizimleri.
   Round 17: Game.js'ten birebir tasinan metotlar; davranis DEGISMEDI. */
Object.assign(Game.prototype, {
  _render(alpha) {
    const r = this.renderer, c = r.ctx;
    r.begin();
    this._renderTo(c, alpha);
    r.debugOverlay({ fps: this.fps, frameMs: this.frameMs, player: this.player, bulletsActive: this.bulletPool.count(), enemies: this._enemiesState(), score: this.score });
  },
  /* Sahneyi verilen ctx'ye cizer (debug overlay YOK). screenshot() bunu
     yukey cozunurlukte bir offscreen canvas'a cagirmak icin kullanir.        */
  _renderTo(c, alpha) {
    if (this.state === 'menu') { this._drawMenu(c); }
    else if (this.state === 'shipselect') { this._drawShipSelect(c); }
    else if (this.state === 'play' || this.state === 'pause') {
      if (!this.player) return;   // boot: oyuncu yokken cizim atla (hata uretmesin)
      this._drawWorld(c, alpha);
      if (this.state === 'pause') this._drawPause(c);
    }
    else if (this.state === 'gameover' || this.state === 'victory') { this._drawEnd(c); }
  },
  /* =================================================================== UI TEMELI
     Round 24. Arayuzun tamami CANLI KAYAN SEHRIN uzerine ciziliyor, yani
     okunurluk o an arkada ne oldugunun fonksiyonuydu: ayni ekran bir karede
     okunuyor, digerinde kayboluyordu. Olculdu (yazinin ARKASINDAKI medyan
     parlaklik, bes kaydirma konumunda) — menu yayilim 8, pause 24, bolum karti
     38 (tepe 53: kart parlak koprunun uzerine denk gelince baslik ve amblem
     gorunmez oluyordu).

     Sebep yumusak radyal perdeydi: EKRAN KENARINDA sifira iniyor, olcum bandi
     ise tam genislik. Yani perde tam da lazim oldugu yerde yoktu.

     Bundan sonra her arayuz blogu su uc parcadan kurulur:
       _uiPlate   — tam genislikte, cekirdegi neredeyse mat levha (okunurluk)
       _uiRule    — blogun sinirini gosteren, uclarda sonen ince hat (yapi)
       _uiTracked / _uiRow / _uiStat / _uiPips — hiyerarsi
     Okunurluk artik CIZIMIN ozelligi; arka planin tesadufu degil.
     Hepsi yalnizca cizimdir: sim durumuna dokunmaz, `performance.now()` sadece
     hareket icin okunur (AGENTS.md: saat yalniz cizimde).                     */

  /* Tam genislikte koyu levha. y0..y1 CEKIRDEK (tam alfa); ust ve altinda
     `feather` kadar yumusama var, boylece dikdortgen gibi yapismaz ama
     cekirdek icinde sizinti sabittir: (1 - alfa). */
  _uiPlate(c, y0, y1, alpha, feather) {
    const U = CONFIG.UI;
    const f = (feather == null) ? U.plateFeather : feather;
    const a = (alpha == null) ? U.plateAlpha : alpha;
    const gy0 = y0 - f, gy1 = y1 + f, span = gy1 - gy0;
    if (span <= 0) return;
    const s0 = f / span, col = U.plateRGB;
    const g = c.createLinearGradient(0, gy0, 0, gy1);
    g.addColorStop(0, `rgba(${col},0)`);
    // yariyolda alfanin ~%22'si: dogrusal yerine yumusak giris (ease)
    g.addColorStop(s0 * 0.5, `rgba(${col},${(a * 0.22).toFixed(3)})`);
    g.addColorStop(s0, `rgba(${col},${a.toFixed(3)})`);
    g.addColorStop(1 - s0, `rgba(${col},${a.toFixed(3)})`);
    g.addColorStop(1 - s0 * 0.5, `rgba(${col},${(a * 0.22).toFixed(3)})`);
    g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g;
    c.fillRect(0, gy0, CONFIG.W, span);
  },
  /* Ortada parlak, uclarda sonen 1 px yatay hat. Blok sinirini gosterir ama
     perdeye kalinlik katmaz (dolayisiyla olcume girmez). */
  _uiRule(c, cx, y, halfW, alpha, rgb) {
    if (halfW <= 0) return;
    const col = rgb || CONFIG.UI.accentRGB;
    const g = c.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    g.addColorStop(0, `rgba(${col},0)`);
    g.addColorStop(0.5, `rgba(${col},${alpha})`);
    g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g;
    c.fillRect(cx - halfW, y, halfW * 2, 1);
  },
  /* Harf araligi verilmis ortalanmis yazi (kicker/etiket dili). Canvas'in
     `letterSpacing` ozelligi her motorda yok; yazi tipi monospace oldugu icin
     elle dizmek birebir ayni sonucu verir. Menu cizimi — sicak dongu degil. */
  _uiTracked(c, text, cx, y, spacing) {
    const cw = c.measureText('M').width;
    const step = cw + spacing;
    const n = text.length;
    let x = cx - (n * step - spacing) / 2 + cw / 2;
    const prev = c.textAlign;
    c.textAlign = 'center';
    for (let i = 0; i < n; i++) { c.fillText(text[i], x, y); x += step; }
    c.textAlign = prev;
  },
  /* Etiket sol / deger sag — oyun sonu tablosunun dili. Artik duraklatma
     ekrani da ayni satiri kullaniyor (tek tipografi dili). */
  _uiRow(c, label, val, cx, y, rw, valCol) {
    c.textAlign = 'left';
    c.fillStyle = CONFIG.UI.muted;
    c.fillText(label, cx - rw / 2, y);
    c.textAlign = 'right';
    c.fillStyle = valCol || '#ffffff';
    c.fillText(val, cx + rw / 2, y);
    c.textAlign = 'center';
  },
  /* Ozellik cubugu: dort dronu ayni olcege oturtur, boylece sayilari
     okumak yerine UZUNLUK karsilastirilir. */
  _uiStat(c, label, val, frac, col, y) {
    const cx = CONFIG.W / 2, rw = 262;
    const bx = cx - rw / 2 + 64, bw = rw - 64 - 58;
    c.textAlign = 'left';
    c.font = '13px monospace';
    c.fillStyle = CONFIG.UI.muted;
    c.fillText(label, cx - rw / 2, y + 4);
    c.fillStyle = 'rgba(255,255,255,0.10)';
    c.fillRect(bx, y - 3, bw, 6);
    c.fillStyle = col;
    c.fillRect(bx, y - 3, bw * Math.max(0.05, Math.min(1, frac)), 6);
    c.textAlign = 'right';
    c.font = 'bold 13px monospace';
    c.fillStyle = '#ffffff';
    c.fillText(String(val), cx + rw / 2, y + 4);
    c.textAlign = 'center';
  },
  /* Can: sayi yerine nokta dizisi — "kac can" bir bakista okunur. */
  _uiPips(c, label, val, max, y) {
    const cx = CONFIG.W / 2, rw = 262;
    const bx = cx - rw / 2 + 64;
    c.textAlign = 'left';
    c.font = '13px monospace';
    c.fillStyle = CONFIG.UI.muted;
    c.fillText(label, cx - rw / 2, y + 4);
    for (let i = 0; i < max; i++) {
      c.beginPath(); c.arc(bx + 8 + i * 20, y, 5, 0, Math.PI * 2);
      c.fillStyle = i < val ? `rgb(${CONFIG.UI.accentRGB})` : 'rgba(255,255,255,0.13)';
      c.fill();
    }
    c.textAlign = 'right';
    c.font = 'bold 13px monospace';
    c.fillStyle = '#ffffff';
    c.fillText(String(val), cx + rw / 2, y + 4);
    c.textAlign = 'center';
  },
  /* Kose yuvarlatilmis yol. `ctx.roundRect` her motorda yok; arcTo her yerde
     var ve tahsis yapmaz. */
  _uiRoundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  },
  /* Onizleme kaidesi: yumusak cyan hale + ince halka. Amblem ve dron
     siluetleri KOYU (olculdu: landmark medyan parlakligi 40..124) — mat
     levhanin uzerinde kaybolmasinlar diye arkadan aydinlatiliyorlar.
     Bolum kartinda amblemin gorunmemesinin ikinci sebebi buydu. */
  _uiPedestal(c, cx, cy, r, alpha) {
    const rgb = CONFIG.UI.accentRGB;
    const g = c.createRadialGradient(cx, cy, r * 0.10, cx, cy, r);
    g.addColorStop(0, `rgba(${rgb},${alpha.toFixed(3)})`);
    g.addColorStop(0.55, `rgba(${rgb},${(alpha * 0.42).toFixed(3)})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
    c.strokeStyle = `rgba(${rgb},0.26)`;
    c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, r * 0.94, 0, Math.PI * 2); c.stroke();
  },
  /* Kaidenin cevresinde donen iki kisa yay — "canli tarama" hissi.
     Rotor yaylarinin YERINE gecmez: eskiden yalniz falcon'un merkezleri
     tanimliydi ve diger uc dronun onizlemesinde rotor spin hic cizilmiyordu.
     Round 26 (F8) ile dort dronun merkezleri de CONFIG.ROTOR.centers'ta;
     bu halka yine de sprite geometrisinden BAGIMSIZ oldugu icin dort dronda
     da ayni calisir ve govdeye sahte yay cizmez. */
  _uiScanRing(c, cx, cy, r, speed) {
    const a = performance.now() * 0.0009 * (speed || 1);
    c.save();
    c.strokeStyle = `rgba(${CONFIG.UI.accentRGB},0.7)`;
    c.lineWidth = 2;
    c.lineCap = 'round';
    c.beginPath(); c.arc(cx, cy, r, a, a + Math.PI * 0.32); c.stroke();
    c.beginPath(); c.arc(cx, cy, r, a + Math.PI, a + Math.PI * 1.16); c.stroke();
    c.restore();
  },
  /* Oyunici HUD satirinin tek yazi yardimcisi (round 26, F11): once koyu
     golge (+2 px), ustune renkli metin. SKOR/SİLAH/KALKAN/ROKET zaten bu
     dili kullaniyordu; ISI YETMİYOR, JAMMER MENZİLİ ve kombo rozeti golgesiz
     kalmisti — parlak karo ustunde okunurluk ayni olcutu hak eder.
     Yalnizca cizim; font/align cagiranin kontrolunde kalir. */
  _uiHudText(c, text, x, y, col) {
    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillText(text, x + 2, y + 2);
    c.fillStyle = col;
    c.fillText(text, x, y);
  },
  /* Round 27: oyunici HUD plakasi — menulerin tam genislik _uiPlate'i oyun
     alaninda KULLANILAMAZ (ekrani karartma yasagi). Bunun yerine metin
     blokunun arkasina KUCUK, kenarlari yumusayan bir levha cizilir.

     Kenar yumusamasi golge/blur ile DEGIL, edgePasses katmanli roundRect ile
     yapilir: her katman bir oncekinden `feather/n` kadar tastir ve katman
     alfasi l = 1-(1-alpha)^(1/n) secilir, boylece CEKIRDEKTE toplam alfa
     tam olarak `alpha` olur (blur'lu golge cekirdegi tahmin edilemez sekilde
     inceltir ve canvas golge ofseti olcek donusumunden etkilenir).
     Yalnizca cizim; tahsis yok (roundRect arcTo ile cizilir). */
  _uiHudPlate(c, x, y, w, h, o) {
    const U = CONFIG.UI, P = U.hudPlate;
    const a = (o && o.alpha != null) ? o.alpha : P.alpha;
    const n = (o && o.edgePasses) || P.edgePasses;
    const f = (o && o.feather != null) ? o.feather : P.feather;
    const r = (o && o.radius != null) ? o.radius : P.radius;
    if (w <= 0 || h <= 0) return;
    const d = f / n;
    const l = 1 - Math.pow(1 - a, 1 / n);
    for (let i = n; i >= 1; i--) {
      const e = (i - 0.5) * d;
      c.fillStyle = `rgba(${U.plateRGB},${l.toFixed(4)})`;
      this._uiRoundRect(c, x - e, y - e, w + 2 * e, h + 2 * e, r + e);
      c.fill();
    }
  },
  /* ====================================================================== */
  /* Round 12: dron secim ekranı. Acik dronlar parlak + badge; kilitliler
     soluk cizim + acilis sart yazisi. Sol/sag ucte bir gezinir, orta baslatir.
     Round 24: dort dron 120 px'lik sutunlara sikismis durumdaydi ("Hız 400",
     "Can 3", tanim, kilit sarti hepsi ust uste). Duzen KAHRAMAN + SERIT'e
     cevrildi: secili dron buyuk, ozellikleri ayni olcege oturan cubuklarla;
     dort dron altta kucuk secim seridinde. Girdi modeli DEGISMEDI — sol/sag
     ucte bir gezinir, orta baslatir (touch_drone_select bunu olcuyor). */
  _drawShipSelect(c) {
    const U = CONFIG.UI, W = CONFIG.W, H = CONFIG.H;
    c.save();
    c.globalAlpha = this.menuFadeT;
    this.assets.draw(c, 'city_istanbul', 0, 0, W, H);
    const bg = c.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, `rgba(${U.plateRGB},0.76)`);
    bg.addColorStop(0.5, `rgba(${U.plateRGB},0.58)`);
    bg.addColorStop(1, `rgba(${U.plateRGB},0.82)`);
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    c.textAlign = 'center';
    // ---------------------------------------------------------------- baslik
    this._uiRule(c, W / 2, 72, 190, 0.45);
    c.font = 'bold 30px monospace';
    c.fillStyle = '#ffffff';
    c.shadowColor = `rgba(${U.accentRGB},0.5)`; c.shadowBlur = 12;
    c.fillText('DRON SEÇ', W / 2, 112);
    c.shadowBlur = 0;
    c.font = '13px monospace';
    c.fillStyle = U.gold;
    c.fillText(`EN YÜKSEK ${this.bestScore}`, W / 2, 136);

    const idx = this.shipSelectIdx;
    const D = CONFIG.DRONES[idx];
    const unlocked = this._droneUnlocked(idx);
    const now = performance.now();
    // ------------------------------------------------------- kahraman blok
    const HP = U.shipPlate;
    this._uiPlate(c, HP.y0, HP.y1, HP.a);
    const hcy = 268;
    this._uiPedestal(c, W / 2, hcy, 98, unlocked ? 0.15 : 0.06);
    if (unlocked) this._uiScanRing(c, W / 2, hcy, 94, 1);
    /* Suzulme + cok hafif yalpalama: yalniz cizim (saat cizimde serbest). */
    c.globalAlpha = this.menuFadeT * (unlocked ? 1 : 0.32);
    c.save();
    c.translate(W / 2, hcy + Math.sin(now * 0.0013) * 5);
    c.rotate(Math.sin(now * 0.0009) * 0.05);
    this.assets.draw(c, D.sprite, -74, -74, 148, 148);
    c.restore();
    c.globalAlpha = this.menuFadeT;
    if (unlocked) this._drawRotorSpin(c, D.sprite, W / 2, hcy, 148 / 96, 0);
    // ad + tek satirlik tanim
    c.font = 'bold 26px monospace';
    c.fillStyle = unlocked ? '#ffffff' : 'rgba(160,172,192,0.75)';
    c.fillText(D.id.toUpperCase(), W / 2, 380);
    c.font = '12px monospace';
    c.fillStyle = unlocked ? `rgba(${U.accentRGB},0.9)` : 'rgba(150,160,180,0.6)';
    c.fillText(D.desc, W / 2, 400);
    this._uiRule(c, W / 2, 414, 120, 0.28, '255,255,255');
    if (unlocked) {
      /* Hiz 320..520 araliginda; cubuk 280..560 penceresine normalize edilir
         ki en yavas dron bile bos gorunmesin, en hizli da tasmasin. */
      this._uiStat(c, 'HIZ', D.speed, (D.speed - 280) / 280,
                   `rgba(${U.accentRGB},0.9)`, 442);
      this._uiPips(c, 'CAN', D.lives, 5, 470);
    } else {
      c.font = 'bold 15px monospace';
      c.fillStyle = '#ffb040';
      this._uiTracked(c, 'KİLİTLİ', W / 2, 446, 5);
      c.font = '13px monospace';
      c.fillStyle = 'rgba(170,182,200,0.85)';
      c.fillText(`${D.unlock.toLocaleString()} puan gerekiyor`, W / 2, 470);
    }
    // ----------------------------------------------------- secim seridi (4)
    const n = CONFIG.DRONES.length, cw = W / n;
    for (let i = 0; i < n; i++) {
      const d = CONFIG.DRONES[i];
      const ux = cw * i + cw / 2, uy = 556;
      const on = this._droneUnlocked(i), sel = (i === idx);
      if (sel) {
        c.fillStyle = `rgba(${U.accentRGB},0.12)`;
        this._uiRoundRect(c, ux - cw / 2 + 6, uy - 44, cw - 12, 102, 8); c.fill();
        c.strokeStyle = `rgba(${U.accentRGB},0.85)`; c.lineWidth = 1.5;
        this._uiRoundRect(c, ux - cw / 2 + 6.5, uy - 43.5, cw - 13, 101, 8); c.stroke();
      }
      c.globalAlpha = this.menuFadeT * (on ? (sel ? 1 : 0.78) : 0.26);
      this.assets.draw(c, d.sprite, ux - 28, uy - 34, 56, 56);
      c.globalAlpha = this.menuFadeT;
      c.font = sel ? 'bold 11px monospace' : '11px monospace';
      c.fillStyle = on ? (sel ? '#ffffff' : 'rgba(170,182,200,0.8)')
                       : 'rgba(150,160,180,0.55)';
      c.fillText(d.id.toUpperCase(), ux, uy + 40);
      if (!on) {
        /* Kilit simgesi (emoji) monospace fontta eksik karakter olarak
           ciziliyordu; yerine duz yazi. */
        c.font = '9px monospace';
        c.fillStyle = 'rgba(255,176,64,0.85)';
        c.fillText('KİLİTLİ', ux, uy + 52);
      }
    }
    // ------------------------------------------------------------ rehberlik
    this._uiRule(c, W / 2, 662, 190, 0.22, '255,255,255');
    c.font = '13px monospace';
    c.fillStyle = 'rgba(140,156,176,0.85)';
    c.fillText('Sol/Sağ: seç · Orta: başla', W / 2, 692);
    c.fillText('←/→ veya A/D: gezin · Space: başla', W / 2, 714);
    c.restore();
  },
  /* Mermiler: koyu kontur + parlak cekirdek (round 5).
     Her mermi kendi koyu zeminini tasir — parlak sokak isiklari uzerinde
     bile okunur. Toplam genislik <= 6 px, tracer_shape testi gecmeli.
     Dusman mermileri turuncu-kirmizi, oyuncu mermileri cyan.              */
  _drawBullets(c) {
    /* Round 21: cizimin tamami Bullet.drawPool'a tasindi (units paketi) --
       mermi gorseli units'in isi, HUD yalnizca cagirir. Donen deger iz
       uzunlugu; tracer_shape kancasi onu okur. */
    this.tracerLen = Bullet.drawPool(c, this.bulletPool, false);
    Bullet.drawPool(c, this.ebulletPool, true);
  },
  /* Rotor tozu (round 9): oyuncunun altinda rotor_wash sprite'i.
     Hiza gore hafif doner ve seffafalir — irtifa hissi verir. Yalniz cizim. */
  _drawRotorWash(c) {
    const p = this.player;
    const speed = Math.hypot(p.vx, p.vy);
    if (speed < 20) return;   // dururken gorunmez
    const alpha = Math.min(0.4, speed / CONFIG.PLAYER.maxSpeed * 0.4);
    const rot = performance.now() * 0.003 * (speed / CONFIG.PLAYER.maxSpeed);
    c.save();
    c.globalAlpha = alpha;
    c.translate(p.x, p.y + 18);
    c.rotate(rot);
    this.assets.draw(c, 'rotor_wash', -48, -48, 96, 96);
    c.restore();
  },
  /* Nisan cercevesi (round 9): en yakin dusmanin uzerinde hud_target.
     Yalniz cizim — sim'e dokunmaz. */
  _drawTargetReticle(c) {
    let nearest = null, minDist = Infinity;
    /* Round 12: alti tipin hepsi */
    for (const pool of [this.scoutPool, this.gunnerPool, this.shieldPool,
                        this.bomberPool, this.kamikazePool, this.sniperPool]) {
      pool.forEach((e) => {
        if (!e.active) return;
        const d = Math.hypot(e.x - this.player.x, e.y - this.player.y);
        if (d < minDist && e.y > 0 && e.y < CONFIG.H) { minDist = d; nearest = e; }
      });
    }
    if (this.bossState === 'active' && this.boss) {
      const d = Math.hypot(this.boss.x - this.player.x, this.boss.y - this.player.y);
      if (d < minDist) { minDist = d; nearest = this.boss; }
    }
    /* Round 15: tasici boss — govde yaricapi 60 (hitBullet ile ayni) */
    if (this.bossState === 'active' && this.carrier.active) {
      const d = Math.hypot(this.carrier.x - this.player.x, this.carrier.y - this.player.y);
      if (d < minDist) { minDist = d; nearest = { x: this.carrier.x, y: this.carrier.y, radius: 60 }; }
    }
    if (!nearest) return;
    const s = nearest.radius || 30;
    const size = Math.max(48, s * 1.4);
    /* Sprite'i olceklenmis halde %70 alfayla basmak silik ve bulanik duruyordu
       (denetimin tek gercek blocking notu buydu). Cerceve artik VEKTOR ciziliyor:
       once koyu kontur, ustune parlak cyan kose isaretleri. Kendi koyu zeminini
       tasidigi icin hem gece isiklarinda hem koyu suda okunuyor, olceklendiginde
       de bulaniklasmiyor. */
    const h = size / 2, arm = size * 0.28;
    const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
    c.save();
    c.lineCap = 'round';
    for (const pass of [{ w: 5, col: 'rgba(0,0,0,0.65)' },
                        { w: 2, col: 'rgba(120,240,255,0.95)' }]) {
      c.lineWidth = pass.w;
      c.strokeStyle = pass.col;
      c.beginPath();
      for (const [sx, sy] of corners) {
        const px = nearest.x + sx * h, py = nearest.y + sy * h;
        c.moveTo(px, py - sy * arm); c.lineTo(px, py);
        c.lineTo(px - sx * arm, py);
      }
      c.stroke();
    }
    c.restore();
  },
  /* Dusman dronlar: sprite + kalkan kabagigi (round 5) */
  _drawEnemies(c) {
    /* Round 12: alti tipin hepsi + round 15: jammer dronlari */
    for (const pool of [this.scoutPool, this.gunnerPool, this.shieldPool,
                        this.bomberPool, this.kamikazePool, this.sniperPool]) {
      pool.forEach((e) => e.draw(c, this.assets));
    }
    this.jammerPool.forEach((j) => j.draw(c, this.assets));
  },
  /* Round 12: roketler — en parlak katman (mermilerle ayni seviye). */
  _drawRockets(c) {
    this.rocketPool.forEach((rk) => { if (rk.active) rk.draw(c, this.assets); });
  },
  /* Rotor spin efekti (round 10): her rotor merkezinde iki ince yay, zit yonde,
     lighter karisim. Aci simTimeMs'e bagli (yalniz cizim, sim'e dokunmaz).
     Oyuncu hizlandikca %30'a kadar hiza artis. Boss halkalari daha yavas.   */
  _drawRotorSpin(c, spriteName, cx, cy, scale, speedFactor) {
    const R = CONFIG.ROTOR;
    const centers = R.centers[spriteName];
    if (!centers) return;
    const radius = (R.radii[spriteName] || 20) * scale;
    const ang = (this.simTimeMs / 1000) * R.speed * (1 + R.speedBoost * speedFactor);
    c.save();
    c.translate(cx, cy);
    // bulaniklik halkasi (alfa <= 0.18) — disk hissi
    c.globalAlpha = R.blurAlpha;
    c.fillStyle = 'rgba(180,200,230,1)';
    for (const [ox, oy] of centers) {
      c.beginPath(); c.arc(ox * scale, oy * scale, radius * 0.7, 0, Math.PI * 2); c.fill();
    }
    // donen yaylar (lighter, iki adet zit yonde)
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.6;
    c.strokeStyle = 'rgba(200,220,255,1)';
    c.lineWidth = 1.5;
    for (const [ox, oy] of centers) {
      const px = ox * scale, py = oy * scale;
      c.beginPath(); c.arc(px, py, radius, ang, ang + Math.PI * 0.6); c.stroke();
      c.beginPath(); c.arc(px, py, radius, -ang + Math.PI, -ang + Math.PI * 1.6); c.stroke();
    }
    c.restore();
  },
  /* Boss rotor halkalari (round 11): efekt halkanin IC capina oturur.
     Her boss icin CONFIG.ROTOR.bossRotors[sprite] tablosu: merkezler +
     ic yaricaplar + donus hizi (buyuk halka ~10 rad/s, kucuk hizli).
     Efekt: ic yaricabin %85'inde 3 ince yay, zit yonde iki katman, lighter.
     Halka icinde hafif donen bulaniklik dolgusu (alfa <= 0.15) — disk hissi. */
  _drawBossRotors(c, spriteName, cx, cy, scale) {
    const rotors = CONFIG.ROTOR.bossRotors[spriteName];
    if (!rotors) return;
    const t = this.simTimeMs / 1000;
    c.save();
    c.translate(cx, cy);
    for (const r of rotors) {
      const px = r.x * scale, py = r.y * scale;
      const R = r.innerR * 0.85 * scale;   // ic capin %85'i
      const ang = t * r.speed;
      // donen bulaniklik dolgusu: disk hissi (alfa <= 0.15)
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 0.13;
      c.fillStyle = 'rgba(170,195,235,1)';
      c.beginPath(); c.arc(px, py, R, 0, Math.PI * 2); c.fill();
      // 3 ince yay, zit yonde iki katman (lighter)
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = 0.55;
      c.strokeStyle = 'rgba(205,225,255,1)';
      c.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const a0 = ang + (i / 3) * Math.PI * 2;
        c.beginPath(); c.arc(px, py, R, a0, a0 + Math.PI * 0.42); c.stroke();
        const b0 = -ang * 1.15 + (i / 3) * Math.PI * 2 + Math.PI / 3;
        c.beginPath(); c.arc(px, py, R * 0.82, b0, b0 + Math.PI * 0.34); c.stroke();
      }
    }
    c.restore();
  },
  _drawWorld(c, alpha, noHud) {
    // hizli yana giderken sahne 1-2° karsi yone yatar (yalniz cizim)
    const P = CONFIG.PARALLAX;
    const lean = -(this.player.vx / CONFIG.PLAYER.maxSpeed) * (P.leanMaxDeg * Math.PI / 180);
    c.save();
    c.translate(CONFIG.W / 2, CONFIG.H / 2);
    c.rotate(lean);
    c.translate(-CONFIG.W / 2, -CONFIG.H / 2);
    // Ekran sarsinti (round 9): yalniz cizim donusumu, sim'e dokunmaz
    if (this.shakeT > 0 && this.shakeDur > 0) {
      const t = this.shakeT / this.shakeDur;   // 1 -> 0
      const decay = t * t;                     // karesel sonum
      const ang = performance.now() * 0.04;
      const sx = Math.sin(ang * 7.3) * this.shakeAmp * decay;
      const sy = Math.cos(ang * 5.1) * this.shakeAmp * decay;
      c.translate(sx, sy);
    }
    // sehir paralaks katmani (zemin + binalar)
    this.city.draw(c, alpha);
    /* Round 16: kara hedefleri — sehir zemininin HEMEN USTUNDE, bulut ve
       tum hava birimlerinin ALTINDA. Ekran goruntusu yolunda da gorunur. */
    /* Crossfade sirasinda cizilmez: onceki sehrin uzerinde kara araci gorunmesin. */
    if (this.city.fadeT >= 1) this.groundPool.forEach((g) => g.draw(c, this.assets, this.city));
    /* Round 17: skimmer — hava birimi, dusmanlarla ayni katman. */
    this.skimmerPool.forEach((k) => k.draw(c, this.assets));
    // bulut katmani (round 10): sehir UZERINDE, dronlar ALTINDA
    this.clouds.draw(c);
    // boss (dusmanlarla ayni katman, mermilerin altinda)
    if (this.bossState === 'active' && this.boss) {
      this.boss.draw(c, this.assets);
      // boss rotor halkalari (round 11): ic capina oturan efekt, bolum bazli sprite
      const bs = CONFIG.BOSS.size / 208;   // manifest 208 -> cizim olcegi
      this._drawBossRotors(c, this.boss.sprite, this.boss.x, this.boss.y, bs);
    }
    /* Round 15: tasici boss — kendi draw'i parcalari da cizer */
    if (this.bossState === 'active' && this.carrier.active) {
      this.carrier.draw(c, this.assets);
    }
    // dusman dronlar (mermilerin altinda, oyuncunun ustunde)
    this._drawEnemies(c);
    // dusman rotor spin (round 10) — round 12: alti tipin hepsi
    for (const pool of [this.scoutPool, this.gunnerPool, this.shieldPool,
                        this.bomberPool, this.kamikazePool, this.sniperPool]) {
      pool.forEach((e) => {
        if (!e.active) return;
        const s = e.radius * 2;
        const sc = s / 64;   // sprite ornek olcegi (scout 64 taban)
        this._drawRotorSpin(c, e.sprite, e.x, e.y, sc, 0);
      });
    }
    // poweruplar (round 10+12): pu_weapon / pu_shield / pu_rocket
    this._drawPowerups(c);
    // mermiler: en parlak katman
    this._drawBullets(c);
    // Round 12: roketler (en parlak katman)
    this._drawRockets(c);
    // FX: patlama + sok dalgasi + kivilcim (en parlak katman)
    this.fx.draw(c, this.assets, this.city);   // city: zemine civili is izleri icin
    // Rotor tozu (round 9): oyuncunun altinda, hiza gore doner + seffafalir
    this._drawRotorWash(c);
    // oyuncu
    this.player.draw(c, this.assets);
    // oyuncu rotor spin (round 10) — round 26 (F8): merkezler secilen dronun
    // sprite'ina gore CONFIG.ROTOR.centers'tan secilir (falcon'a sabit degil)
    {
      const P = CONFIG.PLAYER;
      const s = P.size * 1.1 / 96;   // cizim olcegi (manifest 96)
      const speedF = Math.min(1, Math.hypot(this.player.vx, this.player.vy) / P.maxSpeed);
      c.save();
      c.translate(this.player.x, this.player.y);
      c.rotate(this.player.tilt);
      this._drawRotorSpin(c, this.player.sprite, 0, 0, s, speedF);
      c.restore();
    }
    // Nisan cercevesi (round 9): en yakin dusmanin uzerinde (yalniz cizim)
    this._drawTargetReticle(c);
    c.restore();
    /* noHud: vision/ekran-goruntusu yolu icin. HUD metni (SKOR, SİLAH) ve
       bolum karti ekrana bindirilir; vision modeli bunlari "beklenmeyen
       yazı" diye kusur sayip blocking veriyordu. Oyunun GERCEK cizimi
       degismez — yalnizca denetime giden karede UI katmani atlanir. */
    if (!noHud) {
      // oyun HUD'u (teknik sayaclar DEGIL — onlar debugOverlay'de)
      this._drawHud(c);
      // boss can cubugu (ustte)
      if (this.bossState === 'active' && this.boss) this._drawBossBar(c);
      // DIKKAT uyarisi (boss girisinden once, yanip sonek)
      if (this.bossState === 'warn') this._drawWarn(c);
      // bölüm karti: amblem + ad (round 8), oyun alanini karartmadan
      if (this.stageTitleT > 0) this._drawStageCard(c);
      /* Round 20: ipucu satiri — ekranin altinda soluk, oyunu duraklatmaz. */
      const tip = this.tipText();
      if (tip && this.state === 'play') {
        /* Round 24: ipucu da sehrin uzerinde duruyordu ve parlak bir karonun
           ustune denk gelince %55 alfayla kayboluyordu. Ayni ilke: kendi
           ince levhasini tasiyor. Ekran goruntusu yolu (noHud) bu blogun
           ICINDE, yani denetime giden kare degismez. */
        const T = CONFIG.UI.tipPlate;
        this._uiPlate(c, T.y0, T.y1, T.a, 18);
        c.textAlign = 'center';
        c.font = '13px monospace';
        c.fillStyle = 'rgba(176,192,208,0.8)';
        c.fillText(tip, CONFIG.W / 2, CONFIG.H - 16);
      }
    }
    // boss olum ekran parlamasi (kisa)
    if (this.bossFlashT > 0) {
      const a = Math.min(1, this.bossFlashT / (CONFIG.BOSS.flashMs / 1000)) * 0.5;
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = `rgba(255,240,200,${a.toFixed(3)})`;
      c.fillRect(0, 0, CONFIG.W, CONFIG.H);
      c.restore();
    }
  },
  /* Boss can cubugu: ustte, tam genislikte ince bar.
     Round 15: tasici boss govde kilitliyken (anten dururken) dolu gorunur —
