       Zeminle birebir ayni hizda kayar (city.dist'ten türetilir). */
    this.scorches.forEach((s) => s.draw(c, city));
    this.explosions.forEach((e) => e.draw(c, assets));
    this.shockwaves.forEach((w) => w.draw(c));
    this.sparks.draw(c);
    this.smoke.draw(c);
    this.wrecks.forEach((w) => w.draw(c, assets));
    this.scorePops.forEach((p) => p.draw(c));
    this._drawFlakFlash(c);
    if (this.glitchActive) this._drawGlitch(c);
  }
  /* Round 17: flak parlama — kisa lighter flash (yalniz cizim, sim'e dokunmaz). */
  _drawFlakFlash(c) {
    const f = this._flakFlash;
    if (!f) return;
    const t = f.t / f.dur;                 // 0..1
    const a = Math.pow(1 - t, 2);          // karesel sonum
    const r = CONFIG.FX.flak.flashR * (0.5 + t * 0.8);
    c.save();
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    g.addColorStop(0, `rgba(255,240,200,${a.toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,200,120,0)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(f.x, f.y, r, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
  /* Glitch cizimi: ekranin KENDISINI kesip yatay kaydiran seritler +
     deterministik statik gurultu satirlari. performance.now() YALNIZ cizimde.
     Anlik hasar glitch'i (sonekli) ile ambient seviye toplanir ama toplam
     CONFIG.FX.glitchMaxCap'te tavani asamaz — ikisi ayni anda gorse bile
     ekran donmez. Ambient tek basina seyrek ve zayif kalir. */
  _drawGlitch(c) {
    const W = CONFIG.W, H = CONFIG.H;
    const cap = CONFIG.FX.glitchMaxCap;
    let amp = 0;
    if (this._glitchT > 0 && this._glitchDur > 0) {
      const t = this._glitchT / this._glitchDur;   // 1 -> 0
      amp += this._glitchAmp * t;                  // anlik, sonen genlik
    }
    if (this._ambientGlitch > 0) amp += this._ambientGlitch;
    if (amp > cap) amp = cap;
    if (amp <= 0) return;
    const now = performance.now();
    c.save();
    // --- yatay kayma seritleri: kaynak tuvalden kes, yonunde kaydir
    // ambient tek basina oldugunda seritler seyrek (2/4) ve dar olur.
    const strips = this._glitchT > 0 ? 4 : 2;
    for (let i = 0; i < strips; i++) {
      const sy = ((Math.sin(now * 0.021 + i * 1.7) * 0.5 + 0.5) * H) | 0;
      const sh = 8 + ((Math.sin(now * 0.033 + i * 2.9) * 0.5 + 0.5) * 18) | 0;
      const off = Math.sin(now * 0.05 + i * 4.1) * 14 * amp;
      if (off === 0 || sy + sh > H) continue;
      c.drawImage(c.canvas, 0, sy, W, sh, off, sy, W, sh);
    }
    // --- statik gurultu: az sayida ince beyaz/koyu satir (deterministik)
    let s = (now * 0.017) | 0;
    const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
    c.globalCompositeOperation = 'lighter';
    const lines = this._glitchT > 0 ? 6 : 3;
    for (let i = 0; i < lines; i++) {
      const gy = (rnd() * H) | 0;
      const gh = 1 + (rnd() * 2) | 0;
      c.fillStyle = `rgba(200,220,255,${(0.10 * amp).toFixed(3)})`;
      c.fillRect(0, gy, W, gh);
    }
    c.restore();
  }
  reset() {
    this.explosions.reset();
    this.shockwaves.reset();
    this.sparks.reset();
    this.wrecks.reset();
    this.smoke.reset();
    this.scorches.reset();
    this.scorePops.reset();
    this._flakFlash = null;
    this._glitchT = 0;
    this._glitchDur = 0;
    this._glitchAmp = 1;
    this._ambientGlitch = 0;
  }
}

/* -------------------------------------------------------------- CityScroller
   Sehir uc katman: zemin karosu (dikey kayar), binalar (daha hizli + seyrek),
   bir kez gecen simge yapi. Oyuncunun yatay konumu (-1..1) katmanlari TERS
   yonde kaydirir (parallaks). Kayma soneumlu — ani ziplama yok.

   Bina yerlesimi DETERMINISTIK: LCG ile, kaydirma mesafesine bagli.
   Math.random() YOK. Iki kare hizinda ayni binalar ayni yerde olmalidir.      */

/* ---- src/world/CityScroller.js ---- */
class CityScroller {
  constructor(assets) {
    this.assets = assets;
    this.city = 'istanbul';
    this.prevCity = null;           // crossfade: onceki sehir (null = yok)
    this.fadeT = 1;                 // 0..1 (1 = tam yeni sehir)
    this.buildings = [];            // bu sehir icin building_* adlari
    this.prevBuildings = [];        // onceki sehir binalari (crossfade)
    this.landmark = '';
    this._catalog();
    this.dist = 0;                  // toplam kaydirma mesafesi (px)
    this.smoothX = 0;               // soneumlu oyuncu x (-1..1)
    this.builtUpTo = -1;            // son uretilen slot (slot = floor(dist/SPACING))
    this.lastLandmarkSlot = -9999;
    this.buildingsList = [];        // ekrandaki bina instanslari
    this.prevBuildingsList = [];    // onceki sehir binalari (crossfade)
    this.landmarkShown = false;     // bu bölümde simge yapı geçti mi
    this.landmarkY = 0;             // simge yapının taban y konumu (dist uzayında)
  }
  _catalog() {
    const b = [], l = {};
    for (const s of this.assets.manifest.sprites) {
      if (s.kind === 'building') b.push(s.name);
      else if (s.kind === 'landmark') l[s.name] = true;
    }
    // Bolum listesi CONFIG.STAGES'ten turetilir; yeni bolum eklendiginde
    // katalog otomatik genisler (round 16: 'port' liman — binasi ve simge
    // yapisi yok, bu iki alan bos kalir).
    const cities = CONFIG.STAGES.map((s) => s.city);
    for (const city of cities) {
      const names = b.filter((n) => n.includes('_' + city + '_'));
      const lm = Object.keys(l).find((n) => n.includes(city));
      this['city_' + city] = { buildings: names, landmark: lm || '' };
    }
  }
  setCity(name, instant) {
    if (instant) {
      this.prevCity = null;
      this.fadeT = 1;
      this.prevBuildings = [];
      this.prevBuildingsList = [];
    } else if (this.city !== name) {
      // crossfade: onceki sehir kaybolurken yeni sehir belirir
      this.prevCity = this.city;
      this.prevBuildings = this.buildings.slice();
      this.prevBuildingsList = this.buildingsList.slice();
      this.fadeT = 0;
    }
    this.city = name;
    const c = this['city_' + name] || this.city_istanbul;
    this.buildings = c.buildings;
    this.landmark = c.landmark;
    this.dist = 0;
    this.smoothX = 0;
    this.builtUpTo = -1;
    this.lastLandmarkSlot = -9999;
    this.buildingsList = [];
    this.landmarkShown = false;
    this.landmarkY = 0;
  }
  /* Bir sim adiminda ilerletir. playerNx: oyuncu x normalizasyonu (-1..1). */
  update(dt, playerNx) {
    const P = CONFIG.PARALLAX;
    this.dist += CONFIG.SCROLL.speed * dt;
    // kritik sonumlu yaklasim: h = 1 - exp(-k*dt) (adim boyutundan bagimsiz)
    const h = 1 - Math.exp(-P.smooth * dt);
    this.smoothX += (playerNx - this.smoothX) * h;
    // crossfade ilerletme
    if (this.fadeT < 1) {
      this.fadeT = Math.min(1, this.fadeT + dt * 1000 / CONFIG.CROSSFADE_MS);
      if (this.fadeT >= 1) {
        this.prevCity = null;
        this.prevBuildingsList = [];
      }
    }
    this._ensureBuilt();
  }
  /* Simge yapı artık SAHNEDE CIZILMEZ — bölüm kartında amblem olarak
     kullanilir (round 8). "Uçuşan binalar" duzeltmesinde bina sprite katmani
     sahneden kaldirildi; landmark da o katmandaydi ve gorunmuyordu. Dunyaya
     geri koymak ayni sorunu yaratir (tepeden cekilmis fotografin uzerine egik
     acidan cizilmis sprite havada durur). Bu metot artik yalnizca flag'i
     ayarlar; kart, Game tarafinda stageTitleT ile tetiklenir.               */
  triggerLandmark() {
    if (this.landmarkShown || !this.landmark) return;
    this.landmarkShown = true;
  }
  _ensureBuilt() {
    const SPACING = 260;                       // bina araligi (px)
    const H = CONFIG.H;
    const maxSlot = Math.floor((this.dist + H) / SPACING);
    while (this.builtUpTo < maxSlot) {
      this.builtUpTo++;
      this._spawnAt(this.builtUpTo, SPACING);
    }
    // ekrandan coktan cikmis binasi at
    const minY = this.dist - H;                // y < minY -> ekranin ustunde
    this.buildingsList = this.buildingsList.filter((b) => b.y > minY - 400);
    if (!this.buildingsList.length) this.buildingsList = [];
  }
  _spawnAt(slot, spacing) {
    // LCG: her slot icin deterministik tohum (Math.random YOK)
    let seed = (slot * 2654435761 + 1013904223) >>> 0;
    const rnd = () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const baseY = slot * spacing;              // bina tabaninin kaydirilmis y'si
    const idx = this.buildings.length ? Math.floor(rnd() * this.buildings.length) : 0;
    const name = this.buildings[idx];
    // Cizim olcegi manifest boyutunun 0.45-0.65'i araliginda (round 4):
    // binalar sahneye oturur, ekranin uctunu kaplamaz.
    const P = CONFIG.PARALLAX;
    const sc = P.buildingScaleMin + rnd() * (P.buildingScaleMax - P.buildingScaleMin);
    const s = this.assets.manifest.sprites.find((m) => m.name === name);
    const bw = s ? Math.round(s.width * sc) : Math.round(130 * sc);
    const x = 20 + rnd() * (CONFIG.W - 40 - bw);
    this.buildingsList.push({ name, x, y: baseY, w: bw, scale: sc });
  }
  /* Sehir cizimi — "ucusan binalar" duzeltmesi.
   *
   * Once zeminin uzerine ayri bina sprite'lari cizilirdi. Kullanicinin sorusu
   * hakliydi: Bogaz'in ortasinda duran bir bina cikiyordu. Iki sebep vardi —
   * (1) bina katmani zeminden HIZLI kayiyordu (170 vs 120 px/s), yani gercekten
   * havada suzuluyorlardi; (2) zemin tam tepeden cekilmis ortografik bir hava
   * goruntusu, bina sprite'lari ise egik acidan cizilmisti; iki farkli
   * projeksiyon yan yana durunca goz onlari sahneye ait saymiyor. Ustelik
   * fotograf zaten kendi binalarini iceriyor, ustune bina koymak cakisma demek.
   *
   * Cozum: bina sprite'lari sahneden kaldirildi. Aci hissi sehir KAROSUNUN
   * kendisinden geliyor — karo hafifce buyutulup (zoom) oyuncunun yatay
   * konumuna gore ters yonde kaydiriliyor. Fotograftaki gercek yuksek binalar
   * goruntunun icinde oldugu icin tum kare birlikte kayinca "aci degisti" diye
   * okunuyor ve hicbir sey havada durmuyor. Simge yapilar da dunyadan cikarildi;
   * bolum basligi kartinda amblem olarak kullaniliyorlar (UI, dunya degil).      */
  draw(c, alpha) {
    const P = CONFIG.PARALLAX;
    const H = CONFIG.H;
    const W = CONFIG.W;
    const sy = this.dist % H;
    const zoom = P.tileZoom;                 // karo ekrandan biraz buyuk cizilir
    const zw = W * zoom, zh = H * zoom;
    const padX = (zw - W) / 2, padY = (zh - H) / 2;
    // oyuncu saga gidince goruntu sola kayar: aci degismis gibi
    const shift = -this.smoothX * P.cityShift;
    /* Karo A/B sirali dongusu (round 11): her sehir icin iki karo vardir
       (city_<sehir> ve city_<sehir>_b). Dikey dongude ikisi SIRAYLA dizilir
       (A, B, A, B...) — tekrar araligi iki katina cikar, ayni goruntu pes
       pese gelmez. Karo yukseklikleri esittir (800 px), gecis dikissizdir. */
    const drawCity = (name, a) => {
      if (a <= 0) return;
      const tileA = 'city_' + name;
      const tileB = 'city_' + name + '_b';
      const hasB = this.assets.has(tileB) || !!this.assets.fallback[tileB];
      const T = hasB ? H * 2 : H;        // dongu periyodu (px)
      const off = ((this.dist % T) + T) % T;
      c.save();
      c.globalAlpha = a;
      const x = -padX + shift;
      for (let k = -1; k <= 2; k++) {
        const base = off + k * T;
        for (let i = 0; i < 2; i++) {
          const yTop = base + i * H;
          if (yTop > H || yTop + H < 0) continue;
          let tName = i === 0 ? tileA : tileB;
          if (!hasB) tName = tileA;      // fallback: _b yoksa tek karoyla devam
          this.assets.draw(c, tName, x, yTop - padY, zw, zh);
        }
      }
      c.restore();
    };
    if (this.fadeT < 1 && this.prevCity) drawCity(this.prevCity, 1 - this.fadeT);
    drawCity(this.city, this.fadeT < 1 ? this.fadeT : 1);
  }
  /* Test kancasi: su an ekranda cizilen bina sayisi (landmark dahil degil). */
  onScreenCount() {
    const H = CONFIG.H;
    let n = 0;
    for (const b of (this.buildingsList || [])) {
      if (b.landmark) continue;
      const y = b.y - this.dist;
      if (y > -200 && y < H + 200) n++;
    }
    return n;
  }
  /* Test kancasi: bina katmani yatay ofseti (parallaks). */
  layerOffset() { return -this.smoothX * CONFIG.PARALLAX.buildingShift; }
}

/* --------------------------------------------------------------- CloudLayer
   Bulut katmani (round 10+11): sehir UZERINDE, dronlar ALTINDA cizilir.
   Dikey: zeminden hizli kayar (185 px/s vs 120) — yukseklik hissi.
   Yatay: oyuncunun x konumuna TERS yonde ve zeminden DAHA GUCLU kayar
   (hShift 70 vs cityShift 30) — bulut daha yakin oldugu icin parallaks
   buyuktur; oyuncu saga gidince bulut SOLA kayar (round 11 duzeltmesi).
   Cekit: cloud_a..cloud_f havuzundan LCG ile secim; arka arkaya AYNI
   cekit tekrarlanmaz; her dogustaki olcek/alfa farklidir.
   Yerlesim LCG ile DETERMINISTIK: iki kare hizinda birebir ayni konum.     */

/* ---- src/world/CloudLayer.js ---- */
class CloudLayer {
  constructor(assets) {
    this.assets = assets;
    this.clouds = [];           // ekrandaki bulut instanslari
    this.dist = 0;              // toplam kaydirma mesafesi (px)
    this.builtUpTo = -1;        // son uretilen slot
    this.smoothX = 0;           // soneumlu oyuncu x (-1..1)
    this._seedBase = 9173;      // LCG taban tohumu
    this._lastSprite = '';      // arka arkaya ayni cekit yasak
    this._catalog = ['cloud_a', 'cloud_b', 'cloud_c', 'cloud_d', 'cloud_e', 'cloud_f'];
  }
  reset() {
    this.clouds = [];
    this.dist = 0;
    this.builtUpTo = -1;
    this.smoothX = 0;
    this._lastSprite = '';
  }
  update(dt, playerNx) {
    const C = CONFIG.CLOUDS;
    this.dist += C.speed * dt;
    // yatay soneum: kritik sonumlu yaklasim (adim boyutundan bagimsiz)
    const h = 1 - Math.exp(-C.smooth * dt);
    this.smoothX += (playerNx - this.smoothX) * h;
    const H = CONFIG.H;
    const SP = C.spacing;
    const maxSlot = Math.floor((this.dist + H + 200) / SP);
    while (this.builtUpTo < maxSlot) {
      this.builtUpTo++;
      this._spawnAt(this.builtUpTo);
    }
    // ekrandan coktan cikmis bulutu at
    const minY = this.dist - H - 200;
    this.clouds = this.clouds.filter((c) => c.baseY > minY);
  }
  _spawnAt(slot) {
    // LCG: her slot icin deterministik tohum (Math.random YOK)
    let seed = ((slot * 2654435761 + this._seedBase) >>> 0);
    const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const C = CONFIG.CLOUDS;
    const baseY = slot * C.spacing;
    const x = 40 + rnd() * (CONFIG.W - 120);
    // cekit secimi: arka arkaya ayni cekit yasak (LCG ile deterministik)
    let idx = Math.floor(rnd() * this._catalog.length);
    if (this._catalog[idx] === this._lastSprite) {
      idx = (idx + 1 + Math.floor(rnd() * (this._catalog.length - 1))) % this._catalog.length;
    }
    const sprite = this._catalog[idx];
    this._lastSprite = sprite;
    const alpha = C.alphaMin + rnd() * (C.alphaMax - C.alphaMin);
    const scale = C.scaleMin + rnd() * (C.scaleMax - C.scaleMin);   // 0.7..1.3
    const driftPhase = rnd() * Math.PI * 2;
    this.clouds.push({ baseY, x, sprite, alpha, scale, driftPhase });
  }
  /* Test kancasi: yatay parallaks ofseti (px). Oyuncu saga -> NEGATIF (sola). */
  layerOffset() { return -this.smoothX * CONFIG.CLOUDS.hShift; }
  draw(c) {
    const C = CONFIG.CLOUDS;
    const H = CONFIG.H;
    const shift = this.layerOffset();
    for (const cl of this.clouds) {
      const y = cl.baseY - this.dist;
      if (y < -160 || y > H + 160) continue;
      // yatay suruklenme (dist'e bagli — sim adimindan bagimsiz, deterministik)
      const drift = Math.sin(cl.driftPhase + (this.dist / (C.driftPeriod * C.speed)) * Math.PI * 2) * C.driftAmp;
      const s = this.assets.manifest.sprites.find((m) => m.name === cl.sprite);
      const w = (s ? s.width : 200) * cl.scale;
      const h = (s ? s.height : 140) * cl.scale;
      c.save();
      c.globalAlpha = cl.alpha;
      this.assets.draw(c, cl.sprite, cl.x + drift + shift - w / 2, y - h / 2, w, h);
      c.restore();
    }
  }
  /* Test kancasi: su an ekranda olan bulut konumlari (determinizm). */
  onScreenPositions() {
    const H = CONFIG.H;
    const shift = this.layerOffset();
    const out = [];
    for (const cl of this.clouds) {
      const y = cl.baseY - this.dist;
      if (y > -160 && y < H + 160) out.push([Math.round((cl.x + shift) * 100) / 100, Math.round(y * 100) / 100]);
    }
    return out;
  }
  /* Test kancasi: son N dogustaki cekit listesi (cloud_variety).
     Ekran disinda kalanlar da dahil — slot 0'dan builtUpTo'ya tek geciste
     LCG ile yeniden uretir (deterministik, _spawnAt ile birebir ayni siralar). */
  spawnedSprites(n) {
    const out = [];
    let last = '';
    for (let s = 0; s <= this.builtUpTo; s++) {
      let seed = ((s * 2654435761 + this._seedBase) >>> 0);
      const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
      rnd();   // x konumu
      let idx = Math.floor(rnd() * this._catalog.length);
      if (this._catalog[idx] === last) {
        idx = (idx + 1 + Math.floor(rnd() * (this._catalog.length - 1))) % this._catalog.length;
      }
      last = this._catalog[idx];
      out.push(last);
    }
    return out.slice(-n);
  }
}

/* -------------------------------------------------------------------- Bullet
   Oyuncu mermisi (yukari) ve dusman mermisi (asagi) ayni sinifta.
   Trail: son N konum — koyu iz icin. Sıcak dongude array tahsisi yok.     */

/* ---- src/units/Bullet.js ---- */
class Bullet {
  constructor() { this.trailX = new Float32Array(4); this.trailY = new Float32Array(4); this.trailN = 0; this.isEnemy = false; this.reset(0, 0); }
  reset(x, y, isEnemy) {
    this.x = x; this.y = y; this.isEnemy = !!isEnemy;
    const sp = isEnemy ? CONFIG.EBULLET.speed : CONFIG.BULLET.speed;
    this.vx = 0; this.vy = isEnemy ? sp : -sp;
    this.life = isEnemy ? CONFIG.EBULLET.life : CONFIG.BULLET.life;
    this.trailN = 0;
    this.flak = false;   // round 17: ucaksavar mermisi mi (omru bitince havada patlar)
  }
  update(dt) {
    // trail kaydir (en eskiyi at, sondakini yeni konuma yaz)
    for (let i = 0; i < this.trailN - 1; i++) { this.trailX[i] = this.trailX[i+1]; this.trailY[i] = this.trailY[i+1]; }
    this.trailX[this.trailN] = this.x; this.trailY[this.trailN] = this.y;
    if (this.trailN < 3) this.trailN++;
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0 || this.y < -20 || this.y > CONFIG.H + 20) this.active = false;
  }
}

/* ------------------------------------------------------- mermi cizimi (r21)
   Bir havuzun TAMAMINI tek gecişte cizer. Cagrilma yeri: Game._drawBullets.
   Donen deger iz uzunlugu (L) — cagiran `this.tracerLen` kancasina yazar.

   Katman sirasi (hepsi renk+alfa kovasina gore gruplu, sicak dongude tahsis
   YOK — eski kodun mermi basina createRadialGradient'i kaldirildi):
     1) koyu kontrast halesi  — genisten dara 4 kademe, siyah + alfa
     2) koyu iz (trail)       — merminin arkasinda kisa sonen hat
     3) yumusak additif parlama + cyan/beyaz cekirdek  ('lighter')
     4) uc parlamasi          — iki additif yay (gradyan yok)

   Neden hale: `foreground_contrast` tepe - medyan olcer; 'lighter' cekirdek
   her zeminde 255'e doyar, yani tepe yukseltilemez. Parlak bulut bandin
   medyanini ~230'a cikarinca fark 25'e duser (beyaz iz beyaz bulutta gercekten
   kaybolur). Siyah + alfa carpimsaldir: koyu sehirde gorunmez, parlak zeminde
   mermiye kendi cercevesini verir ve bandin medyanini asagi ceker. Arka plan
   karartilmaz — hale mermiye aittir ve mermiyle birlikte hareket eder.

   Cizim/sim ayrimi: burada sim durumu OKUNUR, hicbiri yazilmaz; carpisma
   dikdortgeni degismez (genislikler CONFIG.BULLET.w'nin katidir).          */
Bullet.drawPool = function (c, pool, isEnemy) {
  const T = CONFIG.FX.tracer;
  const L = T.len, half = L * 0.5;
  const bw = CONFIG.BULLET.w;          // tek boyut kaynagi (carpisma ile ayni)
  const TAU = Math.PI * 2;
  const tipDy = isEnemy ? half : -half;   // iz ucu: dusman asagi, oyuncu yukari
  const outer = isEnemy ? 'rgba(255,100,40,0.85)' : 'rgba(90,230,255,0.85)';
  const inner = isEnemy ? 'rgba(255,220,180,0.95)' : 'rgba(255,255,255,0.95)';
  c.save();
  // --- 1) KOYU KONTRAST HALESI (source-over siyah = carpim)
  c.lineCap = 'butt';
  c.fillStyle = '#000';
  for (let i = 0; i < T.haloW.length; i++) {
    const w = bw * T.haloW[i];
    c.globalAlpha = T.haloA[i];
    c.beginPath();
    pool.forEach((b) => { c.rect(b.x - w * 0.5, b.y - half, w, L); });
    c.fill();
  }
  // --- 2) KOYU IZ: merminin arkasinda hizla sonen kisa hat
  c.lineCap = 'round';
  c.globalAlpha = 0.28;
  c.strokeStyle = '#000';
  c.lineWidth = bw * 0.7;
  c.beginPath();
  pool.forEach((b) => {
    if (b.trailN >= 2) { c.moveTo(b.trailX[0], b.trailY[0]); c.lineTo(b.x, b.y); }
  });
  c.stroke();
  // --- 3) PARLAK CEKIRDEK (lighter)
  c.globalCompositeOperation = 'lighter';
  // yumusak parlama: dar tutulur, yoksa bandin medyanini kendisi yukseltir
  c.globalAlpha = T.glowA;
  c.strokeStyle = outer;
  c.lineWidth = bw * T.glowW;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  c.globalAlpha = 1;
  c.strokeStyle = outer;
  c.lineWidth = bw * 0.7;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  c.strokeStyle = inner;
  c.lineWidth = bw / 3;
  c.beginPath();
  pool.forEach((b) => { c.moveTo(b.x, b.y + half); c.lineTo(b.x, b.y - half); });
  c.stroke();
  // --- 4) UC PARLAMASI: iki additif yay (mermi basina gradyan YOK)
  c.globalAlpha = T.tipA;
  c.fillStyle = outer;
  c.beginPath();
  pool.forEach((b) => {
    const y = b.y + tipDy;
    c.moveTo(b.x + T.tipR, y); c.arc(b.x, y, T.tipR, 0, TAU);
  });
  c.fill();
  c.globalAlpha = 0.9;
  c.fillStyle = inner;
  const rIn = T.tipR * 0.45;
  c.beginPath();
  pool.forEach((b) => {
    const y = b.y + tipDy;
    c.moveTo(b.x + rIn, y); c.arc(b.x, y, rIn, 0, TAU);
  });
  c.fill();
  c.restore();
  return L;
};

/* --------------------------------------------------------------------- Rocket
   Round 12: kazanilabilir ek silah. Normal atisa EK olarak hafif gaitli.
   Hedef secimi deterministik: "en yakin aktif dusman, esitlikte en kucuk
   havuz indeksi". Donus hizi <= 180 deg/s. Isabette hasar 3.               */

/* ---- src/units/Rocket.js ---- */
class Rocket {
  constructor() { this.active = false; }
  reset(x, y, target) {
    this.x = x; this.y = y;
    this.target = target;            // Enemy nesnesi (referans)
    const R = CONFIG.ROCKET;
    this.speed = R.speed;
    // Baslangic acisi: hedefe dogru
    this.angle = Math.atan2(target.y - y, target.x - x);
    this.maxTurn = R.turnRate * Math.PI / 180;   // rad/s
    this.active = true;
  }
  update(dt, game) {
    // Hedef yoksa (oldu/ekrandan cikti) — son bilinen yone devam et
    if (!this.target || !this.target.active) {
      this.x += Math.cos(this.angle) * this.speed * dt;
      this.y += Math.sin(this.angle) * this.speed * dt;
      if (this.y < -40 || this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
      return;
    }
    // Gait: hedefe don (maks turnRate ile sinirli)
    const desired = Math.atan2(this.target.y - this.y, this.target.x - this.x);
    let diff = desired - this.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const maxStep = this.maxTurn * dt;
    if (Math.abs(diff) <= maxStep) this.angle = desired;
    else this.angle += Math.sign(diff) * maxStep;
    // Ilerle
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    if (this.y < -40 || this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
  }
  draw(c, assets) {
    const s = CONFIG.ROCKET.size;
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.angle + Math.PI / 2);   // sprite dikey, ustu yukari
    assets.draw(c, 'rocket', -s * 0.5 / 2, -s / 2, s * 0.5, s);
    c.restore();
  }
}

/* -------------------------------------------------------------------- Enemy
   Uc tip: scout (hizli, ateşsiz), gunner (nişanlı mermi), shield (kalkan).
   Havuzdan beslenir; sıcak döngüde `new` yok. LCG ile deterministik.       */

/* ---- src/units/SubDrone.js ---- */
class SubDrone {
  constructor() { this.active = false; }
  reset(x, y) {
    this.x = x; this.y = y;
    this.mode = 'gun';         // 'gun' | 'kamikaze'
    this.target = null;        // Enemy nesnesi (kamikaze modu)
    this.fireTimer = 0;
    this.angle = -Math.PI / 2; // varsayilan: yukari
    this._side = this._side || 1;   // sag/sol — ilk atamada belirlenir
    this.active = true;
  }
  /* Kamikaze moduna gec: en yakin aktif dusmana kilitlen. */
  launch(target) {
    if (!target) return;
    this.mode = 'kamikaze';
    this.target = target;
  }
  update(dt, game) {
    const S = CONFIG.SUBDRONE;
    const p = game.player;
    if (this.mode === 'gun') {
      /* Yumusak gecikmeyle takip: oyuncunun ±offset px yanina kritik sonumlu
         yaklasim. Hedef konum her adimda hesaplanir, konum ustel sonumle
         hedefe dogru ilerler — ani sikintilar yok. */
      const side = this._side || 1;   // -1 sol, +1 sag
      const tx = p.x + side * S.offset;
      const ty = p.y + 8;             // hafif asagida
      const f = Math.min(1, S.followSmooth * dt);
      this.x += (tx - this.x) * f;
      this.y += (ty - this.y) * f;
      // Ates: oyuncuyla birlikte, hasar 1, aralik fireIntervalMs
      this.fireTimer -= dt;
      if (game.input.firing() && this.fireTimer <= 0) {
        this.fireTimer = S.fireIntervalMs / 1000;
        const b = game.bulletPool.acquire();
        if (b) { b.reset(this.x, this.y - 12); }
      }
    } else {
      /* Kamikaze modu: hedefe 620 px/s hiza. Geri gelmez. */
      if (!this.target || !this.target.active) {
        // Hedef olduruldu: son bilinen yone devam et, ekrandan cik
        this.x += Math.cos(this.angle) * S.kamikazeSpeed * dt;
        this.y += Math.sin(this.angle) * S.kamikazeSpeed * dt;
        if (this.y < -40 || this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
        return;
      }
      const dx = this.target.x - this.x, dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy) || 1;
      this.angle = Math.atan2(dy, dx);
      this.x += (dx / d) * S.kamikazeSpeed * dt;
      this.y += (dy / d) * S.kamikazeSpeed * dt;
      // Carpisma kontrolu (Player tarafinda da yapilir ama buradan erken donus)
      const rr = 10 + (this.target.radius || 20);
      if (dx * dx + dy * dy <= rr * rr) {
        for (let i = 0; i < S.kamikazeDamage; i++) {
          if (!this.target.active) break;
          const killed = this.target.hit();
          if (killed) game._onEnemyKilled(this.target);
        }
        game.fx.explode(this.x, this.y);
        this.active = false;
      }
    }
  }
  draw(c, assets) {
    const s = CONFIG.SUBDRONE.size;
    c.save();
    c.translate(this.x, this.y);
    if (this.mode === 'kamikaze') {
      // Kamikaze: hafif parlayici turuncu kenar isigi
      c.rotate(this.angle + Math.PI / 2);
      assets.draw(c, 'sub_drone', -s / 2, -s / 2, s, s);
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,150,40,0.7)';
      c.lineWidth = 1.5;
      c.beginPath(); c.arc(0, 0, s * 0.35, 0, Math.PI * 2); c.stroke();
    } else {
      // Namlu modu: normal cizim
      assets.draw(c, 'sub_drone', -s / 2, -s / 2, s, s);
    }
    c.restore();
  }
}

/* ---------------------------------------------------------------------- Player
   Oyuncu dronu: hareket, ates, dash, sub-dronlar, isi.                     */

/* ---- src/units/Jammer.js ---- */
class Jammer {
  constructor() { this.active = false; }
  reset(x, y) {
    const J = CONFIG.JAMMER;
    this.x = x; this.y = y;
    this.t = 0;                       // sim saati (s) — salinim + nabiz
    this.inRange = false;             // oyuncu menzil icinde mi (sim durumu)
    this._seed = ((x * 31 + y * 17 + 13) >>> 0);   // LCG tohumu (deterministik)
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  update(dt, game) {
    if (!this.active) return;
    const J = CONFIG.JAMMER;
    this.t += dt;
    /* Yavas inis: hoverY'ye kadar sabit hiz, sonra yatay salinim.
       Ekranin ust yarısında kalmaya calisir (hoverY ~ H*0.30). */
    const entryT = 1.2;   // s — giris inişi suresi
    if (this.t < entryT) {
      this.y = -J.size / 2 + (J.hoverY + J.size / 2) * (this.t / entryT);
      this.x = Math.max(J.swayAmp + 20, Math.min(CONFIG.W - J.swayAmp - 20, this.x));
    } else {
      const ph = ((this.t - entryT) / J.swayPeriod) * Math.PI * 2;
      this.x = CONFIG.W / 2 + Math.sin(ph) * J.swayAmp;
      this.y = J.hoverY;
    }
    /* Jamming menzili: oyuncu radius icindeyse ates araligi yavaslar.
       Bu bir SIM durumudur (inRange) — cizimden bagimsiz. */
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    this.inRange = (dx * dx + dy * dy) <= J.radius * J.radius;
    /* Ekrandan cikarsa devre disi (yukari dogru suruklenirse). */
    if (this.y > CONFIG.H + 40 || this.x < -40 || this.x > CONFIG.W + 40) this.active = false;
  }
  draw(c, assets) {
    const J = CONFIG.JAMMER;
    const s = J.size;
    c.save();
    c.translate(this.x, this.y);
    /* Menzil halkasi: soluk, nabiz atan (yalniz cizim — sim'e dokunmaz).
       Nabiz: t'ye bagli sinus ile alfa ve yaricap hafif salinir. */
    const pulse = 0.5 + 0.5 * Math.sin(this.t * J.ringPulse);
    const ringR = J.radius * (0.92 + 0.08 * pulse);
    c.globalAlpha = 0.12 + 0.10 * pulse;
    c.strokeStyle = 'rgba(180,120,255,1)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(0, 0, ringR, 0, Math.PI * 2); c.stroke();
    /* Icinde hafif dolgu (menzil okunabilir olsun) */
    c.globalAlpha = 0.04 + 0.03 * pulse;
    c.fillStyle = 'rgba(180,120,255,1)';
    c.beginPath(); c.arc(0, 0, ringR, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
    /* Govde sprite'i — once yuklenen gorsel, yoksa prosedurel */
    assets.draw(c, 'drone_jammer', -s / 2, -s / 2, s, s);
    /* Menzil icindeyken kenar isigi parlaklasir (oyuncuyu zayiflatiyor) */
    if (this.inRange) {
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(200,140,255,0.7)';
      c.lineWidth = 2;
      c.shadowColor = 'rgba(200,140,255,0.6)';
      c.shadowBlur = 8;
      c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

   boot -> menu -> play -> pause -> gameover/victory                        */

/* ---- src/units/Skimmer.js ---- */
/* ----------------------------------------------------------------------- Skimmer
   Round 17: limanin deniz tarafindan gelen dusmani. Diger dusmanlar yukaridan
   iner; skimmer YANDAN girer ve ekrani yatay geçer — liman bolumunun kendi
   silueti. Enemy sinifi sismesin diye ayri sinif.

   Determinizm: Math.random() yok; salinim fazi dt birikimiyle tasinir, dogus
   tarafi/ y konumu game paketindeki LCG'den gelir.
   Sprite: mevcut `drone_scout` kullanilir (yeni varlik uretilmedi) — yatay
   giden govde, yon bayragina gore aynalanir.                                */
class Skimmer {
  constructor() { this.active = false; }
  reset(dir, y) {
    const S = CONFIG.SKIMMER;
    this.dir = dir;                       // -1: sagdan sola, +1: soldan saga
    this.baseY = y;
    this.y = y;
    this.x = dir > 0 ? -S.w : CONFIG.W + S.w;
    this.hp = S.hp;
    this.score = S.score;
    this.radius = S.radius;
    this.phase = 0;                       // salinim fazi (s) — dt birikimi
    this.fired = false;                   // bandda BIR KEZ ates acar
    this.burstLeft = 0;
    this.gapT = 0;
    this.hitFlash = 0;
    this.active = true;
  }
  update(dt, game) {
    if (!this.active) return;
    const S = CONFIG.SKIMMER;
    this.x += this.dir * S.speed * dt;
    this.phase += dt;
    this.y = this.baseY + Math.sin(this.phase * S.waveHz * Math.PI * 2) * S.waveAmp;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    /* Oyuncunun yatay bandina girince BIR KEZ uclu seri: kacis bosluğu kalsin
       diye yon seri basinda sabitlenir (AA ile ayni tasarim). */
    const p = game.player;
    if (!this.fired && p && Math.abs(p.y - this.y) < S.bandY) {
      this.fired = true;
      this.burstLeft = S.burst;
      this.gapT = 0;
    }
    if (this.burstLeft > 0) {
      this.gapT -= dt;
      if (this.gapT <= 0) {
        const dx = p ? p.x - this.x : 0, dy = p ? p.y - this.y : 1;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const b = game.ebulletPool.acquire();
        if (b) {
          b.reset(this.x, this.y, true);
          b.vx = (dx / d) * S.bulletSpeed;
          b.vy = (dy / d) * S.bulletSpeed;
          b.life = 4.0;
        }
        game.sound.enemyShot();
        this.burstLeft--;
        this.gapT = S.burstGapMs / 1000;
      }
    }
    // karsi kenardan cikinca havuza iade
    if (this.dir > 0 ? this.x > CONFIG.W + S.w : this.x < -S.w) this.active = false;
  }
  hit(dmg) {
    if (!this.active) return false;
    this.hp -= dmg;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    if (this.hp <= 0) { this.active = false; return true; }
    return false;
  }
  draw(c, assets) {
    if (!this.active) return;
    const S = CONFIG.SKIMMER;
    c.save();
    c.translate(this.x, this.y);
    /* Yatay ucus: govde gidis yonune 90° cevrilir, yon bayragina gore aynalanir. */
    c.rotate(this.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    const w = S.h, h = S.w;            // dondurulmus cerceve
    if (assets.has('drone_scout')) {
      assets.draw(c, 'drone_scout', -w / 2, -h / 2, w, h);
    } else {
      c.fillStyle = '#7a5a8c';
      c.fillRect(-w * 0.3, -h * 0.42, w * 0.6, h * 0.84);
      c.fillStyle = '#d8e6ff';
      c.fillRect(-w * 0.12, -h * 0.5, w * 0.24, h * 0.2);
    }
    if (this.hitFlash > 0) {
      c.globalAlpha = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalCompositeOperation = 'lighter';
      const wt = assets.whiteTint('drone_scout');
      if (wt) c.drawImage(wt, -w / 2, -h / 2, w, h);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
  state() { return { x: this.x, y: this.y, dir: this.dir, hp: this.hp }; }
}

/* ---- src/units/GroundUnit.js ---- */
/* --------------------------------------------------------------------- GroundUnit
   Round 16: kara hedefleri (liman bolumu). YALNIZCA ground:true olan bolumde
   dogar; dogurmayi game paketi yapar, bu sinif davranisi yazar.

   Bir numarali kural — zemine civili olma:
     Alanlar `x` (ekran x) + `y0`/`spawnDist` (dogus anindaki ekran y ve
     city.dist). Ekran y'si HER KAREDE zemin kaymasindan türetilir:
       screenY = y0 + (city.dist - spawnDist)
     Kendi vy'si YOKTUR; y0/spawnDist sim icinde asla degismez. Boylece bir
     sim adiminda ΔscreenY tam olarak Δcity.dist kadardir — zeminle birebir
     ayni hizda kayar, "ucan bina" olmaz.                                  */
class GroundUnit {
  constructor() { this.active = false; }
  reset(type, x, y0, spawnDist) {
    const G = CONFIG.GROUND;
    const T = G.types[type];
    this.type = type;
    this.sprite = T.sprite;
    this.w = T.w; this.h = T.h;
    this.x = x;                       // ekran x (sim sabiti)
    this.y0 = y0;                     // dogus anindaki ekran y (ekranin ustunde)
    this.spawnDist = spawnDist;       // dogus anindaki city.dist
    this.hp = T.hp;
    this.score = T.score;
    this.hitFlash = 0;                // beyaz tint parlamasi kalan sure (s)
    /* aa tipi: nişanlı seri atis zamanlayicilari (dt birikimi, deterministik) */
    this.fireT = T.fireMs ? T.fireMs / 1000 : Infinity;
    this.burstLeft = 0;               // devam eden seride kalan mermi sayisi
    this.gapT = 0;                    // mermiler arasi gecikme sayaci (s)
    this._aimDX = 0; this._aimDY = 1; // seri baslangicindaki oyuncu yonu (seri boyunca sabit)
    this.inRange = false;             // jammer: oyuncu radius icinde mi (her adimda yeniden)
    this.active = true;
  }
  /* Ekran y konumu — zemin kaymasindan türetilir (cizim VE sim menzili icin). */
  screenY(city) { return this.y0 + (city.dist - this.spawnDist); }
  update(dt, game) {
    if (!this.active) return;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const G = CONFIG.GROUND;
    const p = game.player;
    const sy = this.screenY(game.city);
    switch (this.type) {
      case 'radar':
        /* Pasif — oyunun enemyFireMul etkiyi uygulamasini bekler; burada
           sadece alive bayragi dogru tutulur (hit() ile). */
        break;
      case 'aa':
        /* Nişanlı seri: oyuncu range icindeyse fireMs'de bir burst adet mermi,
           aralarinda burstGapMs. Seri boyunca yon GÜNCELLENMEZ (kacis boslugu). */
        const A = G.types.aa;
        if (this.burstLeft > 0) {
          this.gapT -= dt;
          if (this.gapT <= 0) {
            this.burstLeft--;
            this.gapT = A.burstGapMs / 1000;
            const b = game.ebulletPool.acquire();
            if (b) {
              b.reset(this.x, sy + this.h * 0.35, true);
              b.vx = this._aimDX * A.bulletSpeed;
              b.vy = this._aimDY * A.bulletSpeed;
              /* Round 17: omur mesafeye gore — mermi hedefin onunde havada
                 patlar. Sabit 4 sn ile mermi ekrandan cikiyordu ve flak hic
                 gorunmuyordu (olculdu: 0 kivilcim). */
              const pd = Math.sqrt((game.player.x - this.x) * (game.player.x - this.x) +
                                   (game.player.y - sy) * (game.player.y - sy));
              b.life = Math.max(A.flakMinS,
                       Math.min(A.flakMaxS, (pd / A.bulletSpeed) * A.flakLead));
              b.flak = true;    // omru bitince havada patlar (round 17)
            }
            game.sound.enemyShot();
          }
        } else {
          this.fireT -= dt;
          if (this.fireT <= 0) {
            const dx = p.x - this.x, dy = p.y - sy;
            const d2 = dx * dx + dy * dy;
            if (d2 <= A.range * A.range && sy > -20 && sy < CONFIG.H + 20) {
              const d = Math.sqrt(d2) || 1;
              this._aimDX = dx / d; this._aimDY = dy / d;
              this.burstLeft = A.burst;
              this.gapT = 0;          // ilk mermi hemen
              this.fireT = A.fireMs / 1000;
            } else {
              this.fireT = 100;       // menzil disinda: 100ms sonra tekrar dene
            }
          }
        }
        break;
      case 'jammer':
        /* Hava Jammer'in inRange mantiginin aynisi — her sim adiminda yeniden
           hesaplanir (Round 15'te unutulmustu, tekrarlama). Oyuncunun birincil
           ates araligini fireSlowMul ile yavaslatma etkiyi game uygular. */
        const J = G.types.jammer;
        const jdx = p.x - this.x, jdy = p.y - sy;
        this.inRange = (jdx * jdx + jdy * jdy) <= J.radius * J.radius;
        break;
    }
    /* Ekrandan cikinca devre disi: zemin asagi kaydigi icin hedef de asagi iner;
       ekran altinin belirgin sekilde altina gecince havuza geri verilir. */
    if (sy > CONFIG.H + 80) this.active = false;
  }
  /* Hasar: hp düser; 0'da alive=false, active=false, true döner (game patlama
     + skoru isler). Oyuncu govdesi kara hedefine carpMAZ — carpisma hasari yok. */
  hit(dmg) {
    if (!this.active) return false;
    this.hp -= dmg;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    if (this.hp <= 0) { this.active = false; return true; }
    return false;
  }
  /* Test kancasi: state() — pozisyon hem dünya (worldY) hem ekran (screenY) uzayında. */
  state(city) {
    return {
      type: this.type,
      x: this.x,
      worldY: this.y0 + (city.dist - this.spawnDist),
      screenY: this.screenY(city),
      hp: this.hp,
      alive: this.active,
    };
  }
  draw(c, assets, city) {
    if (!this.active) return;
    const G = CONFIG.GROUND;
    const sy = this.screenY(city);
    const w = this.w, h = this.h;
    c.save();
    c.translate(this.x, sy);
    /* 1) Sert temas gölgesi: sprite silueti DEGIL — basit koyu elips,
       shadowDx/shadowDy kadar kaydirilmis. Gölgeler zeminde kalir; sprite
       onlarin uzerinden geçer gibi durur. */
    c.globalAlpha = G.shadowAlpha;
    c.fillStyle = '#000';
    c.beginPath();
    /* Golge TABANDA durur ve silüetin disina tasar; sprite'in altinda
       kalirsa temas hissi hic olusmaz (olculdu: tasma +0 px). */
    c.ellipse(G.shadowDx, h * 0.34 + G.shadowDy, w * 0.48, h * 0.17, 0, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = 1;
    /* 2) Sprite — manifest çizim boyutunda. Once yuklenen gorsel; PNG YOKSA
       (Assets'e "ground" fallback dali eklenene kadar cizim bozulmasin diye)
       burada koyu gri govde + tip rengi ile prosedurel yedek. */
    if (assets.has(this.sprite)) {
      assets.draw(c, this.sprite, -w / 2, -h / 2, w, h);
    } else {
      const col = this.type === 'radar' ? '#4a7fb5' :
                  this.type === 'aa'    ? '#b5651d' : '#8a4ab5';
      c.fillStyle = '#3a4048';
      c.fillRect(-w * 0.38, -h * 0.42, w * 0.76, h * 0.84);
      c.fillStyle = col;
      if (this.type === 'radar') {
        c.beginPath(); c.arc(0, -h * 0.18, w * 0.22, Math.PI, 0); c.fill();
      } else if (this.type === 'aa') {
        c.fillRect(-w * 0.08, -h * 0.55, w * 0.16, h * 0.3);
      } else {
        c.beginPath(); c.arc(0, -h * 0.15, w * 0.18, 0, Math.PI * 2); c.fill();
      }
    }
    /* 3) Vuruş parlaması: Assets.whiteTint yolu (source-atop + fillRect ASLA
       kullanilmiyor — tuval geneline calisir). */
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const wt = assets.whiteTint(this.sprite);
      if (wt) c.drawImage(wt, -w / 2, -h / 2, w, h);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* ---- src/units/Carrier.js ---- */
class Carrier {
  constructor() { this.active = false; }
  reset(stageIdx) {
    const C = CONFIG.CARRIER;
    this.stageIdx = stageIdx;
    this.x = CONFIG.W / 2;
    this.y = -100;                  // üstten girecek
    this.t = 0;                      // sim saati (s) — giriş + salınım
    this.bodyHp = C.bodyHp;
    this.maxBodyHp = C.bodyHp;
    this.hitFlash = 0;               // gövde vuruş parlaması kalan süre (s)
    /* Parçalar: her biri kendi can'ı, sprite'ı ve konum ofsetiyle.
       Sıra: pylonL, pylonR -> bay -> antenna -> body. */
    this.parts = {};
    for (const id of ['pylonL', 'pylonR', 'bay', 'antenna']) {
      const P = C.parts[id];
      this.parts[id] = { hp: P.hp, maxHp: P.hp, alive: true, hitFlash: 0 };
    }
    /* Atış zamanlayıcıları (sim zamanına bağlı — performance.now YOK) */
    this.pylonFireT = C.pylonFireMs / 1000;
    this.bayLaunchT = C.bayLaunchMs / 1000;
    this._seed = (1000 + stageIdx * 7919) >>> 0;   // LCG tohumu
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  /* Gövde ancak anten düştükten sonra hasar alır. */
  get bodyVulnerable() { return !this.parts.antenna.alive; }
  /* state().carrier için: { parts: {id: hp}, bodyVulnerable } */
  state() {
    const parts = {};
    for (const id in this.parts) parts[id] = this.parts[id].hp;
    return { parts, bodyVulnerable: this.bodyVulnerable };
  }
  update(dt, game) {
    if (!this.active) return;
    const C = CONFIG.CARRIER;
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    /* Giriş inişi: üstten hoverY'ye sabit hız */
    const entryT = C.entryMs / 1000;
    if (this.t < entryT) {
      this.y = -100 + (C.hoverY + 100) * (this.t / entryT);
      this.x = CONFIG.W / 2;
      return;
    }
    /* Salınım: y=hoverY'de sabit, x = merkez ± swayAmp */
    const ph = ((this.t - entryT) / C.swayPeriod) * Math.PI * 2;
    this.x = CONFIG.W / 2 + Math.sin(ph) * C.swayAmp;
    this.y = C.hoverY;
    /* --- Parça saldırıları (yalnızca canlı parçalar ateş eder) --- */
    const p = game.player;
    /* Pilon top ateşi: nişanlı 3'lü yelpaze (her iki pilon ayrı zamanlayıcıda) */
    if (this.parts.pylonL.alive || this.parts.pylonR.alive) {
      this.pylonFireT -= dt;
      if (this.pylonFireT <= 0) {
        this.pylonFireT = C.pylonFireMs / 1000;
        this._firePylons(game, p);
      }
    }
    /* Kargo kapağı: düşman dronu fırlatır */
    if (this.parts.bay.alive) {
      this.bayLaunchT -= dt;
      if (this.bayLaunchT <= 0) {
        this.bayLaunchT = C.bayLaunchMs / 1000;
        this._launchDrone(game);
      }
    }
    /* Anten jammer alanı: oyuncu menzildeyken atış aralığı yavaşlar.
       Bu bir SIM etkisidir — Player.update fireTimer hesaplamasında okunur. */
    const dx = p.x - this.x, dy = p.y - this.y;
    this.inJamRange = this.parts.antenna.alive &&
      (dx * dx + dy * dy) <= C.antennaJamRadius * C.antennaJamRadius;
  }
  /* Pilon top ateşi: her canlı pilondan nişanlı 3'lü yelpaze. */
  _firePylons(game, player) {
    const C = CONFIG.CARRIER;
    const off = C.partOffsets;
    for (const id of ['pylonL', 'pylonR']) {
      if (!this.parts[id].alive) continue;
      const px = this.x + off[id].x, py = this.y + off[id].y;
      const dx = player.x - px, dy = player.y - py;
      const base = Math.atan2(dy, dx);
      for (let i = -1; i <= 1; i++) {
        const a = base + i * (18 * Math.PI / 180);
        this._emit(game, px, py + 20, Math.cos(a) * C.bulletSpeed, Math.sin(a) * C.bulletSpeed);
      }
    }
    game.sound.bossShot();
  }
  /* Kargo kapağı: en yakın aktif düşmana doğru düşman dronu fırlatır.
     Havuzdan scout tipi düşman alınır; yoksa ekrandan aşağı mermi. */
  _launchDrone(game) {
    const C = CONFIG.CARRIER;
    const off = C.partOffsets.bay;
    const bx = this.x + off.x, by = this.y + off.y;
    /* Düşman havuzundan scout al (varsa) */
    const pools = [game.scoutPool, game.gunnerPool, game.kamikazePool];
    let launched = false;
    for (const pool of pools) {
      if (pool.count() >= pool.items.length) continue;   // dolu
      const e = pool.acquire();
      if (!e) continue;
      e.reset('scout', bx, by);
      e.speed = 200;   // yavaş iniş
      launched = true;
      break;
    }
    if (!launched) {
      /* Havuz doluysa: aşağıya 3'lü bomba yelpazesi (yedek saldırı) */
      for (let i = -1; i <= 1; i++) {
        this._emit(game, bx, by + 20, i * 80, 220);
      }
    }
    game.sound.enemyShot();
  }
  _emit(game, x, y, vx, vy) {
    const b = game.ebulletPool.acquire();
    if (!b) return;
    b.reset(x, y, true);
    b.vx = vx; b.vy = vy;
  }
  /* Mermi çarpışması: önce parçalara, sonra gövdeye.
     Geri döndürülen değer: 'part' | 'body' | null */
  hitBullet(bx, by, br) {
    const C = CONFIG.CARRIER;
    /* Önce parçaları dene (konuma en yakın olan) */
    let bestPart = null, bestD = Infinity;
    for (const id in this.parts) {
      const part = this.parts[id];
      if (!part.alive) continue;
      const off = C.partOffsets[id];
      const px = this.x + off.x, py = this.y + off.y;
      const P = C.parts[id];
      const hw = P.w / 2 + br, hh = P.h / 2 + br;
      const dx = bx - px, dy = by - py;
      if (Math.abs(dx) <= hw && Math.abs(dy) <= hh) {
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; bestPart = id; }
      }
    }
    if (bestPart) {
      const part = this.parts[bestPart];
      part.hp--;
      part.hitFlash = CONFIG.FX.hitFlashMs / 1000;
      if (part.hp <= 0) {
        part.alive = false;
        /* Düşen parça patlar ve o parçanın saldırısı durur */
        const off = C.partOffsets[bestPart];
        return { type: 'part', id: bestPart, x: this.x + off.x, y: this.y + off.y };
      }
      return { type: 'hit', id: bestPart };
    }
    /* Gövde: yalnızca anten düştükten sonra hasar alır */
    if (this.bodyVulnerable) {
      const rr = 60 + br;   // gövde hitbox yarıçapı
      const dx = bx - this.x, dy = by - this.y;
      if (dx * dx + dy * dy <= rr * rr) {
        this.bodyHp--;
        this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
        if (this.bodyHp <= 0) return { type: 'bodyKilled' };
        return { type: 'bodyHit' };
      }
    }
    return null;
  }
  draw(c, assets) {
    const C = CONFIG.CARRIER;
    c.save();
    c.translate(this.x, this.y);
    /* Gövde: boss_tokyo sprite'ı (ana gövde). Anten düştükten sonra
       hasar görme efekti: hafif titreme (yalnız çizim). */
    const bodyW = 208, bodyH = 176;
    const shake = this.bodyVulnerable ? (this.hitFlash > 0 ? 2 : 0) : 0;
    const sx = shake ? (this._lcg() - 0.5) * 4 : 0;
    const sy = shake ? (this._lcg() - 0.5) * 4 : 0;
    assets.draw(c, 'boss_tokyo', -bodyW / 2 + sx, -bodyH / 2 + sy, bodyW, bodyH);
    /* Gövde vuruş parlaması */
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint('boss_tokyo');
      if (w) c.drawImage(w, -bodyW / 2, -bodyH / 2, bodyW, bodyH);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    /* Parçalar: her biri kendi sprite'ı + konum ofsetiyle */
    for (const id in this.parts) {
      const part = this.parts[id];
      if (!part.alive) continue;
      const off = C.partOffsets[id];
      const P = C.parts[id];
      c.save();
      c.translate(off.x, off.y);
      assets.draw(c, P.sprite, -P.w / 2, -P.h / 2, P.w, P.h);
      /* Parça vuruş parlaması */
      if (part.hitFlash > 0) {
        const a = Math.min(1, part.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
        c.globalAlpha = a;
        c.globalCompositeOperation = 'lighter';
        const w = assets.whiteTint(P.sprite);
        if (w) c.drawImage(w, -P.w / 2, -P.h / 2, P.w, P.h);
        c.globalAlpha = 1;
        c.globalCompositeOperation = 'source-over';
      }
      /* Can göstergesi: ince bar (parça üstünde) */
      const frac = part.hp / part.maxHp;
      if (frac < 1) {
        c.fillStyle = 'rgba(0,0,0,0.5)';
        c.fillRect(-P.w / 2, -P.h / 2 - 8, P.w, 4);
        c.fillStyle = '#ff5540';
        c.fillRect(-P.w / 2, -P.h / 2 - 8, P.w * frac, 4);
      }
      c.restore();
    }
    /* Anten jammer alanı: soluk nabız halkası (yalnız çizim) */
    if (this.parts.antenna.alive) {
      const pulse = 0.5 + 0.5 * Math.sin(this.t * 1.2);
      const r = C.antennaJamRadius * (0.92 + 0.08 * pulse);
      c.globalAlpha = 0.08 + 0.06 * pulse;
      c.strokeStyle = 'rgba(180,120,255,1)';
      c.lineWidth = 2;
      c.beginPath(); c.arc(0, C.partOffsets.antenna.y, r, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1;
    }
    c.restore();
  }
}

/* ---- src/units/Enemy.js ---- */
class Enemy {
  constructor() { this.reset('scout', 0, 0); }
  reset(type, x, y) {
    const E = CONFIG.ENEMIES[type];
    this.type = type;
    this.x = x; this.y = y;
    this.hp = E.hp;
    this.shieldHp = E.shieldHp || 0;
    this.speed = E.speed;
    this.score = E.score;
    this.radius = E.radius;
    this.sprite = E.sprite;
    this.fireTimer = E.fireInterval ? E.fireInterval : Infinity;
    this.hitFlash = 0;              // beyaz tint parlamasi kalan sure (s)
    /* Round 12: yeni tip durum alanlari */
    this.bombT = E.bombMs ? E.bombMs / 1000 : Infinity;   // bomber bomba sayaci (s)
    this.locked = false;             // kamikaze: kilitlendi mi
    this.lockX = x;                  // kamikaze: kilitleme anindaki oyuncu x
    this.sniperT = E.fireMs ? E.fireMs / 1000 : Infinity; // sniper atis sayaci (s)
    this.telegraphing = false;       // sniper: nişan cizgisi gorunuyor mu
    this.telegraphX = 0;             // sniper: nişan hedefi x (test kancasi)
    this._seed = (x * 31 + y * 17 + 7) >>> 0;  // LCG tohumu (deterministik)
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  update(dt, game) {
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const p = game.player;
    switch (this.type) {
      case 'scout':
      case 'shield':
        this.y += this.speed * dt;
        break;
      case 'gunner':
        this.y += this.speed * dt;
        this.fireTimer -= dt;
        if (this.fireTimer <= 0 && this.y > 40 && this.y < CONFIG.H * 0.7) {
          const st = CONFIG.STAGES[game.stageIdx];
          this.fireTimer = st.gunnerFireMs / 1000;
          const b = game.ebulletPool.acquire();
          if (b) {
            const dx = p.x - this.x, dy = p.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            const sp = st.ebulletSpeed;
            b.reset(this.x, this.y + 20, true);
            b.vx = (dx / d) * sp;
            b.vy = (dy / d) * sp;
            game.sound.enemyShot();
          }
        }
        break;
      case 'bomber':
        // Yavas inis + 1800ms'de bir asagi dogru 3'lü bomba yelpazesi
        this.y += this.speed * dt;
        this.bombT -= dt;
        if (this.bombT <= 0 && this.y > 40 && this.y < CONFIG.H * 0.75) {
          this.bombT = CONFIG.ENEMIES.bomber.bombMs / 1000;
          for (let i = -1; i <= 1; i++) {
            const b = game.ebulletPool.acquire();
            if (b) {
              b.reset(this.x, this.y + 20, true);
              b.vx = i * 70;                 // hafif yatay yelpaze
              b.vy = 200;                     // mermiden yavas (200 px/s)
              b.life = 4.0;
            }
          }
          game.sound.enemyShot();
        }
        break;
      case 'kamikaze':
        if (!this.locked) {
          // Zikzak iniş: sinüs ile yatay salınım + sabit dikey hız
          this.y += this.speed * dt;
          this.x += Math.sin(this.y * 0.04) * 120 * dt;
          // Oyuncunun o anki x'ine KİLİTLEN (ekranın üst üçte birinde)
          if (this.y >= CONFIG.H / 3) {
            this.locked = true;
            this.lockX = p.x;
          }
        } else {
          // Kilitleme: lockX'e hizlanarak dal (260 -> 520 px/s)
          const targetY = p.y;
          const dx = this.lockX - this.x;
          const dy = targetY - this.y;
          const d = Math.hypot(dx, dy) || 1;
          const sp = CONFIG.ENEMIES.kamikaze.lockSpeed;
          this.x += (dx / d) * sp * dt;
          this.y += (dy / d) * sp * dt;
        }
        break;
      case 'sniper':
        // Ekranın üst üçte birinde durur, telegraflı atış
        if (this.y < CONFIG.H * 0.33) {
          this.y += 120 * dt;   // hiza ulaşana kadar in
        } else {
          this.sniperT -= dt;
          if (this.sniperT <= 0) {
            // Atış döngüsü: önce 600ms telegraf, sonra hızlı tek mermi
            if (!this.telegraphing) {
              this.telegraphing = true;
              this.telegraphX = p.x;   // oyuncunun o anki x'i
              this.sniperT = CONFIG.ENEMIES.sniper.telegraphMs / 1000;
            } else {
              this.telegraphing = false;
              this.sniperT = CONFIG.ENEMIES.sniper.fireMs / 1000;
              const b = game.ebulletPool.acquire();
              if (b) {
                const sp = CONFIG.ENEMIES.sniper.bulletSpeed;
                b.reset(this.x, this.y + 20, true);
                b.vx = 0;
                b.vy = sp;   // asagi dogru hizli tek mermi
                b.life = 2.0;
              }
              game.sound.enemyShot();
            }
          }
        }
        break;
    }
    if (this.y > CONFIG.H + 60) { this.active = false; return; }
  }
  hit() {
    if (this.shieldHp > 0) { this.shieldHp--; return false; }
    this.hp--;
    return this.hp <= 0;
  }
  draw(c, assets) {
    const s = this.radius * 2;
    c.save();
    c.translate(this.x, this.y);
    // --- govde sprite'i
    assets.draw(c, this.sprite, -s/2, -s/2, s, s);
    // --- tip ayrimi: kenar isigi (yalnizca bu dronun rengi; hale YOK —
    //     oyuncu tek "hale"li birim kalir)
    c.globalCompositeOperation = 'lighter';
    if (this.type === 'scout') {
      // soğuk gri govde uzerine ince KIRMIZI kenar isigi
      c.strokeStyle = 'rgba(255,70,60,0.85)';
      c.lineWidth = 1.5;
      c.shadowColor = 'rgba(255,70,60,0.7)';
      c.shadowBlur = 5;
      c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI * 2); c.stroke();
    } else if (this.type === 'gunner') {
      // TURUNCU kenar isigi + altta namlu parlamasi
      c.strokeStyle = 'rgba(255,150,40,0.9)';
      c.lineWidth = 2;
      c.shadowColor = 'rgba(255,150,40,0.8)';
      c.shadowBlur = 6;
      c.beginPath(); c.arc(0, 0, s * 0.44, 0, Math.PI * 2); c.stroke();
      c.shadowBlur = 0;
      const mg = c.createRadialGradient(0, s * 0.32, 0, 0, s * 0.32, s * 0.2);
      mg.addColorStop(0, 'rgba(255,190,90,0.9)');
      mg.addColorStop(0.5, 'rgba(255,120,30,0.4)');
      mg.addColorStop(1, 'rgba(255,120,30,0)');
      c.fillStyle = mg;
      c.beginPath(); c.arc(0, s * 0.32, s * 0.2, 0, Math.PI * 2); c.fill();
    }
    // shield: kalkan varken MAVI KABARCIK (kalkan kirilincada soner)
    if (this.type === 'shield' && this.shieldHp > 0) {
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(90,170,255,0.7)';
      c.lineWidth = 2;
      c.beginPath(); c.arc(0, 0, s * 0.55, 0, Math.PI * 2); c.stroke();
      c.fillStyle = 'rgba(90,170,255,0.08)';
      c.fill();
    }
    // Round 12: bomber — altta bomba hazirligi parlamasi (turuncu)
    if (this.type === 'bomber') {
      c.shadowBlur = 0;
      const mg = c.createRadialGradient(0, s * 0.35, 0, 0, s * 0.35, s * 0.22);
      mg.addColorStop(0, 'rgba(255,160,40,0.85)');
      mg.addColorStop(1, 'rgba(255,100,20,0)');
      c.fillStyle = mg;
      c.beginPath(); c.arc(0, s * 0.35, s * 0.22, 0, Math.PI * 2); c.fill();
    }
    // Round 12: kamikaze — kilitlendiginde kisa KIRMIZI uyarı çizgisi (oyuncuya)
    if (this.type === 'kamikaze' && this.locked) {
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,60,40,0.55)';
      c.lineWidth = 1.5;
      c.setLineDash([6, 6]);
      c.beginPath();
      c.moveTo(0, s * 0.3);
      c.lineTo(this.lockX - this.x, 620 - this.y);   // oyuncu y'si ~620
      c.stroke();
      c.setLineDash([]);
      c.globalCompositeOperation = 'source-over';
    }
    // Round 12: sniper — telegraf sirasinda ince KIRMIZI nişan çizgisi
    if (this.type === 'sniper' && this.telegraphing) {
      c.shadowBlur = 0;
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,50,40,0.7)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, s * 0.3);
      c.lineTo(this.telegraphX - this.x, CONFIG.H - this.y);   // ekranin altina
      c.stroke();
      c.globalCompositeOperation = 'source-over';
    }
    c.shadowBlur = 0;
    c.globalCompositeOperation = 'source-over';
    // --- vurus parlamasi: onceden beyaz tint'lenmis kopya, ~90ms, alfa ile soner
    //     (source-atop + fillRect KULLANILMAZ — tuval geneline calisir)
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint(this.sprite);
      if (w) c.drawImage(w, -s/2, -s/2, s, s);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* --------------------------------------------------------------------- Boss
   Bölüm sonu boss'u (round 8). Tek slot, önceden ayrılmış; Math.random YOK —
   tüm rastgelelik LCG'den. Desenler bölüm bazlı ve birikimli:
     1: nişanlı 3'lü yelpaze | 2: + 12'li dairesel patlama
     3: + iki taraftan çapraz tarama | 4: üçü birden, aralıklar %20 kısa
   Girişte 1500 ms kapalı formda iniş, sonra y=150'de 70 px / 3 s salınım.    */

/* ---- src/units/Boss.js ---- */
class Boss {
  constructor() { this.active = false; }
  reset(stageIdx) {
    const B = CONFIG.BOSS;
    this.stageIdx = stageIdx;
    this.maxHp = B.hp[stageIdx];
    this.sprite = B.sprite[stageIdx];   // bolum bazli boss sprite'i (round 11)
    this.hp = this.maxHp;
    this.x = CONFIG.W / 2;
    this.y = -B.size / 2;        // üstten girecek
    this.t = 0;                  // giriş + salınım saati (s)
    this.phase = 1;              // can eşiğine göre 1..4
    this.hitFlash = 0;           // beyaz tint parlaması kalan süre (s)
    this.fanT = 0; this.ringT = 0; this.sweepT = 0;
    this._seed = (1000 + stageIdx * 7919) >>> 0;
    this.active = true;
  }
  _lcg() {
    this._seed = (Math.imul(this._seed, 1664525) + 1013904223) >>> 0;
    return this._seed / 4294967296;
  }
  /* Can eşiği fazı: hp/maxHp >= .75 -> 1, >= .5 -> 2, >= .25 -> 3, aksi 4. */
  _updatePhase() {
    const r = this.hp / this.maxHp;
    this.phase = r >= 0.75 ? 1 : r >= 0.5 ? 2 : r >= 0.25 ? 3 : 4;
  }
  update(dt, game) {
    if (!this.active) return;
    const B = CONFIG.BOSS;
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const entryT = B.entryMs / 1000;
    if (this.t < entryT) {
      // kapalı formda iniş: üstten hoverY'ye doğru sabit hız
      this.y = -B.size / 2 + (B.hoverY + B.size / 2) * (this.t / entryT);
      this.x = CONFIG.W / 2;
      return;
    }
    // salınım: y=hoverY'de sabit, x = merkez ± swayAmp, periyot swayPeriod
    const ph = ((this.t - entryT) / B.swayPeriod) * Math.PI * 2;
    this.x = CONFIG.W / 2 + Math.sin(ph) * B.swayAmp;
    this.y = B.hoverY;
    // --- desen zamanlayıcıları (yalnizca aktif fazdaki desenler ates eder)
    const st = this.stageIdx;
    const fanMs = B.fanMs[st], ringMs = B.ringMs[st], sweepMs = B.sweepMs[st];
    if (this.phase >= 1 && fanMs > 0) {
      this.fanT -= dt * 1000;
      if (this.fanT <= 0) { this.fanT = fanMs; this._fireFan(game); }
    }
    if (this.phase >= 2 && ringMs > 0) {
      this.ringT -= dt * 1000;
      if (this.ringT <= 0) { this.ringT = ringMs; this._fireRing(game); }
    }
    if (this.phase >= 3 && sweepMs > 0) {
      this.sweepT -= dt * 1000;
      if (this.sweepT <= 0) { this.sweepT = sweepMs; this._fireSweep(game); }
    }
  }
  /* Nişanlı 3'lü yelpaze: oyuncuya bakan merkezi açı ± 18°. */
  _fireFan(game) {
    const B = CONFIG.BOSS;
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    const base = Math.atan2(dy, dx);
    for (let i = -1; i <= 1; i++) {
      const a = base + i * (18 * Math.PI / 180);
      this._emit(game, this.x, this.y + 40, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
    }
  }
  /* 12'li dairesel patlama: tam turda eşit açılar, hafif LCG kayması. */
  _fireRing(game) {
    const B = CONFIG.BOSS;
    const off = this._lcg() * Math.PI * 2;
    for (let i = 0; i < 12; i++) {
      const a = off + (i / 12) * Math.PI * 2;
      this._emit(game, this.x, this.y + 20, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
    }
  }
  /* İki taraftan çapraz tarama: soldan ve sağdan aşağı-yoğun 3'er mermi. */
  _fireSweep(game) {
    const B = CONFIG.BOSS;
    const jx = (this._lcg() - 0.5) * 0.3;   // hafif LCG sapması
    for (const side of [-1, 1]) {
      const ox = this.x + side * 60;
      for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 2) + side * (0.28 + i * 0.16) + jx;
        this._emit(game, ox, this.y + 30, Math.cos(a) * B.bulletSpeed, Math.sin(a) * B.bulletSpeed);
      }
    }
  }
  _emit(game, x, y, vx, vy) {
    const b = game.ebulletPool.acquire();
    if (!b) return;
    b.reset(x, y, true);
    b.vx = vx; b.vy = vy;
    game.sound.bossShot();
  }
  hit() {
    this.hp--;
    this.hitFlash = CONFIG.FX.hitFlashMs / 1000;
    this._updatePhase();
    return this.hp <= 0;
  }
  draw(c, assets) {
    const B = CONFIG.BOSS;
    const s = B.size;
    c.save();
    c.translate(this.x, this.y);
    // gövde sprite'i — bölüm bazlı (round 11), önce yüklenen görsel
    assets.draw(c, this.sprite, -s / 2, -s / 2, s, s);
    // vuruş parlaması: sprite'ın önceden beyaz tint'lenmiş kopyası (~90ms)
    if (this.hitFlash > 0) {
      const a = Math.min(1, this.hitFlash / (CONFIG.FX.hitFlashMs / 1000));
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const w = assets.whiteTint(this.sprite);
      if (w) c.drawImage(w, -s / 2, -s / 2, s, s);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }
    c.restore();
  }
}

/* -------------------------------------------------------------------- Player
   Helikopter hissi: ivme + ustel sonum (biraz "kayar"). Hitbox ekranda kalir. */

/* ---- src/units/Player.js ---- */
class Player {
  constructor(droneId) {
    // Round 12: dron secimi — CONFIG.DRONES tablosundan ozellikler gelir
    const D = CONFIG.DRONES.find((d) => d.id === (droneId || 'falcon')) || CONFIG.DRONES[0];
    this.droneId = D.id;
    this.sprite = D.sprite;
    this.maxSpeed = D.speed;
    this.x = CONFIG.W / 2; this.y = CONFIG.H * 0.78;
    this.vx = 0; this.vy = 0;
    this.fireTimer = 0; this.muzzle = 0; this.tilt = 0;
    this.lives = D.lives;
    this.invincible = 0;
    this._invincibleMs = D.invincibleMs || CONFIG.INVINCIBLE_MS;   // ghost: 2000ms
    this._hitboxMul = D.hitboxMul || 1;                            // tank: %15 buyuk
    /* acro-dash: sim zamanina bagli, cizimden bagimsiz. Iz noktalari sabit boyutlu
       dizi (sicak dongude new yok); trailLen kadar slot, en eski uzerine yazar. */
    const DASH = CONFIG.PLAYER.DASH;
    this.dashT = 0;            // kalan dash suresi (s)
    this.dashCd = 0;           // kalan cooldown (s)
    this._dashDirX = 0; this._dashDirY = -1;
    this._trail = [];
    for (let i = 0; i < DASH.trailLen; i++) this._trail.push({ x: 0, y: 0, a: 0 });
    /* Isisi sistemi (round 13): dash + roket + sub-launch is harcar.
       BIRINCIL ATIS IS HARCAMAZ. overheatAt'e ulasinca kilit: ates araligi
       overheatFireMul kadar yavaslar, dash kullanilamaz. recoverAt'in altina
       inince normale doner. Tek kaynak: Game._addHeat — Game.state() ve HUD
       game.heat'i okur; Player kendi degiskenini tutarsa iki gorunum ayrisir. */
    /* Sub-dronlar (round 13): 2 mini refakatci, havuzdan beslenir. */
    this.subs = new Pool(CONFIG.SUBDRONE.pool, () => new SubDrone());
    this._subSide = [1, -1];   // sag, sol — her sub-drone bir tarafa bagli
  }
  /* Mikro kacis hamlesi: 180 ms boyunca 3x hiz + dokunulmazlik. Tetikleme girdi
     paketindedir; buradan yalnizca Player tarafini calistirir. */
  /* Havuza bir sub-dron ekler (pu_subdrone alindiginda). Tek giris noktasi:
     game paketi kendi sayacini doldurmak yerine burayi cagirir. */
  addSub() {
    if (this.subs.count() >= CONFIG.SUBDRONE.max) return false;
    const s = this.subs.acquire();
    if (!s) return false;
    s.reset(this.x, this.y);
    s.mode = 'gun';
    return true;
  }
  dash(dirX, dirY, game) {
    const DASH = CONFIG.PLAYER.DASH;
    if (this.dashCd > 0 || game.overheated) return false;
    /* Is harca: dash is maliyeti — tek kaynak Game.heat (state/HUD oradan okur) */
    game._addHeat(CONFIG.HEAT.cost.dash);
    const len = Math.hypot(dirX, dirY);
    if (len === 0) { dirX = 0; dirY = -1; } else { dirX /= len; dirY /= len; }
    this._dashDirX = dirX; this._dashDirY = dirY;
    this.dashT = DASH.ms / 1000;
    this.dashCd = DASH.cooldownMs / 1000;
    return true;
  }
  get dashActive() { return this.dashT > 0; }
  /* Sub-drone firlat: en yakin aktif dusmana kamikaze modunda git.
     Is harcar; overheated iken calismaz. */
  launchSub(game) {
    if (game.overheated) return false;
    const target = game._nearestEnemy();
    if (!target) return false;
    // En az aktif sub-dronu sec (varsa), yoksa havuzdan al
    let sub = null;
    this.subs.forEach((s) => { if (!sub && s.mode === 'gun') sub = s; });
    if (!sub) {
      sub = this.subs.acquire();
      if (!sub) return false;   // havuz dolu
      sub.reset(this.x, this.y);
    }
    game._addHeat(CONFIG.HEAT.cost.subLaunch);
    sub.launch(target);
    return true;
  }
  /* Hitbox yaricapi (tank %15 buyuk). */
  hitR() { return CONFIG.PLAYER.half * this._hitboxMul; }
  takeHit() {
    if (this.invincible > 0 || this.dashT > 0) return false;   // dash suresince dokunulmaz
    this.lives--;
    this.invincible = this._invincibleMs / 1000;
    return true;
  }
  /* Sinir kelepcesi: hitbox ekran icinde kalir, temasta o eksenin hizi sifirlanir. */
  _clamp() {
    const h = CONFIG.PLAYER.half;
    if (this.x < h) { this.x = h; if (this.vx < 0) this.vx = 0; }
    else if (this.x > CONFIG.W - h) { this.x = CONFIG.W - h; if (this.vx > 0) this.vx = 0; }
    if (this.y < h) { this.y = h; if (this.vy < 0) this.vy = 0; }
    else if (this.y > CONFIG.H - h) { this.y = CONFIG.H - h; if (this.vy > 0) this.vy = 0; }
  }
  update(dt, input, game) {
    const P = CONFIG.PLAYER;
    let { ax, ay } = input.axis();          // const idi: dokunmatik yol atama
    let hasInput = (ax !== 0 || ay !== 0);  // yapinca TypeError firlatiyordu
    /* Dokunmatik: BIREBIR bagil takip. Parmagin bastigi noktaya ucmak yerine,
       parmagin bastigindan beri kaydigi kadar dron kayar — parmak dronu
       kapatmaz ve nisan almak birebir olur (game/ projesinde dogrulanan tasarim).
       Ivme/atalet devre disi: hedefe hiz sinirli, dogrudan gidilir. */
    if (input.touchDX != null) {
      const tx = Math.max(P.half, Math.min(CONFIG.W - P.half, input.baseX + input.touchDX));
      const ty = Math.max(P.half, Math.min(CONFIG.H - P.half, input.baseY + input.touchDY));
      const dx = tx - this.x, dy = ty - this.y;
      const dist = Math.hypot(dx, dy);
      const step = P.followSpeed * dt;
      if (dist <= step || dist === 0) { this.x = tx; this.y = ty; this.vx = 0; this.vy = 0; }
      else { this.x += dx / dist * step; this.y += dy / dist * step;
             this.vx = dx / dist * P.followSpeed; this.vy = dy / dist * P.followSpeed; }
      this._clamp();
      hasInput = false;          // hareket bu dalda tamamlandi
      ax = 0; ay = 0;
    } else if (hasInput) {
      this.vx += ax * P.accel * dt;
      this.vy += ay * P.accel * dt;
    } else {
      // ustel sonum: yaromuru 0.12 s
      const f = Math.pow(0.5, dt / P.decayHalfLife);
      this.vx *= f; this.vy *= f;
      if (Math.abs(this.vx) < 0.5) this.vx = 0;
      if (Math.abs(this.vy) < 0.5) this.vy = 0;
    }
    /* Dokunmatik dalda konum zaten hesaplandi; ivme/entegrasyon adimlari
       yalnizca klavye yolunda calisir. Ilk denemede bu dal `return` ediyordu ve
       ates kodu hic calismiyordu — klavyeyle atis sayisi 0'a dustu. */
    const touchDriven = (input.touchDX != null);
    /* Dash tetikleme: input.consumeDash() tek seferlik bayragi okur.
       Is soneumu Game._simStep yapar (tek kaynak game.heat). */
    const dashDir = input.consumeDash();
    if (dashDir) this.dash(dashDir.x, dashDir.y, game);
    /* Sub-drone firlatma: input._subLaunchQueued bayragi */
    if (input._subLaunchQueued) {
      input._subLaunchQueued = false;
      this.launchSub(game);
    }
    const DASH = CONFIG.PLAYER.DASH;
    /* acro-dash: sim zamanina bagli 3x hamle. Dash sirasinda normal hareket
       devre disi kalir; iz noktasi her adimda en eski slotun uzerine yazilir. */
    if (this.dashT > 0) {
      const dSp = this.maxSpeed * DASH.speedMul;
      this.vx = this._dashDirX * dSp; this.vy = this._dashDirY * dSp;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const tr = this._trail, n = tr.length, gap = DASH.trailGap;
      for (let i = n - 1; i >= 1; i--) {
        const c = tr[i], p = tr[i - 1];
        c.x = p.x; c.y = p.y; c.a = Math.min(1, p.a + gap / (DASH.ms / 1000));
      }
      tr[0].x = this.x; tr[0].y = this.y; tr[0].a = 1;
      this.dashT -= dt;
      if (this.dashT < 0) this.dashT = 0;
    } else {
      const ms = this.maxSpeed;   // Round 12: dron bazli maks hiz
      if (!touchDriven) {
        // maks hiz
        const sp = Math.hypot(this.vx, this.vy);
        if (sp > ms) { const k = ms / sp; this.vx *= k; this.vy *= k; }
        // entegre
        this.x += this.vx * dt; this.y += this.vy * dt;
      }
    }
    if (this.dashCd > 0) this.dashCd -= dt;
    // dash bitince izi sonumle (cizim tarafinda kullanilir)
    for (const t of this._trail) {
      if (t.a > 0) { t.a -= dt / (DASH.ms / 1000); if (t.a < 0) t.a = 0; }
    }
    // hitbox ekranda kalir, temasta o eksenin hizi sifirlanir
    const h = this.hitR();
    if (this.x < h) { this.x = h; this.vx = 0; }
    if (this.x > CONFIG.W - h) { this.x = CONFIG.W - h; this.vx = 0; }
    if (this.y < h) { this.y = h; this.vy = 0; }
    if (this.y > CONFIG.H - h) { this.y = CONFIG.H - h; this.vy = 0; }
    // hafif yalpa: yatay hiza bagli ±6° (yalniz cizim)
    let targetTilt = Math.max(-1, Math.min(1, this.vx / this.maxSpeed)) * (6 * Math.PI / 180);
    if (this.dashT > 0) {
      /* Dash sirasinda govde 25° yatar (yalniz cizim) — hamle yonune dogru. */
      targetTilt = Math.atan2(this._dashDirY, this._dashDirX) * (25 / 90);   // ±25°
    }
    this.tilt += (targetTilt - this.tilt) * Math.min(1, dt * 12);
    // ates (round 10: uc seviye, PARALEL mermi — round 12: swift %15 kisa aralik)
    // Round 13: overheated iken ates araligi overheatFireMul kadar yavaslar
    this.fireTimer -= dt;
    if (input.firing() && this.fireTimer <= 0) {
      const W = CONFIG.WEAPON;
      const lv = W.levels[game.weaponLevel - 1];
      let interval = lv.interval;
      if (this.droneId === 'swift') interval *= 0.85;   // swift: %15 kisa
      if (game.overheated) interval /= CONFIG.HEAT.overheatFireMul;   // is kilidi
      /* Round 16: jammer (kara veya hava) menzilde -> ates araligi uzar.
         Tek kaynak game.fireSlowMul; Game._computeFireMods her sim adiminda
         hesaplar ve iki jammer ayni anda etkiliyse carpan bir kez uygulanir. */
      if (game.fireSlowMul && game.fireSlowMul < 1) interval /= game.fireSlowMul;
      this.fireTimer = this.poolSize || interval;
      this.muzzle = CONFIG.FIRE.muzzleMs / 1000;
      const offsets = lv.count === 1 ? [0] :
                      lv.count === 2 ? [-lv.offset, lv.offset] :
                                        [-lv.offset, 0, lv.offset];
      for (const ox of offsets) {
        const b = game.bulletPool.acquire();
        if (b) { b.reset(this.x + ox, this.y - h); }
      }
      /* Atis sayaci Game'in tek giris noktasindan gecer: hem shotsFired hem
         kosu istatistigi (_stats.shots) orada artar. Burada dogrudan
         `game.shotsFired += ...` yazilirsa istatistik sifir kalir. */
      game.addShots(offsets.length);
      game.sound.playerShot();
    }
    if (this.muzzle > 0) this.muzzle -= dt;
    if (this.invincible > 0) this.invincible -= dt;
    /* Sub-dronlar: takip + ates / kamikaze ilerleme */
    this.subs.forEach((s) => s.update(dt, game));
  }
  draw(ctx, assets) {
    const P = CONFIG.PLAYER;
    /* acro-dash izi: dash sirasinda ve bitiminden sonra kisa bir sure,
       govdenin arkasinda solan alfa kopyalari (yalniz cizim). */
    for (const t of this._trail) {
      if (t.a <= 0.01) continue;
      ctx.save();
      ctx.globalAlpha = t.a * 0.35;
      ctx.translate(t.x, t.y);
      ctx.rotate(this.tilt);
      const s = P.size * 1.1;
      assets.draw(ctx, this.sprite, -s/2, -s/2, s, s);
      ctx.restore();
    }
    // Round 4: tam cyan cerceg DEGIL — dronun altina yumusak radyal koyu hale
    // (sehir dokusunu bastirip silueti ayirir) + govde kenarina ince cyan
    // kenar isigi. Amaç: dron her zaman okunsun ama sahneye ait gorunsun.
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);
    // dokunulmazlik: yanip sonek (100ms periyot)
    if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) {
      ctx.globalAlpha = 0.3;
    }
    // 1) yumusak radyal koyu hale (alfa <= 0.35, yaricap ~ dron genisligi x 0.8)
    /* Hale guclendirildi: denetim turlarca "dron parlak sehir isiklarinda
       kaynasiyor" dedi ve bu dogruydu — zemin gece sehri oldugu icin bazi
       bolgeler dronun kendisinden parlak. Sehri karartmak yerine (denendi,
       sehir sahnenin yildizi) dronun altindaki koyu zemini buyutup
       koyulastiriyoruz: silüet her zeminde ayrisiyor.                        */
    const haloR = P.size * 1.05;
    const halo = ctx.createRadialGradient(0, 0, P.half * 0.35, 0, 0, haloR);
    halo.addColorStop(0, 'rgba(3,6,12,0.62)');
    halo.addColorStop(0.45, 'rgba(3,6,12,0.42)');
    halo.addColorStop(0.75, 'rgba(3,6,12,0.18)');
    halo.addColorStop(1, 'rgba(3,6,12,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, haloR, 0, Math.PI * 2); ctx.fill();
    // 2) dron sprite'i (%10 buyuk — ekranda belirgin). Round 12: secilen dron
    const s = P.size * 1.1;
    assets.draw(ctx, this.sprite, -s/2, -s/2, s, s);
    // 3) ince cyan kenar isigi (1-2 px, govde kenarina oturan parlaklik)
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(110,235,255,0.95)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(110,235,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 0, this.hitR() * 0.92, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    // namlu alevi (her atista 60ms gorunur, parlak)
    if (this.muzzle > 0) {
      const a = this.muzzle / (CONFIG.FIRE.muzzleMs / 1000);
      ctx.save(); ctx.globalAlpha = a;
      ctx.globalCompositeOperation = 'lighter';
      assets.draw(ctx, 'muzzle_flash', this.x - 24, this.y - P.half - 30, 48, 48);
      ctx.restore();
    }
    /* Sub-dronlar: oyuncunun yaninda cizilir */
    this.subs.forEach((s) => s.draw(ctx, assets));
  }
}

/* ---------------------------------------------------------------------- Game
   boot -> menu -> play -> pause -> gameover/victory                        */

/* ---- src/game/Game.js ---- */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new Renderer(canvas);
    this.assets = new Assets(MANIFEST);
    this.clock = new Clock(CONFIG.SIM_HZ);
    this.input = new Input(this);
    this.bulletPool = new Pool(CONFIG.FIRE.pool, () => new Bullet());
    this.ebulletPool = new Pool(CONFIG.ENEMY_BULLET_POOL, () => new Bullet());
    this.scoutPool = new Pool(16, () => new Enemy());
    this.gunnerPool = new Pool(8, () => new Enemy());
    this.shieldPool = new Pool(8, () => new Enemy());
    /* Round 12: uc yeni dusman tipi — kendi havuzlari (sicak dongude `new` yok) */
    this.bomberPool = new Pool(8, () => new Enemy());
    this.kamikazePool = new Pool(10, () => new Enemy());
    this.sniperPool = new Pool(4, () => new Enemy());
    /* Round 15: jammer dronu — kendi havuzu (CONFIG.JAMMER.pool).
       Ates etmez; menzildeyken oyuncuyu zayiflatir + ambient glitch tetikler. */
    this.jammerPool = new Pool(CONFIG.JAMMER.pool, () => new Jammer());
    /* Round 16: kara hedefleri — YALNIZCA ground:true olan bolumde dogar. */
    this.groundPool = new Pool(CONFIG.GROUND.pool, () => new GroundUnit());
    /* Round 17: skimmer — limanin yandan giren dusmani (units paketi). */
    this.skimmerPool = new Pool(CONFIG.SKIMMER.pool, () => new Skimmer());
    this._skimmerT = 0;          // dogus sayaci (s)
    this._skimSeed = 0;          // skimmer dogusu icin ayri LCG tohumu
    this._groundBuiltUpTo = -1;   // son uretilen slot (slot tabanli LCG)
    this._groundSeed = 42;        // kara hedefi LCG tohumu (deterministik)
    /* Round 12: roket havuzu (kendi havuzu, 8) */
    this.rocketPool = new Pool(CONFIG.ROCKET.pool, () => new Rocket());
    this.player = new Player('falcon');
    this.city = new CityScroller(this.assets);   // sehir paralaks katmani
    this.clouds = new CloudLayer(this.assets);   // bulut katmani (round 10)
